          { id: 'q_2_9', isParent: true,
            text: { ka: 'არის კლიენტთა კმაყოფილების შეფასების პროცედურა?', en: 'Are there customer satisfaction procedures?' },
            tooltip: { ka: 'კლიენტთა კმაყოფილების შეფასება ნიშნავს, რომ კომპანია იკვლევს, რამდენად კმაყოფილები არიან კლიენტები - გამოკითხვებით, ანკეტებით, ან რეგულარული უკუკავშირით. შემდეგ ამ ინფორმაციით ცდილობთ გაუმჯობესდეთ. გაქვთ ასეთი პროცედურა?', en: 'Customer satisfaction evaluation means the company measures how satisfied customers are - through surveys, questionnaires, or regular feedback. The information is used to improve. Do you have such a procedure?' } },
          { id: 'q_2_10',
            text: { ka: 'არსებობს საჩივრებისა და კრიზის მართვის პროცედურა?', en: 'Does a claim and crisis management procedure exist?' },
            tooltip: { ka: 'საჩივრების მართვის პროცედურა არის წერილობითი წესები, თუ რა უნდა გააკეთოს კომპანიამ, როცა კლიენტი უკმაყოფილოა - ვინ მიიღებს საჩივარს, რა ვადებში უნდა მოგვარდეს, როგორ მოწმდება რომ პრობლემა მართლაც გადაიჭრა. კრიზის მართვა - სერიოზულ პრობლემებზე (მაგ. ხარვეზიანი პროდუქცია, რომელიც უკვე გაიგზავნა).', en: 'A claim management procedure is a written set of rules for what the company does when a customer is dissatisfied - who receives the complaint, deadlines for resolution, how to verify the problem was actually solved. Crisis management deals with serious problems (e.g. defective products already shipped).' } },
          { id: 'q_2_11',
            text: { ka: 'არის შეკვეთის თვალყურის-დევნების პროცედურა?', en: 'Are there order follow-up procedures?' },
            tooltip: { ka: 'შეკვეთის თვალყურის-დევნება ნიშნავს, რომ კომპანიას შეუძლია ნებისმიერ მომენტში გაარკვიოს, რა სტადიაშია მომხმარებლის შეკვეთა - მიღებულია, წარმოებაშია, შეფუთულია, გაიგზავნა და ა.შ. ეს შეიძლება იყოს ციფრული სისტემა (ERP) ან ხელით წარმოებული ჩანაწერები.', en: 'Order tracking means the company can check at any moment what stage a customer order is in - received, in production, packed, shipped, etc. This can be a digital system (ERP) or hand-kept records.' } },
          { id: 'q_2_12',
            text: { ka: 'აქვს მომწოდებელს დოკუმენტების მართვის სისტემა?', en: 'Does the supplier have a document management system?' },
            tooltip: { ka: 'დოკუმენტების მართვის სისტემა არის ორგანიზებული გზა მნიშვნელოვანი ფაილების შესანახად, საძიებლად და გასაახლებლად - შეიძლება იყოს ელექტრონული (Google Drive, SharePoint, ან სპეციალიზებული პროგრამა) ან ფიზიკური (კლასიფიცირებული საქაღალდეები).', en: 'A document management system is an organized way to store, search, and update important files - can be electronic (Google Drive, SharePoint, or specialized software) or physical (classified folders).' } },
          { id: 'q_2_13', isParent: true,
            text: { ka: 'არის ტრენინგ-პროგრამები მენეჯმენტისთვის და თანამშრომლებისთვის?', en: 'Are there training programs for management and employees?' },
            tooltip: { ka: 'ტრენინგ-პროგრამა არის დაგეგმილი სასწავლო პროცესი თანამშრომლებისთვის, რომ მათ უკეთ შეასრულონ თავიანთი სამუშაო ან მიიღონ ახალი უნარები. შეიძლება იყოს შიდა ტრენინგი, გარე კურსები, ვებინარები. ტარდება ასეთი ტრენინგები კომპანიაში?', en: 'A training program is a planned learning process for employees to perform their work better or acquire new skills. Can be internal training, external courses, webinars. Are such trainings conducted in your company?' } },
          { id: 'q_2_13_1', parent: 'q_2_13',
            text: { ka: 'თანამშრომლები საკმარისად კვალიფიციურები არიან?', en: 'Are the employees properly skilled for their role?' },
            tooltip: { ka: 'ეს კითხვა ეკითხება - შეესაბამება თუ არა თქვენი თანამშრომლების უნარები იმ პოზიციას, რომელზეც ისინი მუშაობენ. მაგ. ხარისხის ინჟინერს აქვს შესაბამისი გამოცდილება და ცოდნა? ოპერატორებს იციან მანქანების უსაფრთხო გამოყენება?', en: 'This question asks whether your employees skills match the positions they work in. E.g. does the quality engineer have relevant experience and knowledge? Do operators know how to safely use machines?' } },
          { id: 'q_2_13_2', parent: 'q_2_13',
            text: { ka: 'არის მუშათა ტრენინგისა და ცოდნის ამაღლების პროგრამა?', en: 'Are there worker training or knowledge programs?' },
            tooltip: { ka: 'მუშაკთა ტრენინგი ნიშნავს სპეციალურად იმ ხალხისთვის, ვინც ფიზიკურად ასრულებს სამუშაოს (არა მენეჯმენტი) - ოპერატორები, ხელოსნები, შემფუთველები. ცოდნის ამაღლება მოიცავს ახალ მეთოდებს, უსაფრთხოების ნორმებს, ხარისხის სტანდარტებს.', en: 'Worker training is specifically for those who physically perform the work (not management) - operators, craftsmen, packers. Knowledge enhancement covers new methods, safety standards, quality standards.' } },
          { id: 'q_2_14', isParent: true,
            text: { ka: 'მოწოდებული მასალები მოწმდება შემოსვლისას?', en: 'Are incoming materials inspected upon arrival?' },
            tooltip: { ka: 'როცა მიიღებთ მასალას მომწოდებლისგან (მაგ. ნედლეული, ნაწილები), ამოწმებთ თუ არა, რომ ის შეესაბამება შეკვეთილ მოთხოვნებს - სწორი რაოდენობა, ხარისხი, სპეციფიკაცია? ეს არის ხარვეზიანი მასალის ადრეული გამოვლენის გზა.', en: 'When you receive materials from a supplier (e.g. raw materials, parts), do you check that they match the ordered specifications - correct quantity, quality, specifications? This is a way to detect defective material early.' } },
          { id: 'q_2_14_1', parent: 'q_2_14',
            text: { ka: 'არის შემოსული მასალების ინსპექციის წერილობითი პროცედურა?', en: 'Are there written inspection procedures for incoming materials?' },
            tooltip: { ka: 'წერილობითი ინსპექციის პროცედურა ნიშნავს, რომ გაქვთ დაწერილი დოკუმენტი - რას ამოწმებთ, როგორ ამოწმებთ, რა მოთხოვნებია, ვინ აწერს ხელს. ეს უზრუნველყოფს, რომ ყოველთვის ერთნაირად ხდება შემოწმება, ვინც არ უნდა გააკეთოს.', en: 'A written inspection procedure means a documented file - what to check, how to check, what requirements apply, who signs off. This ensures inspection is always done the same way, no matter who performs it.' } },
          { id: 'q_2_14_2', parent: 'q_2_14',
            text: { ka: 'მიღებული და უარყოფილი მასალები ცალ-ცალკე ინახება?', en: 'Are accepted vs rejected materials kept segregated?' },
            tooltip: { ka: 'სეგრეგაცია ნიშნავს, რომ ფიზიკურად განცალკავებულია მისაღები მასალა და უარყოფილი (ხარვეზიანი) მასალა - სხვადასხვა ადგილას, ცხადად მონიშნული. ეს იცავს იმისგან, რომ შემთხვევით უხარისხო მასალა არ მოხვდეს წარმოებაში.', en: 'Segregation means physically separating accepted and rejected (defective) materials - in different locations, clearly marked. This prevents accidentally using defective material in production.' } },
          { id: 'q_2_15', isParent: true,
            text: { ka: 'არის წერილობითი პროცედურები ყველა საწარმოო პროცესისთვის?', en: 'Are there written procedures for all manufacturing processes?' },
            tooltip: { ka: 'წერილობითი პროცედურა (Standard Operating Procedure - SOP) არის ნაბიჯ-ნაბიჯი ინსტრუქცია, თუ როგორ უნდა შესრულდეს თითოეული საწარმოო პროცესი. ეს უზრუნველყოფს, რომ ყველა მუშაკი ერთნაირად ასრულებს სამუშაოს, რაც იძლევა სტაბილურ ხარისხს.', en: 'A written procedure (Standard Operating Procedure - SOP) is a step-by-step instruction for how each manufacturing process should be performed. This ensures all workers do the work the same way, providing stable quality.' } },
          { id: 'q_2_15_1', parent: 'q_2_15',
            text: { ka: 'მნიშვნელოვანი მახასიათებლები მონიტორინგდება წარმოების დროს?', en: 'Are important characteristics monitored during production?' },
            tooltip: { ka: 'წარმოების დროს მონიტორინგი ნიშნავს, რომ რეალურ დროში ამოწმებთ კრიტიკულ პარამეტრებს - ტემპერატურა, წნევა, ზომები, წონა. თუ რამე გადაუხვევს ნორმიდან, მაშინვე ვიგებთ და ვასწორებთ, ხარვეზიანი პროდუქციის წარმოებამდე.', en: 'In-process monitoring means checking critical parameters in real time - temperature, pressure, dimensions, weight. If something deviates from norms, we know immediately and correct before defective products are made.' } },
          { id: 'q_2_15_2', parent: 'q_2_15',
            text: { ka: 'ტარდება საბოლოო ინსპექცია თითოეულ პარტიაზე?', en: 'Is final inspection performed on each lot?' },
            tooltip: { ka: 'საბოლოო ინსპექცია ნიშნავს, რომ თითოეული პარტიის (lot) გადაგზავნამდე ვამოწმებთ, შეესაბამება თუ არა ის შეკვეთილ მოთხოვნებს. პარტია შეიძლება იყოს ერთი დღის წარმოება, ან ერთი შეკვეთის რაოდენობა. ეს უკანასკნელი ხაზია ხარვეზის გამოვლენისთვის.', en: 'Final inspection means checking each batch (lot) before shipment to verify compliance with order requirements. A batch can be one day production or one order quantity. This is the last line of defect detection.' } }
        ]
      },
      // SECTION 2: HUMAN RIGHTS
      {
        key: 'humanRights',
        questions: [
          { id: 'q_3_1', isParent: true,
            text: { ka: 'აქვს კომპანიას ადამიანის უფლებების დაცვის პოლიტიკა?', en: 'Has the company established human rights policies?' },
            tooltip: { ka: 'ადამიანის უფლებების პოლიტიკა არის წერილობითი დოკუმენტი, რომელშიც კომპანია აცხადებს თავის ვალდებულებას დაიცვას თანამშრომლების და სხვა ადამიანების ძირითადი უფლებები - სიცოცხლე, თავისუფლება, ღირსება, თანასწორობა. ეს უნდა იყოს ფორმალური დოკუმენტი, არა მხოლოდ სიტყვიერი ვალდებულება.', en: 'A human rights policy is a written document where the company declares its commitment to protect the basic rights of employees and others - life, freedom, dignity, equality. This should be a formal document, not just a verbal commitment.' } },
          { id: 'q_3_1_1', parent: 'q_3_1',
            text: { ka: 'უზრუნველყოფს უსაფრთხო და ჯანსაღ სამუშაო პირობებს?', en: 'Are safe and healthy working conditions provided?' },
            tooltip: { ka: 'უსაფრთხო და ჯანსაღი სამუშაო პირობები მოიცავს - სუფთა ჰაერს, შესაბამის განათებას, უსაფრთხო მანქანებს, დაცვის საშუალებებს (ხელთათმანები, ჩაფხუტი), ხანძარსაწინააღმდეგო სისტემებს, პირველად დახმარებას. თქვენ თანამშრომლებს რეალურად სთავაზობთ ამ პირობებს?', en: 'Safe and healthy working conditions include clean air, appropriate lighting, safe machines, protective equipment (gloves, helmets), fire safety systems, first aid. Do you actually provide these conditions to employees?' } },
          { id: 'q_3_1_2', parent: 'q_3_1',
            text: { ka: 'უზრუნველყოფს გაერთიანების თავისუფლებას?', en: 'Is freedom of association guaranteed?' },
            tooltip: { ka: 'გაერთიანების თავისუფლება ნიშნავს, რომ თანამშრომლებს უფლება აქვთ გაერთიანდნენ ჯგუფებში (პროფკავშირები, კომიტეტები) საერთო ინტერესების დასაცავად, კომპანიის შურისძიების შიშის გარეშე. ეს არის საერთაშორისო შრომითი ნორმა.', en: 'Freedom of association means employees have the right to form groups (unions, committees) to protect common interests, without fear of retaliation from the company. This is an international labor norm.' } },
          { id: 'q_3_1_3', parent: 'q_3_1',
            text: { ka: 'უზრუნველყოფს არადისკრიმინაციულ კადრების პოლიტიკას?', en: 'Is non-discrimination ensured in personnel practices?' },
            tooltip: { ka: 'არადისკრიმინაცია ნიშნავს, რომ დაქირავება, ხელფასი, დაწინაურება, გათავისუფლება ეფუძნება პროფესიულ უნარებს - არა სქესს, ასაკს, რასას, რელიგიას, ეროვნებას, შშმ სტატუსს, ან სექსუალურ ორიენტაციას. გაქვთ ამის უზრუნველმყოფი წესები?', en: 'Non-discrimination means hiring, salary, promotion, and dismissal are based on professional skills - not gender, age, race, religion, nationality, disability status, or sexual orientation. Do you have rules ensuring this?' } },
          { id: 'q_3_1_4', parent: 'q_3_1',
            text: { ka: 'არ იყენებს იძულებით ან ბავშვთა შრომას?', en: 'Is forced or child labour avoided directly and indirectly?' },
            tooltip: { ka: 'იძულებითი შრომა - ადამიანი მუშაობს იძულებით (ვალის ბრუნდად, საბუთების ჩამორთმევით, ფიზიკური მუქარით). ბავშვთა შრომა - 18 წლამდე პირების დაქირავება საფრთხის შემცველ ან განათლების შემაფერხებელ სამუშაოზე. ეს ეხება არა მხოლოდ თქვენ პირდაპირ, არამედ თქვენს მომწოდებლებს.', en: 'Forced labor - a person works under coercion (debt bondage, document confiscation, physical threats). Child labor - hiring people under 18 for hazardous work or work that interferes with education. This applies not only to you directly, but also to your suppliers.' } },
          { id: 'q_3_2', isParent: true,
            text: { ka: 'ჩაატარა კომპანიამ ადამიანის უფლებების შეფასება იმ ქვეყნებში, სადაც საქმიანობს?', en: 'Has the company performed a human rights assessment in operating countries?' },
            tooltip: { ka: 'ეს კითხვა ისმის - შეისწავლეთ თუ არა ადამიანის უფლებების მდგომარეობა იმ ქვეყნებში, სადაც საქმიანობთ ან გეგმავთ საქმიანობას? ზოგიერთ ქვეყანაში მაღალია რისკი (იძულებითი შრომა, ბავშვთა შრომა, კორუფცია), რის გათვალისწინებაც აუცილებელია.', en: 'This asks whether you have studied the human rights situation in countries where you operate or plan to operate. In some countries the risk is high (forced labor, child labor, corruption), which must be considered.' } },
          { id: 'q_3_2_1', parent: 'q_3_2',
            text: { ka: 'აქვს კომპანიას მკაფიო პოლიტიკა, რომელიც იცავს როგორც საკუთარი თანამშრომლების, ასევე მიწოდების ჯაჭვის მუშაკთა უფლებებს?', en: 'Does the company have explicit policies protecting workers human rights in employment and supply chain?' },
            tooltip: { ka: 'პოლიტიკა უნდა იცავდეს არა მხოლოდ თქვენს პირდაპირ თანამშრომლებს, არამედ ყველას, ვინც თქვენი მიწოდების ჯაჭვშია - მომწოდებლების მუშაკები, სუბკონტრაქტორები, ლოჯისტიკის გუნდი. გაქვთ პოლიტიკა, რომელიც მთელ ჯაჭვს ფარავს?', en: 'The policy should protect not only your direct employees but everyone in your supply chain - supplier workers, subcontractors, logistics teams. Do you have a policy covering the entire chain?' } },
          { id: 'q_3_2_2', parent: 'q_3_2',
            text: { ka: 'აქვს მონიტორინგის სისტემა?', en: 'Has the company established monitoring/tracking system?' },
            tooltip: { ka: 'მონიტორინგის სისტემა ამოწმებს, რომ პოლიტიკა რეალურად მუშაობს - მაგ. რეგულარული აუდიტი, ანონიმური საჩივრების სისტემა, მომწოდებლების შემოწმება. ქაღალდზე დაწერილი პოლიტიკა საკმარისი არ არის - საჭიროა მისი აღსრულების ვერიფიკაცია.', en: 'A monitoring system verifies the policy actually works - e.g. regular audits, anonymous complaint systems, supplier checks. A policy on paper is not enough - its enforcement must be verified.' } },
          { id: 'q_3_2_3', parent: 'q_3_2',
            text: { ka: 'აქვს პოლიტიკა, რომ უსაფრთხოების ღონისძიებები არ იწვევდეს უფლებების დარღვევას?', en: 'Does security policy avoid contributing to human rights violations?' },
            tooltip: { ka: 'უსაფრთხოების სამსახური (კერძო დაცვა, კონტრაქტორები) ხანდახან არღვევს თანამშრომლების უფლებებს - ფიზიკური ძალის გადაჭარბებული გამოყენება, თვალთვალი, შეუსაბამო ჩხრეკა. გაქვთ წესები, რომლებიც ამას ხელს უშლის?', en: 'Security services (private guards, contractors) sometimes violate employee rights - excessive force, surveillance, inappropriate searches. Do you have rules preventing this?' } }
        ]
      },
      // SECTION 3: LABOUR
      {
        key: 'labour',
        questions: [
          { id: 'q_4_1', isParent: true,
            text: { ka: 'კომპანია პატივს სცემს მუშაკთა უფლებას შექმნან პროფკავშირები?', en: 'Does the company respect workers right to form trade unions?' },
            tooltip: { ka: 'პროფკავშირი არის თანამშრომლების ნებაყოფლობითი გაერთიანება საერთო ინტერესების დასაცავად - ხელფასი, სამუშაო პირობები, უსაფრთხოება. პატივისცემა ნიშნავს, რომ კომპანია არ უშლის ხელს მათ შექმნას, არ ერევა მათ საქმიანობაში, არ ისჯება პროფკავშირის წევრობას.', en: 'A trade union is a voluntary association of employees to protect common interests - salary, working conditions, safety. Respect means the company does not hinder their formation, does not interfere with their activities, does not punish union membership.' } },
          { id: 'q_4_1_1', parent: 'q_4_1',
            text: { ka: 'აქვს არადისკრიმინაციული პოლიტიკა და პროცედურები?', en: 'Are non-discriminatory policies and procedures in place?' },
            tooltip: { ka: 'ეს არის პოლიტიკები, რომლებიც კრძალავენ ნებისმიერ ფორმის დისკრიმინაციას სამუშაო ადგილზე - დაქირავებისას, ხელფასის განსაზღვრისას, დაწინაურებისას, ტრენინგის ხელმისაწვდომობისას. ეს უნდა იყოს წერილობითი წესები.', en: 'These are policies prohibiting any form of workplace discrimination - in hiring, salary, promotion, training access. These should be written rules.' } },
          { id: 'q_4_1_2', parent: 'q_4_1',
            text: { ka: 'მუშაკთა წარმომადგენლებს ეძლევათ შესაბამისი საშუალებები?', en: 'Are workers representatives provided appropriate facilities?' },
            tooltip: { ka: 'მუშაკთა წარმომადგენელი არის ის, ვინც ლაპარაკობს კოლეგების სახელით კომპანიის ხელმძღვანელობასთან. შესაბამისი საშუალებები ნიშნავს - ოთახს შეხვედრებისთვის, წვდომას ინფორმაციაზე, დროს ამ საქმიანობისთვის, რომ ის თავისუფლად შეასრულოს თავისი ფუნქცია.', en: 'A worker representative is someone who speaks on colleagues behalf to company management. Appropriate facilities means a meeting room, access to information, time for this work - so they can freely perform their role.' } },
          { id: 'q_4_1_3', parent: 'q_4_1',
            text: { ka: 'არ ერევა მუშაკთა წარმომადგენლების საქმიანობაში?', en: 'Does the company avoid interfering with worker representatives?' },
            tooltip: { ka: 'არ ერევა ნიშნავს, რომ კომპანია არ ცდილობს გავლენა იქონიოს მუშაკთა წარმომადგენლების გადაწყვეტილებებზე, არ აშინებს მათ, არ აგროვებს მათზე ინფორმაციას, არ კრძალავს მათ შეხვედრებს (გონივრული საათების ფარგლებში).', en: 'Non-interference means the company does not try to influence worker representatives decisions, does not intimidate them, does not gather information about them, does not prohibit their meetings (within reasonable hours).' } },
          { id: 'q_4_2', isParent: true,
            text: { ka: 'კომპანიას აქვს მკაფიო პოლიტიკა იძულებითი შრომის წინააღმდეგ?', en: 'Does the company have clear policy against forced labour?' },
            tooltip: { ka: 'იძულებითი შრომის წინააღმდეგ პოლიტიკა - წერილობითი ვალდებულება, რომ კომპანია არასოდეს არ გამოიყენებს იძულებას მუშაობაში. იძულებითი შრომის ნიშნებია: საბუთების ჩამორთმევა, ვალის ბრუნდი, ფიზიკური მუქარა, თავისუფლების შეზღუდვა, ხელფასის დაკავება.', en: 'Anti-forced-labor policy is a written commitment that the company will never use coercion in work. Signs of forced labor: document confiscation, debt bondage, physical threats, restriction of freedom, salary withholding.' } },
          { id: 'q_4_2_1', parent: 'q_4_2',
            text: { ka: 'ყველა თანამშრომელს ესმის, რა არის იძულებითი შრომა?', en: 'Do all officials understand what forced labour means?' },
            tooltip: { ka: 'საკითხი არის - იციან თუ არა თქვენს კომპანიაში მენეჯერებმა და HR-მა, რას ნიშნავს იძულებითი შრომა და როგორ უნდა იცნონ მისი ნიშნები. ჩატარდა თუ არა ამაზე ტრენინგი ან გაცნობა?', en: 'The question is - do your managers and HR understand what forced labor means and how to recognize its signs? Has training or awareness on this been provided?' } },
          { id: 'q_4_2_2', parent: 'q_4_2',
            text: { ka: 'შრომითი ხელშეკრულებები იწერება მუშაკისთვის გასაგებ ენაზე?', en: 'Are employment contracts written in workers language?' },
            tooltip: { ka: 'შრომითი ხელშეკრულება უნდა იყოს მუშაკისთვის გასაგებ ენაზე - ეროვნული ან მისი მშობლიური ენით. თუ მუშაკი ვერ კითხულობს ხელშეკრულებას, ის ვერ ხვდება თავის უფლებებს და ვალდებულებებს, რაც ცუდი მოპყრობის რისკია.', en: 'Employment contracts should be in a language workers understand - national or native language. If a worker cannot read the contract, they cannot understand their rights and duties, which is a risk for mistreatment.' } },
          { id: 'q_4_2_3', parent: 'q_4_2',
            text: { ka: 'კომპანია იცის რომელ ქვეყნებში/სექტორებში იძულებითი შრომის რისკი მაღალია?', en: 'Is the company aware of high-risk regions/sectors?' },
            tooltip: { ka: 'ზოგიერთ ქვეყანაში და სექტორში იძულებითი შრომის რისკი მაღალია - მაგ. მიგრანტი მუშაკების დასაქმება, სოფლის მეურნეობა, ტექსტილის ფაბრიკები ზოგიერთ რეგიონში. იცით თუ არა ვინ არიან თქვენი მაღალი რისკის მომწოდებლები?', en: 'Some countries and sectors have high forced-labor risk - e.g. migrant worker employment, agriculture, textile factories in certain regions. Do you know who your high-risk suppliers are?' } },
          { id: 'q_4_2_4', parent: 'q_4_2',
            text: { ka: 'კომპანია არ ჩამოართმევს მუშაკებს პირადობის დოკუმენტებს?', en: 'Does the company avoid confiscating workers identity documents?' },
            tooltip: { ka: 'პასპორტის ან პირადობის მოწმობის ჩამორთმევა არის იძულებითი შრომის ერთ-ერთი ყველაზე გავრცელებული ნიშანი - ეს ხელს უშლის მუშაკს ადგილის დატოვებას ან სხვა სამუშაოს ძიებას. თქვენი კომპანია არ ჩამოართმევს მუშაკებს დოკუმენტებს?', en: 'Confiscating passports or ID documents is one of the most common signs of forced labor - it prevents workers from leaving or seeking other employment. Does your company avoid taking workers documents?' } },
          { id: 'q_4_2_5', parent: 'q_4_2',
            text: { ka: 'მონიტორინგდება მიწოდების ჯაჭვი და სუბკონტრაქტორები?', en: 'Are supply chains and subcontractors monitored?' },
            tooltip: { ka: 'მონიტორინგი ნიშნავს, რომ რეგულარულად ამოწმებთ თქვენს მომწოდებლებს და სუბკონტრაქტორებს, არიან თუ არა ისინი იძულებით შრომაში მონაწილენი. ეს შეიძლება იყოს კითხვარი, აუდიტი, ან მესამე მხარის ვერიფიკაცია.', en: 'Monitoring means regularly checking your suppliers and subcontractors for involvement in forced labor. This can be questionnaires, audits, or third-party verification.' } },
          { id: 'q_4_3', isParent: true,
            text: { ka: 'კომპანია ანვითარებს ცნობიერებას ბავშვთა შრომის მიზეზებსა და შედეგებზე?', en: 'Is awareness of child labour developed within the company?' },
            tooltip: { ka: 'ცნობიერების განვითარება ნიშნავს, რომ თქვენ კომპანიაში ლაპარაკობთ ბავშვთა შრომაზე - მუშაობენ თუ არა ბავშვები, ცუდია თუ არა მათთვის ფიზიკური სამუშაო, რა სოციალური მიზეზები იწვევს ამას. ხდება თუ არა ეს დისკუსია, ტრენინგი ან კომუნიკაცია თანამშრომლებთან?', en: 'Awareness development means your company talks about child labor - whether children are working, whether physical work is bad for them, what social causes lead to this. Are such discussions, trainings, or communications happening?' } },
          { id: 'q_4_3_1', parent: 'q_4_3',
            text: { ka: 'იცავს ეროვნული კანონით დადგენილ მინიმალურ ასაკობრივ ნორმებს?', en: 'Does the company adhere to minimum age provisions?' },
            tooltip: { ka: 'საქართველოში სამუშაო ასაკის მინიმუმი 16 წელია (გამონაკლისებით - 14 წლიდან მსუბუქი სამუშაოები). საერთაშორისოდ - 15 წელი. სახიფათო სამუშაოებზე - 18 წელი. იცავთ თქვენი ქვეყნის კანონმდებლობას?', en: 'In Georgia the minimum working age is 16 (with exceptions - light work from age 14). Internationally - 15 years. For hazardous work - 18 years. Do you comply with your country laws?' } },
          { id: 'q_4_3_2', parent: 'q_4_3',
            text: { ka: 'ცნობს ბავშვთა შრომის რისკ-ქვეყნებსა და სექტორებს?', en: 'Is the company aware of high-risk regions for child labour?' },
            tooltip: { ka: 'ბავშვთა შრომის რისკი მაღალია გარკვეულ ქვეყნებში (განვითარებადი, ღარიბი რეგიონები) და სექტორებში (სოფლის მეურნეობა, ტექსტილის წარმოება, სამთო-მოპოვებითი). იცით თუ არა, სად შეიძლება ეს პრობლემა გაჩნდეს თქვენს ჯაჭვში?', en: 'Child labor risk is high in certain countries (developing, poor regions) and sectors (agriculture, textile production, mining). Do you know where this problem might arise in your chain?' } },
          { id: 'q_4_3_3', parent: 'q_4_3',
            text: { ka: 'იყენებს ასაკის შემოწმების მექანიზმებს დაქირავებისას?', en: 'Are age verification mechanisms used in recruitment?' },
            tooltip: { ka: 'ასაკის შემოწმების მექანიზმი - დაქირავებისას ამოწმებთ ოფიციალურ დოკუმენტებს (პასპორტი, პირადობა) იმის დასადასტურებლად, რომ კანდიდატი არ არის არასრულწლოვანი. იყენებთ თუ არა ამ შემოწმებას რუტინულად?', en: 'Age verification mechanism - during hiring you check official documents (passport, ID) to confirm the candidate is not a minor. Do you routinely use this check?' } },
          { id: 'q_4_3_4', parent: 'q_4_3',
            text: { ka: 'აქვს პოლიტიკა 18 წლამდე პირების დაქირავების წინააღმდეგ?', en: 'Does the company have policy against hiring under 18?' },
            tooltip: { ka: 'პოლიტიკა, რომელიც კრძალავს 18 წლამდე პირების დაქირავებას, აღემატება მინიმალურ კანონისმიერ მოთხოვნას (16 წ. საქართველოში) და უფრო უსაფრთხოა - გამორიცხავს ნებისმიერ რისკს ბავშვთა შრომასთან დაკავშირებით.', en: 'A policy prohibiting hiring under 18 exceeds the minimum legal requirement (16 in Georgia) and is safer - it eliminates any risk related to child labor.' } },
          { id: 'q_4_3_5', parent: 'q_4_3',
            text: { ka: 'ახდენს გავლენას ქვე-კონტრაქტორებზე ბავშვთა შრომის წინააღმდეგ?', en: 'Does the company influence subcontractors against child labour?' },
            tooltip: { ka: 'თქვენი მომწოდებლები ან სუბკონტრაქტორები შეიძლება იყენებდნენ ბავშვთა შრომას. გავლენა ნიშნავს, რომ თქვენ ცდილობთ მათი დარწმუნებას ან მოთხოვნას, რომ ისინიც დაიცვან ბავშვთა უფლებები - კონტრაქტული ვალდებულებებით, აუდიტებით, განათლებით.', en: 'Your suppliers or subcontractors might use child labor. Influence means you try to convince them or require them to also protect children rights - through contractual obligations, audits, education.' } },
          { id: 'q_4_3_6', parent: 'q_4_3',
            text: { ka: 'შემუშავებული აქვს ბავშვთა შრომის გამოვლენის მექანიზმი?', en: 'Has the company developed mechanisms to detect child labour?' },
            tooltip: { ka: 'გამოვლენის მექანიზმი - სისტემა, რომელიც ამჩნევს, თუ ბავშვი უკვე მუშაობს თქვენს ან თქვენი მომწოდებლის ობიექტზე. შეიძლება იყოს ანონიმური ცხელი ხაზი, რეგულარული აუდიტი, ან თანამშრომლების ტრენინგი ნიშნების ამოცნობაზე.', en: 'Detection mechanism - a system that notices if a child is already working at your or your supplier site. Can be an anonymous hotline, regular audits, or training employees to recognize signs.' } },
          { id: 'q_4_4', isParent: true,
            text: { ka: 'კვალიფიკაცია, უნარები და გამოცდილება არის დაქირავების და დაწინაურების საფუძველი?', en: 'Are qualifications, skill, experience the basis for recruitment/promotion?' },
            tooltip: { ka: 'ეს კითხვა - ხალხს ქირავდებთ, ხელფასს უწევთ ან აწინაურებთ მათი უნარების და გამოცდილების მიხედვით (ობიექტური კრიტერიუმებით), თუ პირადი კავშირების, ნათესაობის, ან სხვა არარელევანტური მიზეზების გამო?', en: 'This asks - do you hire, pay, or promote people based on their skills and experience (objective criteria), or due to personal connections, family ties, or other irrelevant reasons?' } },
          { id: 'q_4_4_1', parent: 'q_4_4',
            text: { ka: 'მაღალი დონის პასუხისმგებელი პირი დანიშნულია თანასწორი დასაქმების საკითხებზე?', en: 'Is high-level responsibility assigned for equal employment?' },
            tooltip: { ka: 'მაღალი დონის პასუხისმგებელი პირი - დირექტორის ან მისი მოადგილის რანგის თანამშრომელი, რომელიც პასუხს აგებს, რომ კომპანიაში თანასწორი დასაქმების პრინციპი დაცულია. ეს ცხადყოფს, რომ საკითხი მნიშვნელოვანია კომპანიისთვის.', en: 'High-level responsible person - an employee at director or deputy director rank who is accountable for ensuring equal employment principles are upheld. This shows the issue matters to the company.' } },
          { id: 'q_4_4_2', parent: 'q_4_4',
            text: { ka: 'ინახება განახლებული ჩანაწერები დაქირავების, ტრენინგის და დაწინაურების შესახებ?', en: 'Are records kept on recruitment, training, promotion?' },
            tooltip: { ka: 'განახლებული ჩანაწერები ნიშნავს, რომ ყველა HR გადაწყვეტილება (დაქირავება, ტრენინგი, დაწინაურება) დოკუმენტირებულია - ვინ მიიღო, რა საფუძველზე, რა შედეგი. ეს გამჭვირვალობა იცავს დისკრიმინაციისგან.', en: 'Up-to-date records means all HR decisions (hiring, training, promotion) are documented - who decided, on what basis, what was the outcome. This transparency protects against discrimination.' } },
          { id: 'q_4_4_3', parent: 'q_4_4',
            text: { ka: 'ტარდება არაცნობიერი მიკერძოების ტრენინგი?', en: 'Is unconscious bias training conducted?' },
            tooltip: { ka: 'არაცნობიერი მიკერძოება (unconscious bias) არის ფარული წინასწარი დამოკიდებულება, რომელსაც ხალხი თვითონ ვერ ხედავს - მაგ. ვფიქრობთ რომ მამაკაცი უფრო ლიდერია, ვიდრე ქალი. ტრენინგი დაგვეხმარება ამ ფარული მიკერძოებების გაცნობიერებაში.', en: 'Unconscious bias is a hidden preconception people do not see in themselves - e.g. we think men are more leader-like than women. Training helps recognize these hidden biases.' } },
          { id: 'q_4_4_4', parent: 'q_4_4',
            text: { ka: 'აქვს საჩივრების წარდგენის პროცედურა დისკრიმინაციის შემთხვევაში?', en: 'Are grievance procedures developed for discrimination?' },
            tooltip: { ka: 'საჩივრების პროცედურა - ფორმალური გზა იმისთვის, რომ თანამშრომელმა, რომელიც დისკრიმინაციას გრძნობს, შემოიტანოს საჩივარი, ის გამოიკვლიოს მიუკერძოებელი პირის მიერ, და მიიღოს შედეგი. ანონიმურობის უზრუნველყოფა მნიშვნელოვანია.', en: 'Grievance procedure - a formal way for an employee experiencing discrimination to file a complaint, have it investigated by an impartial party, and receive a resolution. Anonymity is important.' } },
          { id: 'q_4_4_5', parent: 'q_4_4',
            text: { ka: 'ტარდება არადისკრიმინაციული პოლიტიკის ტრენინგი?', en: 'Is non-discrimination training provided?' },
            tooltip: { ka: 'პოლიტიკის ცოდნა მხოლოდ HR-ში არ არის საკმარისი - ყველა მენეჯერმა და თანამშრომელმა უნდა იცოდეს, რა არის დისკრიმინაცია, რა არ არის დასაშვები. რეგულარული ტრენინგი ამის უზრუნველყოფაა.', en: 'Policy knowledge in HR alone is not enough - every manager and employee should know what discrimination is, what is unacceptable. Regular training ensures this.' } },
          { id: 'q_4_4_6', parent: 'q_4_4',
            text: { ka: 'აქვს უნარების განვითარების ხელმისაწვდომობის პროგრამა?', en: 'Are programs in place to promote access to skills training?' },
            tooltip: { ka: 'უნარების განვითარების ხელმისაწვდომობა - ყველა თანამშრომელს, განურჩევლად სქესის, ასაკის, ეროვნების და ა.შ., აქვს თანაბარი წვდომა ტრენინგებზე, კურსებზე, დაწინაურების შესაძლებლობებზე.', en: 'Skills development access - all employees, regardless of gender, age, nationality, etc., have equal access to trainings, courses, promotion opportunities.' } }
        ]
      },
      // SECTION 4: ENVIRONMENT
      {
        key: 'environment',
        questions: [
          { id: 'q_5_1', isParent: true,
            text: { ka: 'აქვს კომპანიას ქცევის კოდექსი ჯანმრთელობასა და გარემოზე ზრუნვისთვის?', en: 'Does the company have code of conduct for health/environment care?' },
            tooltip: { ka: 'ქცევის კოდექსი (Code of Conduct) არის წერილობითი დოკუმენტი, რომელიც აცხადებს, რომ კომპანია ერთგულია ჯანდაცვისა და გარემოს დაცვის - როგორ წარმოებს, როგორ ანიავებს ნარჩენებს, როგორ ცდილობს შეამციროს ემისიები. გაქვთ ასეთი დოკუმენტი?', en: 'A code of conduct is a written document declaring the company commitment to health and environmental protection - how it produces, how it manages waste, how it tries to reduce emissions. Do you have such a document?' } },
          { id: 'q_5_1_1', parent: 'q_5_1',
            text: { ka: 'აქვს მენეჯერული კომიტეტი წინდახედული მიდგომის ზედამხედველობისთვის?', en: 'Is there a managerial committee overseeing precautionary application?' },
            tooltip: { ka: 'მენეჯერული კომიტეტი - ხელმძღვანელობის რანგის ჯგუფი, რომელიც სპეციალურად აკონტროლებს გარემოსდაცვით საკითხებს, რეგულარულად იხილავს მონაცემებს, იღებს გადაწყვეტილებებს. ეს ცხადყოფს, რომ საკითხი სერიოზულად აღიქმება.', en: 'Managerial committee - a group at executive level that specifically oversees environmental matters, regularly reviews data, makes decisions. This shows the issue is taken seriously.' } },
          { id: 'q_5_1_2', parent: 'q_5_1',
            text: { ka: 'დამყარებულია ორმხრივი კომუნიკაცია დაინტერესებულ მხარეებთან?', en: 'Is two-way communication established with stakeholders?' },
            tooltip: { ka: 'ორმხრივი კომუნიკაცია ნიშნავს, რომ კომპანია არა მხოლოდ აცნობებს დაინტერესებულ მხარეებს (თემს, რეგულატორებს, ინვესტორებს), არამედ მათ ეძლევათ შესაძლებლობა, რომ თავიანთი გარემოსდაცვითი შეშფოთება და აზრი მოგვაწოდონ.', en: 'Two-way communication means the company not only informs stakeholders (community, regulators, investors) but also gives them a chance to express environmental concerns and feedback.' } },
          { id: 'q_5_1_3', parent: 'q_5_1',
            text: { ka: 'იყენებს მრავალმხრივ შეხვედრებს და ფოკუს-ჯგუფებს?', en: 'Does the company use multi-stakeholder meetings and focus groups?' },
            tooltip: { ka: 'მრავალმხრივი შეხვედრები - საუბრები, რომლებზეც ერთად იკრიბება სხვადასხვა ჯგუფი (კომპანია, თემი, NGO, რეგულატორი). ფოკუს-ჯგუფი - მცირე ჯგუფის ღრმა გამოკითხვა. ეს გვეხმარება სხვადასხვა მხარის პერსპექტივის გაგებაში.', en: 'Multi-stakeholder meetings - discussions bringing together various groups (company, community, NGO, regulator). Focus group - in-depth interview with a small group. This helps understand various perspectives.' } },
          { id: 'q_5_2', isParent: true,
            text: { ka: 'აქვს განსაზღვრული მდგრადი განვითარების ხედვა?', en: 'Are sustainable development vision and policies defined?' },
            tooltip: { ka: 'მდგრადი განვითარება - ბიზნესის მართვა ისე, რომ ის იყოს მოგებიანი, არ აზიანებდეს გარემოს და ხელს უწყობდეს საზოგადოებას. ხედვა - გრძელვადიანი მისწრაფება. პოლიტიკა - წერილობითი წესები. სტრატეგია - გეგმა, როგორ მივიღოთ შედეგი.', en: 'Sustainable development - managing business to be profitable, not harm the environment, and benefit society. Vision - long-term aspiration. Policy - written rules. Strategy - plan to achieve results.' } },
          { id: 'q_5_2_1', parent: 'q_5_2',
            text: { ka: 'შემუშავებულია მდგრადობის სამიზნე მაჩვენებლები?', en: 'Are sustainability targets and indicators developed?' },
            tooltip: { ka: 'სამიზნე მაჩვენებლები - რიცხვითი მიზნები, მაგ. ენერგიის მოხმარების შემცირება 20%-ით 5 წელიწადში, ქალების ხელფასური განსხვავება მამაკაცებთან 0%-მდე. ინდიკატორები - ცოცხალი მონაცემები, რომლითაც პროგრესს ვადგენთ.', en: 'Target indicators - numerical goals, e.g. reduce energy consumption by 20% in 5 years, close gender pay gap to 0%. Indicators - live data tracking progress.' } },
          { id: 'q_5_2_2', parent: 'q_5_2',
            text: { ka: 'აქვს მდგრადი წარმოების და მოხმარების პროგრამა?', en: 'Is there sustainable production/consumption programme?' },
            tooltip: { ka: 'მდგრადი წარმოება - ნედლეულის და ენერგიის ეფექტური გამოყენება, ნარჩენების შემცირება, წყლის დაცვა. მდგრადი მოხმარება - პროდუქცია, რომელიც გრძელვადიანია, გადამუშავებადია. ეს უნდა აღემატებოდეს კანონისმიერ მინიმუმს.', en: 'Sustainable production - efficient use of raw materials and energy, reducing waste, water conservation. Sustainable consumption - products that are durable, recyclable. This should exceed legal minimums.' } },
          { id: 'q_5_2_3', parent: 'q_5_2',
            text: { ka: 'მუშაობს დიზაინერებთან და მომწოდებლებთან გარემოსდაცვითი მაჩვენებლების გასაუმჯობესებლად?', en: 'Does the company work with designers/suppliers to improve environmental performance?' },
            tooltip: { ka: 'პროდუქტის დიზაინი მნიშვნელოვნად განსაზღვრავს მის გარემოსდაცვით ეფექტს. თქვენი კომპანია მუშაობს დიზაინერებთან და მომწოდებლებთან, რომ პროდუქცია იყოს უფრო ეფექტური, ნაკლებად მავნე, უკეთესად გადასამუშავებელი?', en: 'Product design significantly determines environmental impact. Does your company work with designers and suppliers so products are more efficient, less harmful, more recyclable?' } },
          { id: 'q_5_2_4', parent: 'q_5_2',
            text: { ka: 'ზომავს და აცნობს პროგრესს მდგრადობის პრინციპებზე?', en: 'Does the company measure/communicate sustainability progress?' },
            tooltip: { ka: 'ზომვა, თვალყურის დევნება, რეპორტინგი - სამი ნაბიჯი მდგრადობის მონიტორინგისთვის. ჯერ უნდა გავზომოთ (მაგ. CO2 ემისიები), მერე თვალი ვადევნოთ ცვლილებებს, ბოლოს კი - საჯაროდ გავუგზავნოთ შედეგები.', en: 'Measure, track, communicate - three steps for sustainability monitoring. First measure (e.g. CO2 emissions), then track changes, finally communicate results publicly.' } },
          { id: 'q_5_3', isParent: true,
            text: { ka: 'აქვს კომპანიას პოლიტიკა გარემოსდაცვითი ტექნოლოგიების გამოყენებაზე?', en: 'Is there policy on use of environmentally sound technologies?' },
            tooltip: { ka: 'გარემოსდაცვითი ტექნოლოგიები - მანქანები და სისტემები, რომლებიც ნაკლებად აზიანებენ გარემოს - მაგ. განახლებადი ენერგია, ენერგოეფექტური მანქანები, ბიოდეგრადირებადი მასალები. გაქვთ წერილობითი მითითება, რომ ასეთი ტექნოლოგიები გამოიყენოთ?', en: 'Environmental technologies - machines and systems that harm the environment less - e.g. renewable energy, energy-efficient machines, biodegradable materials. Do you have written guidance to use such technologies?' } },
          { id: 'q_5_3_1', parent: 'q_5_3',
            text: { ka: 'აწვდის ინფორმაციას ტექნოლოგიების გარემოსდაცვითი მაჩვენებლების შესახებ?', en: 'Is information made available about environmental performance?' },
            tooltip: { ka: 'გამჭვირვალობა - დაინტერესებულ მხარეებს (კლიენტებს, ინვესტორებს, რეგულატორებს) ეუბნებით, რა არის თქვენი ტექნოლოგიების გარემოსდაცვითი მახასიათებლები - მაგ. რამდენ ენერგიას ხარჯავს, რა ემისიებს გამოყოფს, რამდენი წყალი იხარჯება.', en: 'Transparency - telling stakeholders (customers, investors, regulators) what your technologies environmental characteristics are - e.g. how much energy used, what emissions, how much water consumed.' } },
          { id: 'q_5_3_2', parent: 'q_5_3',
            text: { ka: 'იყენებს ცხოვრების ციკლის შეფასებას (LCA) ახალი ტექნოლოგიებისთვის?', en: 'Is life cycle assessment used in new technology development?' },
            tooltip: { ka: 'ცხოვრების ციკლის შეფასება (Life Cycle Assessment - LCA) - სრული ანალიზი ნედლეულის მოპოვებიდან, წარმოებიდან, ტრანსპორტირებიდან, გამოყენებიდან, ბოლოს უტილიზაციამდე. ამით ვხედავთ, სად არის ყველაზე დიდი გარემოსდაცვითი ეფექტი.', en: 'Life Cycle Assessment (LCA) - full analysis from raw material extraction, production, transport, use, to final disposal. This shows where the biggest environmental impact lies.' } },
          { id: 'q_5_3_3', parent: 'q_5_3',
            text: { ka: 'ამოწმებს კრიტერიუმებს მომწოდებელთა შესარჩევად?', en: 'Are criteria examined for supplier selection?' },
            tooltip: { ka: 'მომწოდებელთა შერჩევისას, ფასისა და ხარისხის გარდა, გასათვალისწინებელია გარემოსდაცვითი მაჩვენებლები - გადასცემთ თუ არა მომწოდებლებს მინიმალური ეკოლოგიური მოთხოვნებს?', en: 'When selecting suppliers, beyond price and quality, environmental performance should be considered - do you communicate minimum environmental requirements to suppliers?' } },
          { id: 'q_5_3_4', parent: 'q_5_3',
            text: { ka: 'თანამშრომლობს ინდუსტრიის პარტნიორებთან საუკეთესო ტექნოლოგიების უზრუნველსაყოფად?', en: 'Does the company cooperate with industry partners on best technology?' },
            tooltip: { ka: 'ინდუსტრიული თანამშრომლობა - ერთად მუშაობა კონკურენტებთან, საუნივერსიტეტო ცენტრებთან, რათა საუკეთესო ხელმისაწვდომი ტექნოლოგიების (Best Available Technology - BAT) ცოდნა გავრცელდეს. ეს აჩქარებს მთლიანი ინდუსტრიის გამწვანებას.', en: 'Industry collaboration - working together with competitors, university centers, so Best Available Technology (BAT) knowledge spreads. This accelerates greening of the entire industry.' } }
        ]
      },
      // SECTION 5: ANTI-CORRUPTION
      {
        key: 'antiCorruption',
        questions: [
          { id: 'q_6_1', isParent: true,
            text: { ka: 'აქვს კომპანიას ანტიკორუფციული პოლიტიკა და პროგრამები?', en: 'Does the company have anti-corruption policies and programmes?' },
            tooltip: { ka: 'ანტიკორუფციული პოლიტიკა - წერილობითი დოკუმენტი, რომელშიც კომპანია აცხადებს, რომ კრძალავს ქრთამის მიცემას/მიღებას, ფავორიტიზმს, ხელისუფლების ბოროტ გამოყენებას. პროგრამა - კონკრეტული ნაბიჯები ამის უზრუნველსაყოფად (ტრენინგი, გადამოწმება, საჩივრების სისტემა).', en: 'Anti-corruption policy - written document where the company declares prohibition of bribery, favoritism, abuse of power. Programme - concrete steps to ensure this (training, verification, complaint system).' } },
          { id: 'q_6_1_1', parent: 'q_6_1',
            text: { ka: 'წლიურ ანგარიშებში მოცემულია ანტიკორუფციული მუშაობის შედეგები?', en: 'Is anti-corruption work reported in annual reports?' },
            tooltip: { ka: 'საჯარო რეპორტინგი - წლიურ ანგარიშებში (ან ცალკე ESG რეპორტში) იწერებით, რა მუშაობა გაქვთ ჩატარებული ანტიკორუფციული მიმართულებით - რამდენი ტრენინგი ჩატარდა, რამდენი საჩივარი გამოიკვლიეს, რა შედეგები მიიღეს.', en: 'Public reporting - in annual reports (or separate ESG report) you describe what anti-corruption work has been done - how many trainings, how many complaints investigated, what results.' } },
          { id: 'q_6_1_2', parent: 'q_6_1',
            text: { ka: 'კომპანია იზიარებს გამოცდილებას და საუკეთესო პრაქტიკას?', en: 'Does the company share experiences and best practices?' },
            tooltip: { ka: 'საუკეთესო პრაქტიკის გაზიარება - სხვა კომპანიებთან, კონფერენციებზე, ინდუსტრიულ ფორუმებზე იზიარებთ თქვენ გამოცდილებას - რა მუშაობდა, რა არ მუშაობდა, რას ისწავლეთ. ამ ცოდნის გაცვლა მთლიან ინდუსტრიას უმჯობესდება.', en: 'Sharing best practices - with other companies, at conferences, industry forums, you share your experience - what worked, what did not, what you learned. This knowledge exchange improves the entire industry.' } },
          { id: 'q_6_1_3', parent: 'q_6_1',
            text: { ka: 'თანამშრომლობს ინდუსტრიის თანატოლებთან ანტიკორუფციული ძალისხმევის გასაძლიერებლად?', en: 'Does the company join forces with industry peers in anti-corruption?' },
            tooltip: { ka: 'კოლექტიური მოქმედება - ერთად მუშაობა კონკურენტებთან, ბიზნეს ასოციაციებთან, NGO-ებთან, რათა კორუფციას მთლიან ინდუსტრიულ დონეზე მოწინააღმდეგდეთ. ერთ კომპანიას უჭირს მარტო ცვლილების მიღწევა.', en: 'Collective action - working together with competitors, business associations, NGOs to fight corruption at the entire industry level. One company alone struggles to achieve change.' } }
        ]
      },
      // SECTION 6: HEALTH & SAFETY
      {
        key: 'healthSafety',
        questions: [
          { id: 'q_7_1', isParent: true,
            text: { ka: 'აქვს კომპანიას ჯანდაცვისა და უსაფრთხოების პოლიტიკა?', en: 'Does the company have H&S policy and procedures?' },
            tooltip: { ka: 'ჯანდაცვისა და უსაფრთხოების (H&S) პოლიტიკა - წერილობითი დოკუმენტი, რომელიც აცხადებს, თუ როგორ იცავს კომპანია მუშაკებს და კონტრაქტორებს ფიზიკური ზიანისგან. პროცედურები - კონკრეტული წესები ყოველდღიური მუშაობისთვის (PPE, უსაფრთხოების პროტოკოლი, ავარიული დახმარება).', en: 'Health & Safety (H&S) policy - written document declaring how the company protects workers and contractors from physical harm. Procedures - specific rules for daily work (PPE, safety protocols, emergency response).' } },
          { id: 'q_7_1_1', parent: 'q_7_1',
            text: { ka: 'ხელმისაწვდომია H&S სტატისტიკა (ინციდენტები, ფატალური შემთხვევები)?', en: 'Are H&S statistics available (incidents, fatalities)?' },
            tooltip: { ka: 'H&S სტატისტიკა - რიცხვითი მონაცემები ინციდენტებზე - რამდენი დაშავება მოხდა გასულ წელს, რამდენი ფატალური შემთხვევა (გარდაცვალება სამუშაოზე), რა იყო მიზეზი, როგორ გადაიჭრა. გრძნობთ თუ არა, რომ ეს ციფრები ხელმისაწვდომია?', en: 'H&S statistics - numerical data on incidents - how many injuries last year, how many fatalities (work-related deaths), what were causes, how were they resolved. Are these numbers available to you?' } },
          { id: 'q_7_1_2', parent: 'q_7_1',
            text: { ka: 'კომპანია გადასცემს მუშაკებს H&S შედეგებსა და სტატისტიკას?', en: 'Does the company communicate H&S performance to workers?' },
            tooltip: { ka: 'მუშაკებს უფლება აქვთ იცოდნენ, რამდენად უსაფრთხოა მათი სამუშაო ადგილი. გადასცემთ თუ არა მათ რეგულარულად ინფორმაციას - ინციდენტების სტატისტიკას, უსაფრთხოების მაჩვენებლებს, რა გასაუმჯობესებელია?', en: 'Workers have the right to know how safe their workplace is. Do you regularly communicate to them - incident statistics, safety metrics, what needs improvement?' } },
          { id: 'q_7_1_3', parent: 'q_7_1',
            text: { ka: 'არის გეგმები რომლებიც უზრუნველყოფს PPE-ს (პირადი დაცვის საშუალებები)?', en: 'Are there plans/standards committing to PPE for workers?' },
            tooltip: { ka: 'PPE (Personal Protective Equipment) - პირადი დაცვის საშუალებები: ჩაფხუტი, სათვალე, ხელთათმანები, საფეხურები, რესპირატორი, საყურე-ჩამქრობი. სათანადო ნიშნავს, რომ ეს კონკრეტული სამუშაოს რისკებს ითვალისწინებს და ხარისხიანი დაცვაა.', en: 'PPE (Personal Protective Equipment) - personal protective gear: helmets, goggles, gloves, boots, respirators, ear protection. Adequate means it considers the specific job risks and provides quality protection.' } }
        ]
      },
      // SECTION 7: CLIMATE CHANGE
      {
        key: 'climate',
        questions: [
          { id: 'q_8_1', isParent: true,
            text: { ka: 'აქვს კომპანიას დეკარბონიზაციის გეგმა?', en: 'Does the company have a decarbonization plan?' },
            tooltip: { ka: 'დეკარბონიზაცია - ნახშირბადის (CO2 და სხვა სათბურის) ემისიების შემცირება. დეკარბონიზაციის გეგმა - წერილობითი დოკუმენტი იმაზე, თუ როგორ შეამცირებს თქვენი კომპანია ემისიებს - რა ნაბიჯებით, რა ტექნოლოგიებით, რა ვადებში.', en: 'Decarbonization - reducing carbon (CO2 and other greenhouse gas) emissions. Decarbonization plan - written document on how your company will reduce emissions - through what steps, technologies, timelines.' } },
          { id: 'q_8_1_1', parent: 'q_8_1',
            text: { ka: 'აქვს კომპანიას ნახშირბადის შემცირების სამიზნე მაჩვენებლები?', en: 'Does the company have carbon reduction targets?' },
            tooltip: { ka: 'სამიზნე მაჩვენებლები - კონკრეტული რიცხვობრივი მიზნები, მაგ. 30% შემცირება 2030 წლისთვის, ნულოვანი ემისია 2050 წლისთვის. უნდა იყოს გაზომვადი და ვადიანი, არა მხოლოდ ზოგადი ვალდებულება.', en: 'Target indicators - specific numerical goals, e.g. 30% reduction by 2030, net zero by 2050. Must be measurable and time-bound, not just general commitment.' } },
          { id: 'q_8_1_2', parent: 'q_8_1',
            text: { ka: 'იდენტიფიცირებული აქვს დეკარბონიზაციის სტრატეგიის ძირითადი დაბრკოლებები?', en: 'Has the company identified main obstacles of decarbonization?' },
            tooltip: { ka: 'დეკარბონიზაცია არ არის მარტივი - ხშირად ბევრი დაბრკოლებაა: ფინანსური (ახალი ტექნოლოგიები ძვირია), ტექნიკური (ალტერნატივები არ არის), ორგანიზაციული (პროცესების ცვლილება). ცნობილი გაქვთ რა აფერხებს თქვენ?', en: 'Decarbonization is not simple - there are often many obstacles: financial (new technologies are expensive), technical (no alternatives), organizational (process change). Do you know what obstacles you face?' } },
          { id: 'q_8_2',
            text: { ka: 'იდენტიფიცირებული აქვს კლიმატთან ადაპტაციის რისკები და ღონისძიებები?', en: 'Has the company identified climate adaptation risks and measures?' },

    // ----------- WIZARD SCREEN -----------
    function WizardScreen({ lang, setLang, companyId, companyName, initialAnswers, onSave, onSubmit }) {
      const [currentSection, setCurrentSection] = useState(0);
      const [answers, setAnswers] = useState(initialAnswers || {});
      const [partialTexts, setPartialTexts] = useState(() => {
        const t = {};
        Object.entries(initialAnswers || {}).forEach(([qid, a]) => { if (a.partial_text) t[qid] = a.partial_text; });
        return t;
      });
      const [autoSuggested, setAutoSuggested] = useState(() => {
        const a = {};
        Object.entries(initialAnswers || {}).forEach(([qid, x]) => { if (x.was_auto_suggested) a[qid] = true; });
        return a;
      });
      const [showError, setShowError] = useState(false);
      const [showConfirm, setShowConfirm] = useState(false);
      const [saveStatus, setSaveStatus] = useState(''); // 'saving' | 'saved' | ''
      const [submitting, setSubmitting] = useState(false);
      const saveTimer = useRef(null);

      const section = SECTIONS[currentSection];
      const sectionTitles = T[lang].sections;
      const totalQ = ALL_QUESTIONS.length;
      const answeredCount = Object.values(answers).filter(a => a && a.answer).length;
      const pct = Math.round((answeredCount / totalQ) * 100);

      // Debounced save
      const scheduleSave = useCallback((qid, payload) => {
        setSaveStatus('saving');
        if (saveTimer.current) clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(async () => {
          try {
            await upsertAnswer(companyId, qid, payload.answer, payload.partial_text, payload.was_auto_suggested);
            setSaveStatus('saved');
            setTimeout(() => setSaveStatus(''), 2000);
          } catch (e) {
            setSaveStatus('');
          }
        }, 500);
      }, [companyId]);

      const handleAnswer = (qid, val) => {
        setShowError(false);
        const newAnswers = { ...answers };
        const newAuto = { ...autoSuggested };
        const newPartial = { ...partialTexts };

        // Set this answer
        newAnswers[qid] = { answer: val, partial_text: newPartial[qid] || null, was_auto_suggested: false };
        newAuto[qid] = false;

        const q = getQuestion(qid);
        // Find which section this question belongs to and check if it's the FIRST question of that section
        let isFirstOfSection = false;
        let sectionQuestions = [];
        for (const s of SECTIONS) {
          if (s.questions.length > 0 && s.questions[0].id === qid) {
            isFirstOfSection = true;
            sectionQuestions = s.questions;
            break;
          }
        }

        // If this is the first question of a section
        if (isFirstOfSection) {
          if (val === 'no') {
            // Auto-fill ALL other questions in this section with 'no' (if not manually set, or previously auto-suggested)
            sectionQuestions.forEach(sq => {
              if (sq.id === qid) return; // skip the first one itself
              const existing = newAnswers[sq.id];
              if (!existing || newAuto[sq.id]) {
                newAnswers[sq.id] = { answer: 'no', partial_text: null, was_auto_suggested: true };
                newAuto[sq.id] = true;
                scheduleSave(sq.id, { answer: 'no', partial_text: null, was_auto_suggested: true });
              }
            });
          } else {
            // First question changed to yes/partial → clear ALL auto-suggested in this section
            sectionQuestions.forEach(sq => {
              if (sq.id === qid) return;
              if (newAuto[sq.id]) {
                delete newAnswers[sq.id];
                newAuto[sq.id] = false;
                if (supabase) {
                  supabase.from('esg_answers').delete().eq('company_id', companyId).eq('question_id', sq.id);
                }
              }
            });
          }
        }
        // Also keep the original parent/child logic for nested questions (q_2_2 → q_2_2_1, etc.)
        else if (q && q.isParent) {
          const children = getChildren(qid);
          if (val === 'no') {
            children.forEach(c => {
              const existing = newAnswers[c.id];
              if (!existing || newAuto[c.id]) {
                newAnswers[c.id] = { answer: 'no', partial_text: null, was_auto_suggested: true };
                newAuto[c.id] = true;
                scheduleSave(c.id, { answer: 'no', partial_text: null, was_auto_suggested: true });
              }
            });
          } else {
            children.forEach(c => {
              if (newAuto[c.id]) {
                delete newAnswers[c.id];
                newAuto[c.id] = false;
                if (supabase) {
                  supabase.from('esg_answers').delete().eq('company_id', companyId).eq('question_id', c.id);
                }
              }
            });
          }
        }

        setAnswers(newAnswers);
        setAutoSuggested(newAuto);
        scheduleSave(qid, { answer: val, partial_text: newPartial[qid] || null, was_auto_suggested: false });
      };

      const handlePartialText = (qid, txt) => {
        const newPartial = { ...partialTexts, [qid]: txt };
        setPartialTexts(newPartial);
        const newAnswers = { ...answers };
        if (newAnswers[qid]) {
          newAnswers[qid] = { ...newAnswers[qid], partial_text: txt };
          setAnswers(newAnswers);
          scheduleSave(qid, { answer: 'partial', partial_text: txt, was_auto_suggested: false });
        }
      };

      // Validation: all questions in current section answered (partial text is optional)
      const validateSection = () => {
        for (const q of section.questions) {
          const a = answers[q.id];
          if (!a || !a.answer) return false;
        }
        return true;
      };

      const validateAll = () => {
        for (const q of ALL_QUESTIONS) {
          const a = answers[q.id];
          if (!a || !a.answer) return false;
        }
        return true;
      };

      const goNext = () => {
        if (!validateSection()) { setShowError(true); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
        setShowError(false);
        if (currentSection < SECTIONS.length - 1) {
          setCurrentSection(currentSection + 1);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };
      const goBack = () => {
        if (currentSection > 0) {
          setCurrentSection(currentSection - 1);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        }
      };
      const trySubmit = () => {
        if (!validateAll()) {
          setShowError(true);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          // Find first incomplete section
          for (let i = 0; i < SECTIONS.length; i++) {
            const incomplete = SECTIONS[i].questions.some(q => {
              const a = answers[q.id];
              return !a || !a.answer;
            });
            if (incomplete) { setCurrentSection(i); break; }
          }
          return;
        }
        setShowConfirm(true);
      };

      const doSubmit = async () => {
        setSubmitting(true);
        try {
          await onSubmit();
        } catch (e) {
          setSubmitting(false);
        }
      };

      const sectionQuestions = section.questions;
      const isLast = currentSection === SECTIONS.length - 1;

      // numbered display: count of question position within section (1-based)
      const numberedQs = sectionQuestions.map((q, i) => ({ q, num: i + 1 }));

      return React.createElement('div', { className: 'min-h-screen flex flex-col' },
        React.createElement(Header, { lang, setLang, companyName }),
        React.createElement('div', { className: 'flex-1 max-w-6xl w-full mx-auto px-4 lg:px-6 py-6' },

            // SIDEBAR
            React.createElement('aside', { className: 'lg:sticky lg:top-20 lg:self-start' },
              React.createElement('div', { className: 'bg-white border border-stone-200 rounded-2xl p-5' },
                React.createElement('p', { className: 'text-[10px] font-semibold text-stone-400 uppercase tracking-wider mb-1' }, T[lang].progress),
                React.createElement('div', { className: 'flex items-baseline gap-1 mb-3' },
                  React.createElement('span', { className: 'text-3xl font-semibold text-stone-900' }, pct),
                  React.createElement('span', { className: 'text-sm text-stone-500' }, '%')
                ),
                React.createElement('div', { className: 'h-1 bg-stone-100 rounded-full overflow-hidden mb-5' },
                  React.createElement('div', {
                    className: 'h-full transition-all duration-500 rounded-full',
                    style: { width: pct + '%', background: 'linear-gradient(90deg, #1F4D3C, #0F6E56)' }
                  })
                ),
                React.createElement('div', { className: 'space-y-0.5' },
                  sectionTitles.map((title, i) => {
                    const isActive = i === currentSection;
                    const isPast = i < currentSection;
                    const sectionQs = SECTIONS[i].questions;
                    const sectionAnswered = sectionQs.every(q => {
                      const a = answers[q.id];
                      return a && a.answer && (a.answer !== 'partial' || (partialTexts[q.id] && partialTexts[q.id].trim()));
                    });
                    return React.createElement('button', {
                      key: i,
                      onClick: () => setCurrentSection(i),
                      className: `w-full flex items-center gap-2.5 px-3 py-2 rounded-lg transition text-left ${isActive ? 'bg-stone-100' : 'hover:bg-stone-50'}`
                    },
                      React.createElement('div', {
                        className: `w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-medium flex-shrink-0 ${
                          isActive ? 'text-white' : sectionAnswered ? 'bg-emerald-100 text-emerald-700' : 'bg-stone-100 text-stone-500'
                        }`,
                        style: isActive ? { background: 'linear-gradient(135deg, #1F4D3C, #0F6E56)' } : {}
                      }, sectionAnswered && !isActive ? '✓' : (i + 1)),
                      React.createElement('span', {
                        className: `text-[13px] ${isActive ? 'text-stone-900 font-medium' : sectionAnswered ? 'text-stone-700' : 'text-stone-500'}`
                      }, title)
                    );
                  })
                )
              )
            ),
            // MAIN
            React.createElement('main', null,
              // Header card
              React.createElement('div', { className: 'bg-white border border-stone-200 rounded-2xl p-5 mb-4 flex items-center justify-between' },
                React.createElement('div', null,
                  React.createElement('p', { className: 'text-[10px] font-semibold text-stone-400 uppercase tracking-wider mb-1' },
                    T[lang].sectionLabel + ' ' + (currentSection + 1) + ' ' + T[lang].of + ' ' + SECTIONS.length
                  ),
                  React.createElement('h2', { className: 'text-xl font-semibold text-stone-900' }, sectionTitles[currentSection])
                ),
                saveStatus ? React.createElement('div', {
                  className: `flex items-center gap-1.5 text-xs ${saveStatus === 'saving' ? 'text-stone-500' : 'text-emerald-600'}`
                },
                  saveStatus === 'saving' ? React.createElement('span', null, '…') : React.createElement('span', null, '✓'),
                  saveStatus === 'saving' ? T[lang].saving : T[lang].saved
                ) : null
              ),
              // Error banner
              showError ? React.createElement('div', {
                className: 'bg-rose-50 border border-rose-200 rounded-xl p-4 mb-4 flex items-start gap-3 fade-in'
              },
                React.createElement('div', { className: 'w-5 h-5 rounded-full bg-rose-100 text-rose-700 text-xs font-bold flex items-center justify-center flex-shrink-0' }, '!'),
                React.createElement('div', { className: 'text-sm text-rose-800 font-medium' }, T[lang].mustAnswer)
              ) : null,
              // Questions
              React.createElement('div', null,
                numberedQs.map(({ q, num }) => {
                  const a = answers[q.id];
                  const ansVal = a ? a.answer : null;
                  const partial = partialTexts[q.id];
                  const isUnanswered = !ansVal;
                  const hasError = showError && isUnanswered;
                  return React.createElement(QuestionCard, {
                    key: q.id,
                    q, lang, index: num,
                    answer: ansVal,
                    partialText: partial,
                    autoSuggested: autoSuggested[q.id],
                    onAnswer: val => handleAnswer(q.id, val),
                    onPartialText: txt => handlePartialText(q.id, txt),
                    hasError
                  });
                })
              ),
              // Footer
              React.createElement('div', {
                className: 'flex items-center justify-between gap-3 mt-6 pt-5 border-t border-stone-200'
              },
                React.createElement('button', {
                  onClick: () => onSave(),
                  className: 'h-10 px-4 text-sm text-stone-600 hover:text-stone-900 hover:bg-stone-100 rounded-lg transition'
                }, T[lang].saveExit),
                React.createElement('div', { className: 'flex gap-2' },
                  React.createElement('button', {
                    onClick: goBack,
                    disabled: currentSection === 0,
                    className: 'h-10 px-4 text-sm text-stone-700 border border-stone-200 hover:bg-stone-50 rounded-lg transition disabled:opacity-40 disabled:cursor-not-allowed'
                  }, '← ', T[lang].back),
                  isLast
                    ? React.createElement('button', {
                        onClick: trySubmit,
                        className: 'h-10 px-5 text-sm font-medium text-white rounded-lg transition shadow-sm hover:shadow',
                        style: { background: 'linear-gradient(135deg, #1F4D3C, #0F6E56)' }
                      }, T[lang].submit)
                    : React.createElement('button', {
                        onClick: goNext,
                        className: 'h-10 px-5 text-sm font-medium bg-stone-900 hover:bg-stone-800 text-white rounded-lg transition'
                      }, T[lang].next, ' →')
                )
              )
            )
          )
        ),
        // Confirm modal
        showConfirm ? React.createElement('div', {
          className: 'fixed inset-0 bg-black/50 flex items-center justify-center px-4 z-50 fade-in',
          onClick: () => !submitting && setShowConfirm(false)
        },
          React.createElement('div', {
            className: 'bg-white rounded-2xl p-7 max-w-md w-full',
            onClick: e => e.stopPropagation()
          },
            React.createElement('div', { className: 'w-14 h-14 rounded-full bg-amber-50 mx-auto mb-4 flex items-center justify-center text-amber-700 text-2xl font-semibold' }, '!'),
            React.createElement('h3', { className: 'text-lg font-semibold text-stone-900 text-center mb-2' }, T[lang].confirmTitle),
            React.createElement('p', { className: 'text-sm text-stone-500 text-center leading-relaxed mb-6' }, T[lang].confirmMsg),
            React.createElement('div', { className: 'flex gap-2' },
              React.createElement('button', {
                onClick: () => setShowConfirm(false),
                disabled: submitting,
                className: 'flex-1 h-11 text-sm text-stone-700 border border-stone-200 hover:bg-stone-50 rounded-lg transition disabled:opacity-50'
              }, T[lang].cancel),
              React.createElement('button', {
                onClick: doSubmit,
                disabled: submitting,
                className: 'flex-1 h-11 text-sm font-medium text-white rounded-lg transition disabled:opacity-50',
                style: { background: 'linear-gradient(135deg, #1F4D3C, #0F6E56)' }
              }, submitting ? T[lang].loading : T[lang].confirmSubmit)
            )
          )
        ) : null
      );
    }

    // ----------- LOCKED SCREEN -----------
    function LockedScreen({ lang, setLang, submittedAt, companyName }) {
      const dateStr = submittedAt ? new Date(submittedAt).toLocaleDateString(lang === 'ka' ? 'ka-GE' : 'en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
      return React.createElement('div', { className: 'min-h-screen flex flex-col' },
        React.createElement(Header, { lang, setLang, companyName }),
        React.createElement('div', { className: 'flex-1 flex items-center justify-center px-4 py-12' },
          React.createElement('div', { className: 'w-full max-w-md text-center fade-in' },
            React.createElement('div', {
              className: 'w-20 h-20 rounded-full mx-auto mb-6 flex items-center justify-center text-white text-3xl shadow-lg',
              style: { background: 'linear-gradient(135deg, #1F4D3C, #0F6E56)' }
            }, '✓'),
            React.createElement('h1', { className: 'text-2xl font-semibold text-stone-900 mb-3' }, T[lang].lockedTitle),
            React.createElement('p', { className: 'text-sm text-stone-500 leading-relaxed mb-6' }, T[lang].lockedMsg),
            dateStr ? React.createElement('div', { className: 'bg-white border border-stone-200 rounded-xl p-4' },
              React.createElement('div', { className: 'text-[11px] text-stone-400 mb-1 font-medium uppercase tracking-wider' }, T[lang].submittedOn),
              React.createElement('div', { className: 'text-sm font-medium text-stone-900' }, dateStr)
            ) : null
          )
        )
      );
    }

    // ----------- SAVED SCREEN -----------
    function SavedScreen({ lang, setLang, onBack }) {
      return React.createElement('div', { className: 'min-h-screen flex flex-col' },
        React.createElement(Header, { lang, setLang }),
        React.createElement('div', { className: 'flex-1 flex items-center justify-center px-4 py-12' },
          React.createElement('div', { className: 'w-full max-w-md text-center fade-in' },
            React.createElement('div', { className: 'w-20 h-20 rounded-full mx-auto mb-6 flex items-center justify-center text-emerald-700 text-3xl bg-emerald-50' }, '⤓'),
            React.createElement('h1', { className: 'text-2xl font-semibold text-stone-900 mb-3' }, T[lang].savedTitle),
            React.createElement('p', { className: 'text-sm text-stone-500 leading-relaxed mb-6' }, T[lang].savedMsg),
            React.createElement('button', {
              onClick: onBack,
              className: 'h-11 px-6 text-sm text-stone-700 border border-stone-200 hover:bg-stone-50 rounded-lg transition'
            }, T[lang].backToLogin)
          )
        )
      );
    }

    // ============================================
    // ROOT APP
    // ============================================
    function App() {
      const [lang, setLangState] = useState('ka');
      const [screen, setScreen] = useState('login'); // login, info, wizard, locked, saved
      const [companyId, setCompanyId] = useState('');
      const [companyName, setCompanyName] = useState('');
      const [contact, setContact] = useState('');
      const [submittedAt, setSubmittedAt] = useState(null);
      const [initialAnswers, setInitialAnswers] = useState({});

      useEffect(() => {
        document.documentElement.lang = lang;
      }, [lang]);

      const setLang = (l) => {
        setLangState(l);
        if (companyId) updateCompany(companyId, { language: l });
      };

      const handleLogin = async (id) => {
        if (!supabase) {
          alert('Supabase not configured. Open the file in editor and add SUPABASE_URL and SUPABASE_ANON_KEY.');
          return;
        }
        setCompanyId(id);
        const { data: company } = await loadCompany(id);
        if (!company) {
          // New company → create + go to info screen
          await createCompany(id, lang);
          setScreen('info');
          return;
        }
        // Existing
        if (company.language) setLangState(company.language);
        setCompanyName(company.name || '');
        setContact(company.contact || '');
        if (company.is_locked) {
          setSubmittedAt(company.submitted_at);
          setScreen('locked');
          return;
        }
        if (!company.name || !company.contact) {
          setScreen('info');
          return;
        }
        // Load answers
        const { data: rows } = await loadAnswers(id);
        const map = {};
        rows.forEach(r => {
          map[r.question_id] = {
            answer: r.answer,
            partial_text: r.partial_text,
            was_auto_suggested: r.was_auto_suggested
          };
        });
        setInitialAnswers(map);
        setScreen('wizard');
      };

      const handleInfoSubmit = async (name, contactNum) => {
        await updateCompany(companyId, { name, contact: contactNum });
        setCompanyName(name);
        setContact(contactNum);
        setInitialAnswers({});
        setScreen('wizard');
      };

      const handleSave = () => setScreen('saved');

      const handleSubmitFinal = async () => {
        const { error } = await lockCompany(companyId);
        if (error) { alert(T[lang].connectError); return; }
        setSubmittedAt(new Date().toISOString());
        setScreen('locked');
      };

      const handleBackToLogin = () => {
        setCompanyId(''); setCompanyName(''); setContact(''); setInitialAnswers({});
        setScreen('login');
      };

      switch (screen) {
        case 'login':
          return React.createElement(LoginScreen, { lang, setLang: setLangState, onLogin: handleLogin });
        case 'info':
          return React.createElement(CompanyInfoScreen, { lang, setLang: setLangState, companyId, onSubmit: handleInfoSubmit });
        case 'wizard':
          return React.createElement(WizardScreen, {
            lang, setLang, companyId, companyName,
            initialAnswers,
            onSave: handleSave,
            onSubmit: handleSubmitFinal
          });
        case 'locked':
          return React.createElement(LockedScreen, { lang, setLang, submittedAt, companyName });
        case 'saved':
          return React.createElement(SavedScreen, { lang, setLang, onBack: handleBackToLogin });
        default:
          return null;
      }
    }

    const root = createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
