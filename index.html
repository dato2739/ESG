        questions: [
          { id: 'q_2_1', isParent: true,
            text: { ka: 'აქვს კომპანიას ხარისხის მართვის სერტიფიკატი?', en: 'Are there any certifications for the quality management system?' },

          { id: 'q_2_5',
            text: { ka: 'აქვს მომწოდებელს ხარისხის გაუმჯობესების სამოქმედო გეგმა?', en: 'Does the supplier have an action plan for quality improvement?' },

          { id: 'q_2_6',
            text: { ka: 'აქვს კომპანიას ორგანიზაციული სტრუქტურა გამოფენილი?', en: 'Does the supplier have an organizational chart displayed?' },
            tooltip: { ka: 'ორგანიზაციული სტრუქტურა - სქემა შიდა იერარქიით. მაგალითი: სამშენებლო კომპანიის ოფისში კედელზე გამოკრული A3 ფურცელი - ზემოთ გენერალური დირექტორი, ქვევით ხაზებით - სამშენებლო ობიექტების მენეჯერი, ხარისხის ინჟინერი, შესყიდვების მენეჯერი, თითოეულის ქვეშ - მათი გუნდები. ელექტრო კომპანიაში - ანალოგიური სქემა.', en: 'Org chart shows internal hierarchy. Example: in construction company office an A3 paper on wall - top General Director, lines below to construction project manager, quality engineer, procurement manager, under each their teams. Similar in electrical company.' } },

          { id: 'q_2_8',
            text: { ka: 'გამოაქვეყნებს კომპანია წლიურ ESG რეპორტს?', en: 'Does the company publish an annual ESG/Sustainability Report?' },
            tooltip: { ka: 'ESG ან Sustainability რეპორტი - წლიური საჯარო ანგარიში. მაგალითი: სამშენებლო კომპანიის 25-გვერდიანი PDF სათაურით 2024 წლის მდგრადობის ანგარიში - სადაც წერია გასულ წელს გადავამუშავეთ მშენებლობის ნარჩენების 65%, შევამცირეთ წყლის ხარჯვა 12%-ით. ელექტრო კომპანიაში - ჩამოვწერეთ რამდენი ენერგია დავზოგეთ LED ნათურებზე გადასვლით.', en: 'ESG/Sustainability report - annual public document. Example: construction company 25-page PDF titled 2024 Sustainability Report - last year recycled 65% of construction waste, reduced water use 12%. Electrical company - reported energy savings from switching to LED lighting.' } },
          { id: 'q_2_9', isParent: true,
            text: { ka: 'არის კლიენტთა კმაყოფილების შეფასების პროცედურა?', en: 'Are there customer satisfaction procedures?' },
            tooltip: { ka: 'კლიენტთა კმაყოფილების შეფასება. მაგალითი: სამშენებლო კომპანია ობიექტის ჩაბარების შემდეგ კლიენტს უგზავნის 5-კითხვიან ანკეტას - ვადებზე? ხარისხზე? კომუნიკაციაზე? გასუფთავებაზე? დაფინანსების სიცხადეზე? ელექტრო კომპანია სამონტაჟო სამუშაოების დასრულების შემდეგ ანალოგიურს. შემდეგ პასუხები აანალიზდება.', en: 'Customer satisfaction. Example: construction company sends 5-question survey after handover - deadlines? quality? communication? cleanup? billing transparency? Electrical company sends similar after installation. Then responses analyzed.' } },
          { id: 'q_2_10',
            text: { ka: 'არსებობს საჩივრებისა და კრიზის მართვის პროცედურა?', en: 'Does a claim and crisis management procedure exist?' },
            tooltip: { ka: 'საჩივრების მართვის პროცედურა. მაგალითი: სამშენებლო კომპანიის დოკუმენტი - კლიენტის საჩივრის (მაგ. წყალი ჟონავს ჭერიდან) მიღებიდან 24 საათში ხდება ვიზიტი ობიექტზე, 3 დღეში დადგინდება მიზეზი, 7 დღეში მოგვარდება. ელექტრო - თუ კლიენტი უჩივის ფარის მუშაობას, 48 საათში გამოდის ელექტრიკოსი.', en: 'Claim management procedure. Example: construction company document - upon complaint (e.g. water leaking from ceiling) within 24h site visit, 3 days cause identified, 7 days resolved. Electrical - if client complains about panel operation, electrician arrives within 48h.' } },
          { id: 'q_2_11',
            text: { ka: 'არის შეკვეთის თვალყურის-დევნების პროცედურა?', en: 'Are there order follow-up procedures?' },
            tooltip: { ka: 'შეკვეთის თვალყურის-დევნება. მაგალითი: სამშენებლო კომპანიის კლიენტი დარეკავს და კითხულობს რა მდგომარეობაშია ჩემი სახლი? - მენეჯერი 30 წამში პასუხობს ფუნდამენტი ჩამოსხმულია 12 ნოემბერს, კედლები აშენდება 25-მდე, სახურავი დეკემბერში. ელექტრო კომპანიაში - კლიენტი ხედავს მის შეკვეთილ ფარების სტატუსს ცხრილში.', en: 'Order tracking. Example: construction client calls asking what is status of my house? - manager responds in 30 sec foundation poured Nov 12, walls finished by 25th, roof in December. Electrical company - client sees status of ordered panels in spreadsheet.' } },
          { id: 'q_2_12',
            text: { ka: 'აქვს მომწოდებელს დოკუმენტების მართვის სისტემა?', en: 'Does the supplier have a document management system?' },
            tooltip: { ka: 'დოკუმენტების მართვის სისტემა. მაგალითი: სამშენებლო კომპანიის Google Drive სტრუქტურა - 01-პროექტები / 02-ხელშეკრულებები / 03-მასალის ცნობები / 04-ფარდების სქემები / 05-სერტიფიკატები. ელექტრო კომპანია - ანალოგიური სტრუქტურა. ნებისმიერ მომენტში მენეჯერი 1 წუთში პოულობს ხელშეკრულებას.', en: 'Document management. Example: construction company Google Drive structure - 01-Projects / 02-Contracts / 03-Material Certificates / 04-Wiring Diagrams / 05-Certifications. Electrical company - similar structure. Any moment manager finds a contract in 1 minute.' } },
          { id: 'q_2_13', isParent: true,
            text: { ka: 'არის ტრენინგ-პროგრამები მენეჯმენტისთვის და თანამშრომლებისთვის?', en: 'Are there training programs for management and employees?' },
            tooltip: { ka: 'ტრენინგ-პროგრამა. მაგალითი: სამშენებლო კომპანიაში ყოველი ახალი მუშა გადის 2-დღიან საფუძველს - უსაფრთხოება სიმაღლეზე, არმატურის შეკვრა, ბეტონის დასხმა. ელექტრო კომპანიაში - 3-დღიანი ტრენინგი ELECTRO 5 (CE მარკირება, კავშირების ტიპები, უსაფრთხოების სტანდარტები). ყოველი 2 წელიწადში განახლება.', en: 'Training program. Example: construction company every new worker takes 2-day basics - working at heights, rebar tying, concrete pouring. Electrical company - 3-day training (CE marking, connection types, safety standards). Refresher every 2 years.' } },
          { id: 'q_2_13_1', parent: 'q_2_13',
            text: { ka: 'თანამშრომლები საკმარისად კვალიფიციურები არიან?', en: 'Are the employees properly skilled for their role?' },
            tooltip: { ka: 'შეესაბამება თუ არა უნარები პოზიციას. მაგალითი: სამშენებლო კომპანიაში ბრიგადირს აქვს მინიმუმ 5 წლიანი გამოცდილება, ფასადის სამუშაოების სერტიფიკატი. არქიტექტორს - ARCHITECT დიპლომი. ელექტრო კომპანიაში ელექტრიკოსს - ელექტრიკოსის მოწმობა, მომაღლე ვოლტის სამუშაოებზე უფლების მოწმობა.', en: 'Do skills match positions. Example: construction company foreman has min 5 years experience, facade work certificate. Architect - architecture degree. Electrical company electrician - electrician license, high-voltage work permit.' } },
          { id: 'q_2_13_2', parent: 'q_2_13',
            text: { ka: 'არის მუშათა ტრენინგისა და ცოდნის ამაღლების პროგრამა?', en: 'Are there worker training or knowledge programs?' },
            tooltip: { ka: 'მუშაკთა ტრენინგი. მაგალითი: სამშენებლო კომპანიაში ახალი ლიფტისებური ტოკარის შემოყვანისას ყველა ბრიგადირი გადის 1-დღიან ტრენინგს - უსაფრთხო გამოყენება, სტრობირების ტექნიკა. ელექტრო კომპანიაში - ახალი მაკეტირების სისტემა შემოდის და ყველა მონტაჟიორი გადის 4-საათიან კურსს.', en: 'Worker training. Example: construction company when new lift-type lathe is introduced all foremen take 1-day training - safe use, stroking technique. Electrical company - new wiring diagram system arrives and all installers take 4-hour course.' } },
          { id: 'q_2_14', isParent: true,
            text: { ka: 'მოწოდებული მასალები მოწმდება შემოსვლისას?', en: 'Are incoming materials inspected upon arrival?' },
            tooltip: { ka: 'შემოსული მასალის შემოწმება. მაგალითი: სამშენებლო ობიექტზე მოვიდა 50 ტონა ცემენტი - ამოწმებთ მარკას (M-500 ნამდვილად?), ვადას (3 თვეზე ძველი არ არის?), მშრალია (არ დაცემენდდა?), მომწოდებლის სერტიფიკატს. ელექტრო - 1000 მ კაბელი მოვიდა, ამოწმებთ კვეთს (3x2.5 ნამდვილად?), იზოლაციას, მარკირებას.', en: 'Receiving inspection. Example: 50 tons cement arrives at construction site - check grade (really M-500?), date (not over 3 months?), dry (not hardened?), supplier certificate. Electrical - 1000m cable arrives, check cross-section (really 3x2.5?), insulation, marking.' } },
          { id: 'q_2_14_1', parent: 'q_2_14',
            text: { ka: 'არის შემოსული მასალების ინსპექციის წერილობითი პროცედურა?', en: 'Are there written inspection procedures for incoming materials?' },
            tooltip: { ka: 'წერილობითი ინსპექციის პროცედურა. მაგალითი: სამშენებლო ობიექტზე გამოკრული A4 ფურცელი მასალის მიღების ინსტრუქცია - 1) შეადარე ტრანსპორტო ნაკადი ფაქტს; 2) ნახე სერტიფიკატი; 3) ამოღე ნიმუში ლაბორატორიისთვის; 4) ხელი მოაწერე ჟურნალს. ელექტრო კომპანიაში - მსგავსი ინსტრუქცია კაბელებზე.', en: 'Written inspection procedure. Example: at construction site A4 paper Material Receiving Instructions - 1) Compare delivery to actual; 2) Check certificate; 3) Take sample for lab; 4) Sign log. Electrical company - similar instruction for cables.' } },
          { id: 'q_2_14_2', parent: 'q_2_14',
            text: { ka: 'მიღებული და უარყოფილი მასალები ცალ-ცალკე ინახება?', en: 'Are accepted vs rejected materials kept segregated?' },
            tooltip: { ka: 'მისაღები და უარყოფილი მასალის სეგრეგაცია. მაგალითი: სამშენებლო ობიექტზე ორი ცალკე ზონა - მწვანე ლენტით მზადაა გამოყენებისთვის და წითელი ლენტით უარყოფილი - არ გამოვიყენოთ. დაცემენდულ ცემენტის ტომარებს აქვთ მონიშვნა - უარყოფილი 8/11/2024. ელექტრო - დაზიანებული კაბელები ცალკე ზონაში წითელი მონიშვნით.', en: 'Material segregation. Example: construction site two zones - green tape Ready for use and red tape Rejected - do not use. Hardened cement bags marked - Rejected 8/11/2024. Electrical - damaged cables in separate zone with red marking.' } },
          { id: 'q_2_15', isParent: true,
            text: { ka: 'არის წერილობითი პროცედურები ყველა საწარმოო პროცესისთვის?', en: 'Are there written procedures for all manufacturing processes?' },
            tooltip: { ka: 'წერილობითი პროცედურა (SOP). მაგალითი: სამშენებლო კომპანიის SOP კედლის შელესვა - 1) გასუფთავება და დასველება; 2) პირველი ფენა 8-10 მმ; 3) 24 სთ მოცდა; 4) მეორე ფენა 5-7 მმ; 5) გათანაბრება. ელექტრო - SOP ფარის მონტაჟი - 1) ფარდის ფიქსაცია; 2) კავშირების შემოწმება; 3) მარკირება; 4) გამოცდა მულტიმეტრით.', en: 'Written SOP. Example: construction SOP wall plastering - 1) Clean and dampen; 2) First coat 8-10mm; 3) 24h wait; 4) Second coat 5-7mm; 5) Smoothing. Electrical SOP panel mounting - 1) Panel fixing; 2) Connection check; 3) Labeling; 4) Multimeter testing.' } },
          { id: 'q_2_15_1', parent: 'q_2_15',
            text: { ka: 'მნიშვნელოვანი მახასიათებლები მონიტორინგდება წარმოების დროს?', en: 'Are important characteristics monitored during production?' },
            tooltip: { ka: 'წარმოების დროს მონიტორინგი. მაგალითი: სამშენებლო ობიექტზე ბეტონის დასხმისას ყოველ 2 საათში ოპერატორი ამოწმებს კონუსს (15-20 სმ?), ტემპერატურას (5°C-ზე ზემოთ?), არმატურის ფიქსაციას. ელექტრო - ფარის ხელით აწყობისას ყოველი 10 ფარის შემდეგ ამოწმებენ - ხრახნილების მოჭიმვა, კავშირების ხარისხი.', en: 'In-process monitoring. Example: at construction site during concrete pouring, every 2 hours operator checks slump (15-20cm?), temperature (above 5°C?), rebar fixation. Electrical - during panel assembly every 10 panels checked - screw torque, connection quality.' } },
          { id: 'q_2_15_2', parent: 'q_2_15',
            text: { ka: 'ტარდება საბოლოო ინსპექცია თითოეულ პარტიაზე?', en: 'Is final inspection performed on each lot?' },
            tooltip: { ka: 'საბოლოო ინსპექცია. მაგალითი: სამშენებლო კომპანიაში სართულის დასრულების შემდეგ ხარისხის ინჟინერი ამოწმებს ყველაფერს ჩეკლისტით - კედლების სიწორე, კუთხეების სისწორე, იატაკის ჰორიზონტალი, წყლის ხაზის ფუნქციონალი. ელექტრო - ფარის გაგზავნამდე ხდება ცარიელი ცდა (24 სთ მუშაობა გადახურვის გარეშე).', en: 'Final inspection. Example: construction company after floor completion quality engineer checks everything with checklist - wall straightness, corner accuracy, floor level, water line function. Electrical - before panel shipment empty test (24h operation without overload).' } }
        ]
      },
      // SECTION 2: HUMAN RIGHTS
      {
        key: 'humanRights',
        questions: [
          { id: 'q_3_1', isParent: true,
            text: { ka: 'აქვს კომპანიას ადამიანის უფლებების დაცვის პოლიტიკა?', en: 'Has the company established human rights policies?' },
            tooltip: { ka: 'ადამიანის უფლებების პოლიტიკა - წერილობითი დოკუმენტი. მაგალითი: სამშენებლო კომპანიის 2-გვერდიანი დოკუმენტი ჩვენი ვალდებულება ადამიანის უფლებებზე - ჩვენ პატივს ვცემთ ყოველი მუშაკის ღირსებას (ბრიგადირი, არმატურშიკი, ფასადელი), არ გამოვიყენებთ იძულებას, არ ვცდილობთ დისკრიმინაციას. ელექტრო კომპანიაშიც ანალოგიური დოკუმენტი ხელმოწერილი დირექტორის მიერ.', en: 'Human rights policy - written document. Example: construction company 2-page document Our Human Rights Commitment - We respect every worker dignity (foreman, rebar worker, facade worker), will not use coercion, do not allow discrimination. Electrical company - similar document signed by director.' } },
          { id: 'q_3_1_1', parent: 'q_3_1',
            text: { ka: 'უზრუნველყოფს უსაფრთხო და ჯანსაღ სამუშაო პირობებს?', en: 'Are safe and healthy working conditions provided?' },
            tooltip: { ka: 'უსაფრთხო და ჯანსაღი სამუშაო პირობები. მაგალითი: სამშენებლო ობიექტზე გაქვთ - ჩაფხუტები, უსაფრთხოების სარტყელები სიმაღლეზე მუშაობისას, ხანძარსაწინააღმდეგო ცეცხლმაქრები, პირველი დახმარების ყუთი, შესვენების ფარდული. ელექტრო კომპანიაში - იზოლირებული ხელსაწყოები, დიელექტრიკული ხელთათმანები, ვოლტმეტრი შემოწმებისთვის.', en: 'Safe healthy working conditions. Example: at construction site you have - helmets, safety harnesses for height work, fire extinguishers, first aid kit, break shed. Electrical company - insulated tools, dielectric gloves, voltmeter for testing.' } },
          { id: 'q_3_1_2', parent: 'q_3_1',
            text: { ka: 'უზრუნველყოფს გაერთიანების თავისუფლებას?', en: 'Is freedom of association guaranteed?' },
            tooltip: { ka: 'გაერთიანების თავისუფლება. მაგალითი: სამშენებლო კომპანიაში 80 მუშიდან 25 გადაწყვეტს შექმნას არაფორმალური ჯგუფი ხელფასების მოლაპარაკებისთვის - კომპანიის რეაქცია არ უნდა იყოს მათი გაშინება. ელექტრო კომპანიაში მონტაჟიორების გუნდი ხდება პროფკავშირის წევრი - კომპანია არ ცდილობს ხელის შეშლას.', en: 'Freedom of association. Example: construction company of 80 workers 25 decide to form informal group for salary negotiation - company reaction should not be intimidation. Electrical company installer team becomes union members - company does not interfere.' } },
          { id: 'q_3_1_3', parent: 'q_3_1',
            text: { ka: 'უზრუნველყოფს არადისკრიმინაციულ კადრების პოლიტიკას?', en: 'Is non-discrimination ensured in personnel practices?' },
            tooltip: { ka: 'არადისკრიმინაციის უზრუნველყოფა. მაგალითი: სამშენებლო კომპანიაში ერთსა და იმავე პოზიციაზე (ფასადელი) მამაკაცი და ქალი ერთსა და იმავე ხელფასს იღებენ. ელექტრო კომპანიაში - 60 წლის ელექტრიკოსი და 30 წლის ერთსა და იმავე ხელფასს იღებენ თუ ერთი და იგივე გამოცდილება აქვთ. დაწინაურება ეფუძნება უნარებს.', en: 'Non-discrimination. Example: construction company same position (facade worker) man and woman get same salary. Electrical company - 60-year-old and 30-year-old electrician get same salary if same experience. Promotion based on skills.' } },
          { id: 'q_3_1_4', parent: 'q_3_1',
            text: { ka: 'არ იყენებს იძულებით ან ბავშვთა შრომას?', en: 'Is forced or child labour avoided directly and indirectly?' },
            tooltip: { ka: 'იძულებითი და ბავშვთა შრომის თავიდან აცილება. მაგალითი: სამშენებლო კომპანიაში არ ქირავდებიან 18 წლამდე პირები (კანონი 16-დან, თქვენ უფრო მკაცრი); არ ართმევთ მიგრანტი მუშაკების პასპორტებს. ელექტრო კომპანია იგივე ნორმებით. ეს ეხება არა მხოლოდ თქვენ, არამედ თქვენს სუბკონტრაქტორებს (მაგ. შემდუღებლების ბრიგადა).', en: 'Avoiding forced and child labor. Example: construction company does not hire under 18 (law allows from 16, you are stricter); do not take migrant worker passports. Electrical company same. Applies not only to you but also subcontractors (e.g. welding crew).' } },
          { id: 'q_3_2', isParent: true,
            text: { ka: 'ჩაატარა კომპანიამ ადამიანის უფლებების შეფასება იმ ქვეყნებში, სადაც საქმიანობს?', en: 'Has the company performed a human rights assessment in operating countries?' },
            tooltip: { ka: 'ადამიანის უფლებების შეფასება ოპერაციული ქვეყნებისთვის. მაგალითი: სამშენებლო კომპანია იყენებს თურქული წარმოების კერამოგრანიტს - შეგისწავლიათ ფაბრიკის შრომის პირობები? ელექტრო კომპანია იყენებს ჩინური წარმოების ფარდებს - შეგისწავლიათ რომ ქარხნებში მინიმალური ხელფასი იცვლება? მაღალი რისკის ქვეყნებში გაცნობიერება აუცილებელია.', en: 'Human rights assessment for operating countries. Example: construction company uses Turkish ceramic tiles - have you studied factory labor conditions? Electrical company uses Chinese-made panels - have you studied that minimum wages are paid in factories? Awareness essential.' } },
          { id: 'q_3_2_1', parent: 'q_3_2',
            text: { ka: 'აქვს კომპანიას მკაფიო პოლიტიკა, რომელიც იცავს როგორც საკუთარი თანამშრომლების, ასევე მიწოდების ჯაჭვის მუშაკთა უფლებებს?', en: 'Does the company have explicit policies protecting workers human rights in employment and supply chain?' },
            tooltip: { ka: 'პოლიტიკა მთელი ჯაჭვისთვის. მაგალითი: სამშენებლო კომპანია - პოლიტიკა მოიცავს არა მხოლოდ თქვენს მუშებს, არამედ ნედლეულის (ცემენტი, აგური) მომწოდებლების ფაბრიკის მუშაკებს, ფასადის სუბკონტრაქტორის გუნდს. ელექტრო კომპანიის შემთხვევაში - კაბელის მომწოდებელი, სამონტაჟო სუბკონტრაქტორი.', en: 'Policy for entire chain. Example: construction company policy covers not only your workers but also raw material (cement, brick) supplier factory workers, facade subcontractor team. Electrical case - cable supplier, installation subcontractor.' } },
          { id: 'q_3_2_2', parent: 'q_3_2',
            text: { ka: 'აქვს მონიტორინგის სისტემა?', en: 'Has the company established monitoring/tracking system?' },
            tooltip: { ka: 'მონიტორინგის სისტემა. მაგალითი: სამშენებლო კომპანია წელიწადში ერთხელ ვიზიტს უგზავნის მთავარ სუბკონტრაქტორს (გაზსადენების ბრიგადა) - ესაუბრება მუშაკებს კონფიდენციალურად, ამოწმებს ხელფასებს. ელექტრო კომპანია ანალოგიურად ამოწმებს მის ფარების მომწოდებელ ქარხანას. ქაღალდზე დაწერილი პოლიტიკა საკმარისი არ არის.', en: 'Monitoring system. Example: construction company yearly visits main subcontractor (gas pipe crew) - talks confidentially with workers, checks salaries. Electrical company similarly checks its panel supplier factory. Policy on paper is not enough.' } },
          { id: 'q_3_2_3', parent: 'q_3_2',
            text: { ka: 'აქვს პოლიტიკა, რომ უსაფრთხოების ღონისძიებები არ იწვევდეს უფლებების დარღვევას?', en: 'Does security policy avoid contributing to human rights violations?' },
            tooltip: { ka: 'უსაფრთხოების სამსახურის წესები. მაგალითი: სამშენებლო ობიექტზე დაცვა ამოწმებს მასალების გასვლას - ეს ნორმალურია. მაგრამ თუ დაცვა ფიზიკურად აშინებს მუშას, რომელიც შესვენებაზე მოწევას იხდენდა - ეს დარღვევაა. ელექტრო კომპანიის დასაწყობში მუშაობდა - წერილობითი წესები ასეთი დარღვევების ასაცილებლად.', en: 'Security service rules. Example: at construction site security checks material exit - this is normal. But if security physically intimidates a worker who was smoking on break - this is violation. Electrical company warehouse - written rules to prevent such violations.' } }
        ]
      },
      // SECTION 3: LABOUR
      {
        key: 'labour',
        questions: [
          { id: 'q_4_1', isParent: true,
            text: { ka: 'კომპანია პატივს სცემს მუშაკთა უფლებას შექმნან პროფკავშირები?', en: 'Does the company respect workers right to form trade unions?' },
            tooltip: { ka: 'პროფკავშირის უფლება. მაგალითი: სამშენებლო კომპანიის 60 მუშიდან 20 წევრიანდება საქართველოს მშენებელ-მონტაჟიორთა პროფკავშირში - კომპანია არ ცდილობს ხელის შეშლას. ელექტრო კომპანიის ელექტრიკოსები წევრობენ ენერგეტიკოსების პროფკავშირს. ისინი თავისუფლად ატარებენ შეხვედრებს ხელფასების მოლაპარაკებაზე.', en: 'Right to union. Example: construction company of 60 workers 20 join Georgian Construction Union - company does not interfere. Electrical company electricians belong to Energy Workers Union. They freely hold meetings on salary negotiations.' } },
          { id: 'q_4_1_1', parent: 'q_4_1',
            text: { ka: 'აქვს არადისკრიმინაციული პოლიტიკა და პროცედურები?', en: 'Are non-discriminatory policies and procedures in place?' },
            tooltip: { ka: 'არადისკრიმინაციული პოლიტიკები. მაგალითი: სამშენებლო კომპანიის HR-ს აქვს წერილობითი დოკუმენტი - კომპანია არ ახდენს დისკრიმინაციას სქესის, ასაკის, ეროვნების, რელიგიის გამო. ელექტრო კომპანიის წესები იგივეა - ქალი ელექტრიკოსი, ბერძენი ელექტრიკოსი, ბავშვიანი ელექტრიკოსი - ყველა თანაბარ პირობებშია.', en: 'Non-discriminatory policies. Example: construction company HR has written document - Company does not discriminate based on gender, age, nationality, religion. Electrical company rules same - female electrician, Greek electrician, parent electrician - all equal.' } },
          { id: 'q_4_1_2', parent: 'q_4_1',
            text: { ka: 'მუშაკთა წარმომადგენლებს ეძლევათ შესაბამისი საშუალებები?', en: 'Are workers representatives provided appropriate facilities?' },
            tooltip: { ka: 'მუშაკთა წარმომადგენლების საშუალებები. მაგალითი: სამშენებლო კომპანია იძლევა ბრიგადირების წარმომადგენელს - ერთ ოთახს კვირაში ერთხელ შესახვედრად, წვდომას უსაფრთხოების ჟურნალებზე, 2 სამუშაო საათს თვეში წარმომადგენლის ფუნქციისთვის. ელექტრო კომპანიაში მონტაჟიორების წარმომადგენელს ანალოგიური უფლებები.', en: 'Worker representative facilities. Example: construction company gives foreman representative - one room weekly for meetings, access to safety logs, 2 work hours/month for representative duties. Electrical company installer representative - similar rights.' } },
          { id: 'q_4_1_3', parent: 'q_4_1',
            text: { ka: 'არ ერევა მუშაკთა წარმომადგენლების საქმიანობაში?', en: 'Does the company avoid interfering with worker representatives?' },
            tooltip: { ka: 'არ ერევა წარმომადგენლების საქმიანობაში. მაგალითი: სამშენებლო კომპანიის ბრიგადირების წარმომადგენელი წერს კრიტიკულ წერილს - უსაფრთხოების ხელთათმანები ცუდი ხარისხისაა. კომპანია არ სჯის მას, არ ამცირებს ხელფასს. ელექტრო კომპანიაში - წარმომადგენელი ხდება ხელფასის ცვლილებების ინიციატორი - მისი მუშაობა არ წყდება.', en: 'Non-interference. Example: construction company foreman representative writes critical letter - safety gloves are poor quality. Company does not punish, does not reduce salary. Electrical company - representative initiates salary change - their work is not interrupted.' } },
          { id: 'q_4_2', isParent: true,
            text: { ka: 'კომპანიას აქვს მკაფიო პოლიტიკა იძულებითი შრომის წინააღმდეგ?', en: 'Does the company have clear policy against forced labour?' },
            tooltip: { ka: 'იძულებითი შრომის წინააღმდეგ პოლიტიკა. მაგალითი: სამშენებლო კომპანიის 1-გვერდიანი დოკუმენტი - არ ჩამოვართმევთ მიგრანტი მუშაკების პასპორტებს, არ ჩავწერთ მათ ვალში, ნებისმიერ მომენტში მუშაკს შეუძლია წავიდეს ხელფასით. ელექტრო კომპანიაში იგივე პოლიტიკა.', en: 'Anti-forced-labor policy. Example: construction company 1-page document - We will not confiscate migrant worker passports, will not put them in debt, any worker can leave with their salary at any time. Electrical company same policy.' } },
          { id: 'q_4_2_1', parent: 'q_4_2',
            text: { ka: 'ყველა თანამშრომელს ესმის, რა არის იძულებითი შრომა?', en: 'Do all officials understand what forced labour means?' },
            tooltip: { ka: 'თანამშრომლების ცოდნა იძულებით შრომაზე. მაგალითი: სამშენებლო კომპანიის HR გუნდი ყოველწლიურად გადის 2-საათიან ტრენინგს - რას ნიშნავს იძულებითი შრომა? ნიშნებია (პასპორტის ჩამორთმევა, ვალის ბრუნდი, ფიზიკური მუქარა). რა გავაკეთოთ თუ შევამჩნევთ? ელექტრო კომპანიაში HR ანალოგიურ ტრენინგს გადის.', en: 'Employee forced labor knowledge. Example: construction company HR yearly takes 2-hour training - what does forced labor mean? Signs (passport confiscation, debt bondage, physical threats). What to do if we notice? Electrical company HR takes similar training.' } },
          { id: 'q_4_2_2', parent: 'q_4_2',
            text: { ka: 'შრომითი ხელშეკრულებები იწერება მუშაკისთვის გასაგებ ენაზე?', en: 'Are employment contracts written in workers language?' },
            tooltip: { ka: 'ხელშეკრულება გასაგებ ენაზე. მაგალითი: სამშენებლო კომპანია ყაზახეთიდან ჩამოყვანილ მუშაკს ხელშეკრულებას აძლევს რუსულად ან ყაზახურად, არა ქართულად. ელექტრო კომპანიაში თურქი მუშაკისთვის ხელშეკრულება თურქულად. ხელშეკრულებაში ნათლად წერია ხელფასი, საათები, შვებულება.', en: 'Contract in understandable language. Example: construction company gives contract to worker from Kazakhstan in Russian or Kazakh, not Georgian. Electrical company - for Turkish worker contract in Turkish. Contract clearly states salary, hours, vacation.' } },
          { id: 'q_4_2_3', parent: 'q_4_2',
            text: { ka: 'კომპანია იცის რომელ ქვეყნებში/სექტორებში იძულებითი შრომის რისკი მაღალია?', en: 'Is the company aware of high-risk regions/sectors?' },
            tooltip: { ka: 'მაღალი რისკის რეგიონების ცოდნა. მაგალითი: სამშენებლო კომპანია იცის, რომ ცენტრალური აზიის სამშენებლო ობიექტებზე ცნობილია მიგრანტი მუშაკების ექსპლუატაცია - თუ ასეთი წყაროებიდან ღებულობთ ნედლეულს ან თვითონ მიდიხართ პროექტებში, იცით რისკი. ელექტრო კომპანიის შემთხვევაში - ჩინეთიდან კაბელის ფაბრიკები.', en: 'Knowledge of high-risk regions. Example: construction company knows that Central Asian construction sites are known for migrant worker exploitation - if you source from there or work on projects there, know the risk. Electrical company case - Chinese cable factories.' } },
          { id: 'q_4_2_4', parent: 'q_4_2',
            text: { ka: 'კომპანია არ ჩამოართმევს მუშაკებს პირადობის დოკუმენტებს?', en: 'Does the company avoid confiscating workers identity documents?' },
            tooltip: { ka: 'პასპორტების არ ჩამორთმევა. მაგალითი: სამშენებლო კომპანიაში ჩამოვიდა 10 უზბეკი მუშა - არ ვიკავებთ მათ პასპორტებს შესანახად. თუ მათ მოუნდებათ წასვლა, შეუძლიათ წავიდნენ პასპორტით. ელექტრო კომპანიაში - იგივე პოლიტიკა მიგრანტი მონტაჟიორებისთვის.', en: 'Not confiscating passports. Example: 10 Uzbek workers arrive at construction company - we do not keep their passports for safekeeping. If they want to leave, they can with passport. Electrical company - same policy for migrant installers.' } },
          { id: 'q_4_2_5', parent: 'q_4_2',
            text: { ka: 'მონიტორინგდება მიწოდების ჯაჭვი და სუბკონტრაქტორები?', en: 'Are supply chains and subcontractors monitored?' },
            tooltip: { ka: 'მომწოდებლების მონიტორინგი. მაგალითი: სამშენებლო კომპანია ყოველ 6 თვეში ცემენტის მთავარ მომწოდებელს უგზავნის კითხვარს - გყავთ მიგრანტი მუშაკები? ინახავთ მათ პასპორტებს? ელექტრო კომპანია იგივე ეპირისპირება ფარების მომწოდებელ ქარხანას. მაღალი რისკის შემთხვევაში ვიზიტიც ხდება.', en: 'Supplier monitoring. Example: construction company every 6 months sends main cement supplier questionnaire - Do you have migrant workers? Keep their passports? Electrical company same to panel supplier factory. High risk - on-site visit also.' } },
          { id: 'q_4_3', isParent: true,
            text: { ka: 'კომპანია ანვითარებს ცნობიერებას ბავშვთა შრომის მიზეზებსა და შედეგებზე?', en: 'Is awareness of child labour developed within the company?' },
            tooltip: { ka: 'ბავშვთა შრომის ცნობიერება. მაგალითი: სამშენებლო კომპანიის ყოველწლიური 1-საათიანი ვებინარი ყველა ბრიგადირისთვის - ბავშვთა შრომის რისკი ჩვენს ინდუსტრიაში (გადასატანი მასალის ბრიგადებში 16 წლამდე ბავშვები გვხვდება ხშირად). ელექტრო - ცნობიერება სუბკონტრაქტორების შესახებ.', en: 'Child labor awareness. Example: construction company yearly 1-hour webinar for all foremen - Child Labor Risk in Our Industry (under-16 children sometimes found in material-carrying crews). Electrical - awareness about subcontractors.' } },
          { id: 'q_4_3_1', parent: 'q_4_3',
            text: { ka: 'იცავს ეროვნული კანონით დადგენილ მინიმალურ ასაკობრივ ნორმებს?', en: 'Does the company adhere to minimum age provisions?' },
            tooltip: { ka: 'მინიმალური ასაკის დაცვა. მაგალითი: სამშენებლო კომპანიაში 14 წლის ბავშვი მოვა სამუშაოზე ფიზიკური დახმარებისთვის - არ ქირავდებით (კანონი 16-დან). სახიფათო სამუშაოზე (სიმაღლე, ცემენტი) მხოლოდ 18+. ელექტრო კომპანიაში 17 წლის სტუდენტი - მხოლოდ მსუბუქი, არასახიფათო სამუშაო (კაბელების მონიშვნა, არ მაღალი ვოლტი).', en: 'Minimum age compliance. Example: construction company 14-year-old shows up for physical help - not hired (law from 16). Hazardous work (heights, cement) only 18+. Electrical company 17-year-old student - only light, non-hazardous work (cable labeling, not high voltage).' } },
          { id: 'q_4_3_2', parent: 'q_4_3',
            text: { ka: 'ცნობს ბავშვთა შრომის რისკ-ქვეყნებსა და სექტორებს?', en: 'Is the company aware of high-risk regions for child labour?' },
            tooltip: { ka: 'რისკ-რეგიონების ცოდნა. მაგალითი: სამშენებლო კომპანია იცის - მცირე ფიზიკურ სამუშაოებზე (აგურის გადატანა) მაღალია 16 წლამდე ბავშვების შრომის რისკი ცენტრალური აზიის ქვეყნებში. ელექტრო კომპანია იცის - კაბელების ხელით აწყობის ფაბრიკებში სამხრეთ-აღმოსავლეთ აზიაში გვხვდება ბავშვთა შრომა.', en: 'Risk regions knowledge. Example: construction company knows - on small physical jobs (brick carrying) under-16 children labor risk is high in Central Asian countries. Electrical company knows - in hand-assembled cable factories in Southeast Asia child labor is found.' } },
          { id: 'q_4_3_3', parent: 'q_4_3',
            text: { ka: 'იყენებს ასაკის შემოწმების მექანიზმებს დაქირავებისას?', en: 'Are age verification mechanisms used in recruitment?' },
            tooltip: { ka: 'ასაკის შემოწმება. მაგალითი: სამშენებლო კომპანიის HR ყოველ ახალ მუშაკს ითხოვს პირადობის მოწმობას, აკოპირებს, აღნიშნავს დაბადების თარიღს ხელშეკრულებაში. თუ კანდიდატმა არ მოიტანა ID, არ ქირავდება. ელექტრო კომპანია - იგივე პროცესი ყველა მონტაჟიორის დაქირავებისას.', en: 'Age verification. Example: construction company HR asks every new worker for ID, copies it, notes birth date in contract. If candidate cannot bring ID, not hired. Electrical company - same process for every installer hire.' } },
          { id: 'q_4_3_4', parent: 'q_4_3',
            text: { ka: 'აქვს პოლიტიკა 18 წლამდე პირების დაქირავების წინააღმდეგ?', en: 'Does the company have policy against hiring under 18?' },
            tooltip: { ka: '18 წლამდე დაქირავების აკრძალვა. მაგალითი: სამშენებლო კომპანიის HR პოლიტიკა - მიუხედავად იმისა, რომ კანონი იძლევა 16 წლიდან, ჩვენ ვქირავდებით მხოლოდ 18+. ეს გამორიცხავს ნებისმიერ რისკს ბავშვთა შრომასთან. ელექტრო კომპანიაში - იგივე პოლიტიკა, განსაკუთრებით ვინაიდან ვოლტაჟთან მუშაობა საფრთხის შემცველია.', en: 'Banning under 18. Example: construction company HR policy - Although law allows from 16, we only hire 18+. Eliminates any child labor risk. Electrical company - same policy, especially since voltage work is hazardous.' } },
          { id: 'q_4_3_5', parent: 'q_4_3',
            text: { ka: 'ახდენს გავლენას ქვე-კონტრაქტორებზე ბავშვთა შრომის წინააღმდეგ?', en: 'Does the company influence subcontractors against child labour?' },
            tooltip: { ka: 'მომწოდებლებზე გავლენა. მაგალითი: სამშენებლო კომპანიის ხელშეკრულებაში სუბკონტრაქტორთან წერია - არ გამოიყენებთ ბავშვთა შრომას, დარღვევის შემთხვევაში ხელშეკრულება შეწყდება. ყოველწლიური აუდიტი ობიექტზე. ელექტრო კომპანიის ხელშეკრულება ფარების მომწოდებელთან - იგივე მუხლი.', en: 'Influence on suppliers. Example: construction company contract with subcontractor states - You will not use child labor, contract terminated upon violation. Yearly site audit. Electrical company contract with panel supplier - same clause.' } },
          { id: 'q_4_3_6', parent: 'q_4_3',
            text: { ka: 'შემუშავებული აქვს ბავშვთა შრომის გამოვლენის მექანიზმი?', en: 'Has the company developed mechanisms to detect child labour?' },
            tooltip: { ka: 'გამოვლენის მექანიზმი. მაგალითი: სამშენებლო ობიექტზე გამოკრულია ცხელი ხაზის ნომერი - ნებისმიერ მუშას შეუძლია ანონიმურად დარეკოს და განაცხადოს, თუ შეამჩნევს ბავშვის მუშაობას. ელექტრო კომპანიაში ბრიგადირები გადიან ტრენინგს - თუ ფაბრიკაში ან სუბკონტრაქტორთან ვიზიტისას დაინახე მცირე მოზარდი, ვის შეატყობინო.', en: 'Detection mechanism. Example: construction site has hotline number posted - any worker can anonymously call and report if seeing child working. Electrical company foremen take training - if you see young teenager during factory or subcontractor visit, report to whom.' } },
          { id: 'q_4_4', isParent: true,
            text: { ka: 'კვალიფიკაცია, უნარები და გამოცდილება არის დაქირავების და დაწინაურების საფუძველი?', en: 'Are qualifications, skill, experience the basis for recruitment/promotion?' },
            tooltip: { ka: 'დაქირავება უნარების მიხედვით. მაგალითი: სამშენებლო კომპანიის ბრიგადირის ვაკანსიაზე ქირავდება ნიკა, რადგან მას აქვს 8 წლიანი გამოცდილება, ფასადელის სერტიფიკატი - არა იმიტომ რომ ის გენერალური დირექტორის ნათესავია. ელექტრო კომპანიაში ელექტრიკოსს ქირავდება მოწმობის და გამოცდილების მიხედვით, არა პირადი კავშირების.', en: 'Hiring by skills. Example: construction company foreman position - Nick is hired because he has 8 years experience, facade certificate - not because he is General Director relative. Electrical company hires electrician by license and experience, not personal connections.' } },
          { id: 'q_4_4_1', parent: 'q_4_4',
            text: { ka: 'მაღალი დონის პასუხისმგებელი პირი დანიშნულია თანასწორი დასაქმების საკითხებზე?', en: 'Is high-level responsibility assigned for equal employment?' },
            tooltip: { ka: 'მაღალი დონის პასუხისმგებელი პირი. მაგალითი: სამშენებლო კომპანიაში HR დირექტორი ოფიციალურად დანიშნულია თანასწორი დასაქმების ხელმძღვანელი - მის სამუშაოს აღწერაშია, წელიწადში ერთხელ ანგარიშს აკეთებს. ელექტრო კომპანიაში - HR-ის ხელმძღვანელი ანალოგიურ როლშია.', en: 'High-level responsible person. Example: construction company HR Director officially designated Equal Employment Lead - in their job description, yearly reports. Electrical company - HR head plays similar role.' } },
          { id: 'q_4_4_2', parent: 'q_4_4',
            text: { ka: 'ინახება განახლებული ჩანაწერები დაქირავების, ტრენინგის და დაწინაურების შესახებ?', en: 'Are records kept on recruitment, training, promotion?' },
            tooltip: { ka: 'HR ჩანაწერების შენახვა. მაგალითი: სამშენებლო კომპანიის Excel ფაილი - 01.03.2024 დაიქირავა გიორგი, ფასადელი - 2-ე კატეგორია, ხელფასი 1800 ლარი, კრიტერიუმი 5 წელი გამოცდილება. ელექტრო კომპანია - ანალოგიური ცხრილი ელექტრიკოსების შესახებ.', en: 'HR records. Example: construction company Excel file - 01.03.2024 hired George, facade worker - level 2, salary 1800 GEL, criteria 5 years experience. Electrical company - similar spreadsheet for electricians.' } },
          { id: 'q_4_4_3', parent: 'q_4_4',
            text: { ka: 'ტარდება არაცნობიერი მიკერძოების ტრენინგი?', en: 'Is unconscious bias training conducted?' },
            tooltip: { ka: 'არაცნობიერი მიკერძოების ტრენინგი. მაგალითი: სამშენებლო კომპანიის ინტერვიუს დროს, ერთ პასუხზე ინტერვიუერი არაცნობიერად ფიქრობს ეს მამაკაცი თავდაჯერებულია, კარგი ბრიგადირი იქნება, ხოლო ქალის მსგავს პასუხზე ცოტა აგრესიულია. ტრენინგი ეხმარება ამ ფარული მიკერძოების გაცნობიერებაში. ელექტრო კომპანიაში იგივე საკითხი.', en: 'Unconscious bias training. Example: in construction company interview, on same answer interviewer subconsciously thinks this man is confident, will be good foreman, but on similar answer from woman thinks she is a bit aggressive. Training helps recognize hidden biases. Same issue in electrical company.' } },
          { id: 'q_4_4_4', parent: 'q_4_4',
            text: { ka: 'აქვს საჩივრების წარდგენის პროცედურა დისკრიმინაციის შემთხვევაში?', en: 'Are grievance procedures developed for discrimination?' },
            tooltip: { ka: 'საჩივრების პროცედურა. მაგალითი: სამშენებლო კომპანიის დოკუმენტი - თუ მუშა გრძნობს დისკრიმინაციას, შეუძლია ანონიმურად დაწეროს email-ი complaints@company.ge - 5 დღეში HR ჩაატარებს გამოკვლევას, 14 დღეში გამოიცემა შედეგი. ელექტრო კომპანიაში - იგივე პროცედურა.', en: 'Grievance procedure. Example: construction company document - If worker feels discrimination, can anonymously email complaints@company.ge - within 5 days HR investigates, 14 days result issued. Electrical company - same procedure.' } },
          { id: 'q_4_4_5', parent: 'q_4_4',
            text: { ka: 'ტარდება არადისკრიმინაციული პოლიტიკის ტრენინგი?', en: 'Is non-discrimination training provided?' },
            tooltip: { ka: 'დისკრიმინაციის ტრენინგი. მაგალითი: სამშენებლო კომპანიაში ყოველწლიური 1-საათიანი online ტრენინგი ყველა ბრიგადირისთვის - რა არის დისკრიმინაცია? მაგალითები: ხუმრობა ეროვნებაზე ობიექტზე, ქალის გამოყოფა შეხვედრებიდან. ელექტრო კომპანიაში მონტაჟიორებისთვის - იგივე ტრენინგი.', en: 'Discrimination training. Example: construction company yearly 1-hour online training for all foremen - What is discrimination? Examples: nationality jokes on site, excluding women from meetings. Electrical company for installers - same training.' } },
          { id: 'q_4_4_6', parent: 'q_4_4',
            text: { ka: 'აქვს უნარების განვითარების ხელმისაწვდომობის პროგრამა?', en: 'Are programs in place to promote access to skills training?' },
            tooltip: { ka: 'უნარების განვითარების ხელმისაწვდომობა. მაგალითი: სამშენებლო კომპანიას აქვს ვაუჩერი ტრენინგებზე (მაგ. ფასადელის გადახარისხება, ლაზერული ხელსაწყოს გამოყენება) - ნებისმიერი მუშა შეიძლება განცხადოს, არა მხოლოდ მენეჯერების რეკომენდაციით. ელექტრო კომპანიაში - ანალოგიურად მაღალი ვოლტის ტრენინგი ხელმისაწვდომია ყველასთვის.', en: 'Skills development access. Example: construction company has training vouchers (e.g. facade worker re-certification, laser tool training) - any worker can apply, not only by manager recommendation. Electrical company - high-voltage training similarly available to all.' } }
        ]
      },
      // SECTION 4: ENVIRONMENT
      {
        key: 'environment',
        questions: [
          { id: 'q_5_1', isParent: true,
            text: { ka: 'აქვს კომპანიას ქცევის კოდექსი ჯანმრთელობასა და გარემოზე ზრუნვისთვის?', en: 'Does the company have code of conduct for health/environment care?' },
            tooltip: { ka: 'ქცევის კოდექსი. მაგალითი: სამშენებლო კომპანიის 3-გვერდიანი დოკუმენტი ჩვენი ვალდებულება გარემოს მიმართ - მშენებლობის ნარჩენების 70%-ს გადავამუშავებთ, ვმუშაობთ მხოლოდ FSC სერტიფიცირებულ ხეზე, მტვრის ემისიას ვაკონტროლებთ. ელექტრო კომპანია - დაცული მონაცემები კაბელების ნარჩენების უტილიზაციაზე.', en: 'Code of conduct. Example: construction company 3-page document Our Environmental Commitment - We recycle 70% of construction waste, work only with FSC certified wood, control dust emissions. Electrical company - data on cable waste disposal.' } },
          { id: 'q_5_1_1', parent: 'q_5_1',
            text: { ka: 'აქვს მენეჯერული კომიტეტი წინდახედული მიდგომის ზედამხედველობისთვის?', en: 'Is there a managerial committee overseeing precautionary application?' },
            tooltip: { ka: 'მენეჯერული კომიტეტი. მაგალითი: სამშენებლო კომპანიაში კვარტალურად იკრიბება გარემოს კომიტეტი - დირექტორი, ობიექტების მენეჯერი, ESG ხელმძღვანელი. განიხილავენ - რამდენი ნარჩენი წარმოიქმნა ფასადის ობიექტზე, რამდენი წყალი დახარჯეს ბეტონის სამუშაოებზე. ელექტრო კომპანიაში - ანალოგიური კომიტეტი.', en: 'Managerial committee. Example: construction company quarterly Environmental Committee - director, sites manager, ESG head. Discuss - how much waste from facade project, water used for concrete work. Electrical company - similar committee.' } },
          { id: 'q_5_1_2', parent: 'q_5_1',
            text: { ka: 'დამყარებულია ორმხრივი კომუნიკაცია დაინტერესებულ მხარეებთან?', en: 'Is two-way communication established with stakeholders?' },
            tooltip: { ka: 'ორმხრივი კომუნიკაცია. მაგალითი: სამშენებლო კომპანია ობიექტის გარშემო მცხოვრებლებს უგზავნის წერილს - ვინ ვართ, რა გრაფიკით ვმუშაობთ, ვის რა შეშფოთება აქვს, შეგიძლიათ მოგვწეროთ contact@build.ge. ელექტრო კომპანია - ფარების მონტაჟის წინ კლიენტთან განიხილავს - სად დადგება, რას გამოთიშავს, რა ხანგრძლივობით.', en: 'Two-way communication. Example: construction company sends letter to neighbors - who we are, what schedule, who has concerns, you can write contact@build.ge. Electrical company - before panel installation discusses with client - where placed, what gets disconnected, how long.' } },
          { id: 'q_5_1_3', parent: 'q_5_1',
            text: { ka: 'იყენებს მრავალმხრივ შეხვედრებს და ფოკუს-ჯგუფებს?', en: 'Does the company use multi-stakeholder meetings and focus groups?' },
            tooltip: { ka: 'მრავალმხრივი შეხვედრები. მაგალითი: სამშენებლო კომპანია მოაწყობს დისკუსიას - კომპანიის წარმომადგენლები, ადგილობრივი ხელისუფლება, NGO გარემოდან, ჟურნალისტები, მცხოვრებლები. განიხილავენ - რა გავლენა აქვს ობიექტს თემის წყლის ხარისხზე. ელექტრო კომპანია - მსგავსი დისკუსიები ენერგო-ეფექტურობის თემაზე.', en: 'Multi-stakeholder meetings. Example: construction company organizes discussion - company reps, local government, environmental NGO, journalists, residents. Discuss - what impact does the project have on community water quality. Electrical company - similar discussions on energy efficiency.' } },
          { id: 'q_5_2', isParent: true,
            text: { ka: 'აქვს განსაზღვრული მდგრადი განვითარების ხედვა?', en: 'Are sustainable development vision and policies defined?' },
            tooltip: { ka: 'მდგრადი განვითარების ხედვა. მაგალითი: სამშენებლო კომპანიის მდგრადობის სტრატეგია 2025-2030 - ხედვა გავხდეთ მწვანე მშენებლობის ლიდერი, პოლიტიკა LEED სერტიფიცირებული ობიექტები, სტრატეგია 5 წელიწადში 100% გადამუშავებული მასალის გამოყენება. ელექტრო - 100% LED ელემენტების სტრატეგია.', en: 'Sustainable development vision. Example: construction company Sustainability Strategy 2025-2030 - vision become green building leader, policy LEED certified projects, strategy 100% recycled materials in 5 years. Electrical - 100% LED elements strategy.' } },
          { id: 'q_5_2_1', parent: 'q_5_2',
            text: { ka: 'შემუშავებულია მდგრადობის სამიზნე მაჩვენებლები?', en: 'Are sustainability targets and indicators developed?' },
            tooltip: { ka: 'სამიზნე მაჩვენებლები. მაგალითი: სამშენებლო კომპანიის KPI-ები 2025 - მშენებლობის ნარჩენების გადამუშავება 70%-დან 85%-მდე, წყლის ხარჯვა შემცირდეს 20%-ით, ქალების წილი ბრიგადირებში 10%-დან 25%-მდე. ელექტრო კომპანიის KPI - კაბელების ნარჩენების გადამუშავება 90%-მდე.', en: 'Target indicators. Example: construction company KPIs 2025 - recycle waste from 70% to 85%, reduce water use 20%, female foreman share from 10% to 25%. Electrical company KPI - cable waste recycling to 90%.' } },
          { id: 'q_5_2_2', parent: 'q_5_2',
            text: { ka: 'აქვს მდგრადი წარმოების და მოხმარების პროგრამა?', en: 'Is there sustainable production/consumption programme?' },
            tooltip: { ka: 'მდგრადი წარმოება. მაგალითი: სამშენებლო კომპანია იყენებს water recycling system-ს ბეტონის სამუშაოებზე - წყლის ხარჯი 40%-ით ნაკლები. ან სხვა მაგალითი - მზის პანელები ობიექტის სამშენებლო ფარდულზე, ენერგია სამუშაოებისთვის. ელექტრო კომპანია - კაბელის ჭრის ნარჩენების ხელახალი გამოყენება მცირე პროექტებზე.', en: 'Sustainable production. Example: construction company uses water recycling system on concrete works - water use 40% less. Or solar panels on site shed for work energy. Electrical company - reusing cable cutting waste for small projects.' } },
          { id: 'q_5_2_3', parent: 'q_5_2',
            text: { ka: 'მუშაობს დიზაინერებთან და მომწოდებლებთან გარემოსდაცვითი მაჩვენებლების გასაუმჯობესებლად?', en: 'Does the company work with designers/suppliers to improve environmental performance?' },
            tooltip: { ka: 'თანამშრომლობა დიზაინერებთან. მაგალითი: სამშენებლო კომპანია მუშაობს არქიტექტორთან - გადასარკვევად მინდა ალუმინის ფასადი თუ ბუნებრივი ხის (გარემოსდაცვითი ეფექტი)? იძლევა რჩევას ეკოლოგიური მასალის. ელექტრო კომპანია - მომწოდებელთან მოლაპარაკება შესაძლებელია მოგვცეთ უფრო ენერგოეფექტური ფარდები?', en: 'Collaboration with designers. Example: construction company works with architect - I want to know aluminum facade vs natural wood (environmental impact)? Advises ecological material. Electrical company - negotiates with supplier Can you provide more energy-efficient panels?' } },
          { id: 'q_5_2_4', parent: 'q_5_2',
            text: { ka: 'ზომავს და აცნობს პროგრესს მდგრადობის პრინციპებზე?', en: 'Does the company measure/communicate sustainability progress?' },
            tooltip: { ka: 'ზომვა და რეპორტინგი. მაგალითი: სამშენებლო კომპანია ყოველთვიურად ზომავს - რამდენი ნარჩენი წარმოიქმნა (სართულის მიხედვით), რამდენი წყალი დახარჯეს, რამდენი ენერგია. შედეგი spreadsheet-ში. წლიურად ESG რეპორტში - გასულ წელს შევამცირეთ ნარჩენი 12%-ით. ელექტრო - იგივე მონაცემთა სისტემა.', en: 'Measure and report. Example: construction company monthly measures - waste generated (by floor), water used, energy. Recorded in spreadsheet. Yearly in ESG report - last year reduced waste 12%. Electrical - same data system.' } },
          { id: 'q_5_3', isParent: true,
            text: { ka: 'აქვს კომპანიას პოლიტიკა გარემოსდაცვითი ტექნოლოგიების გამოყენებაზე?', en: 'Is there policy on use of environmentally sound technologies?' },
            tooltip: { ka: 'გარემოსდაცვითი ტექნოლოგიების პოლიტიკა. მაგალითი: სამშენებლო კომპანიის ტექნოლოგიური სტრატეგია წერია - ახალი ხელსაწყოების შერჩევისას მინიმუმ 30%-ით ენერგოეფექტური ვიდრე ჩვენს ფლოტში. მზის პანელები ბუღალტერიის ოფისის სახურავზე. ელექტრო - მხოლოდ A კლასის (ენერგოეფექტური) ფარდების გამოყენება.', en: 'Environmental tech policy. Example: construction company Technology Strategy - When selecting new tools, at least 30% more energy-efficient than current fleet. Solar panels on accounting office roof. Electrical - using only Class A (energy-efficient) panels.' } },
          { id: 'q_5_3_1', parent: 'q_5_3',
            text: { ka: 'აწვდის ინფორმაციას ტექნოლოგიების გარემოსდაცვითი მაჩვენებლების შესახებ?', en: 'Is information made available about environmental performance?' },
            tooltip: { ka: 'ინფორმაციის გამჭვირვალობა. მაგალითი: სამშენებლო კომპანიის ვებგვერდზე Sustainability გვერდზე - ჩვენი მშენებლობის ობიექტი ხარჯავს 800 kWh/დღეში (30% მზის ენერგია), წყალი 6 m3/დღეში, CO2 ემისია 1.8 ტონა თვეში. ელექტრო კომპანია - მონაცემები ფარდების ენერგო-ეფექტურობაზე საჯაროდ.', en: 'Information transparency. Example: on construction company website Sustainability page - Our construction site uses 800 kWh/day (30% solar), water 6 m3/day, CO2 emission 1.8 tons monthly. Electrical company - panel energy efficiency data publicly.' } },
          { id: 'q_5_3_2', parent: 'q_5_3',
            text: { ka: 'იყენებს ცხოვრების ციკლის შეფასებას (LCA) ახალი ტექნოლოგიებისთვის?', en: 'Is life cycle assessment used in new technology development?' },
            tooltip: { ka: 'ცხოვრების ციკლის შეფასება (LCA). მაგალითი: სამშენებლო კომპანია ახალი შენობის დიზაინისას აანალიზებს - მასალის მოპოვება (ცემენტი ეფექტი გარემოზე), ტრანსპორტირება (ნაკადი 200 კმ-ზე), მშენებლობა (ენერგია), გამოყენება (50 წელი ცხოვრება შენობაში), დემონტაჟი. ელექტრო - ფარდის ცხოვრების ციკლი წარმოებიდან გადამუშავებამდე.', en: 'LCA. Example: construction company analyzing new building design - material extraction (cement environmental impact), transport (200km flow), construction (energy), use (50 years living in building), demolition. Electrical - panel life cycle from production to disposal.' } },
          { id: 'q_5_3_3', parent: 'q_5_3',
            text: { ka: 'ამოწმებს კრიტერიუმებს მომწოდებელთა შესარჩევად?', en: 'Are criteria examined for supplier selection?' },

    const getQuestion = (id) => ALL_QUESTIONS.find(q => q.id === id);

    const getChildren = (parentId) => ALL_QUESTIONS.filter(q => q.parent === parentId);

    // ============================================
    // SUPABASE HELPERS
    // ============================================
    async function loadCompany(id) {
      if (!supabase) return { data: null, error: 'no-supabase' };
      const { data, error } = await supabase.from('esg_companies').select('*').eq('id', id).maybeSingle();
      return { data, error };
    }
    async function createCompany(id, lang) {
      if (!supabase) return { error: 'no-supabase' };
      return supabase.from('esg_companies').insert({ id, language: lang });
    }
    async function updateCompany(id, fields) {
      if (!supabase) return { error: 'no-supabase' };
      return supabase.from('esg_companies').update(fields).eq('id', id);
    }
    async function loadAnswers(companyId) {
      if (!supabase) return { data: [] };
      const { data, error } = await supabase.from('esg_answers').select('*').eq('company_id', companyId);
      return { data: data || [], error };
    }
    async function upsertAnswer(companyId, questionId, answer, partialText, wasAutoSuggested) {
      if (!supabase) return { error: 'no-supabase' };
      return supabase.from('esg_answers').upsert({
        company_id: companyId,
        question_id: questionId,
        answer,
        partial_text: partialText || null,
        was_auto_suggested: !!wasAutoSuggested
      }, { onConflict: 'company_id,question_id' });
    }
    async function lockCompany(id) {
      if (!supabase) return { error: 'no-supabase' };

    // ----------- WIZARD SCREEN -----------
    function WizardScreen({ lang, setLang, companyId, companyName, initialAnswers, onSave, onSubmit }) {
      const [currentSection, setCurrentSection] = useState(0);
      const [answers, setAnswers] = useState(initialAnswers || {});
      const [partialTexts, setPartialTexts] = useState(() => {
        const t = {};
        Object.entries(initialAnswers || {}).forEach(([qid, a]) => { if (a.partial_text) t[qid] = a.partial_text; });
        return t;
      });
      const [autoSuggested, setAutoSuggested] = useState(() => {
        const a = {};
        Object.entries(initialAnswers || {}).forEach(([qid, x]) => { if (x.was_auto_suggested) a[qid] = true; });
        return a;

      const [showError, setShowError] = useState(false);
      const [showConfirm, setShowConfirm] = useState(false);
      const [saveStatus, setSaveStatus] = useState(''); // 'saving' | 'saved' | ''
      const [submitting, setSubmitting] = useState(false);
      const saveTimer = useRef(null);

      const section = SECTIONS[currentSection];

      const totalQ = ALL_QUESTIONS.length;
      const answeredCount = Object.values(answers).filter(a => a && a.answer).length;
      const pct = Math.round((answeredCount / totalQ) * 100);

      // Debounced save
      const scheduleSave = useCallback((qid, payload) => {
        setSaveStatus('saving');
        if (saveTimer.current) clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(async () => {
          try {
            await upsertAnswer(companyId, qid, payload.answer, payload.partial_text, payload.was_auto_suggested);
            setSaveStatus('saved');
            setTimeout(() => setSaveStatus(''), 2000);
          } catch (e) {
            setSaveStatus('');
          }
        }, 500);
      }, [companyId]);

      const handleAnswer = (qid, val) => {
        setShowError(false);
        const newAnswers = { ...answers };
        const newAuto = { ...autoSuggested };
        const newPartial = { ...partialTexts };

        // Set this answer
        newAnswers[qid] = { answer: val, partial_text: newPartial[qid] || null, was_auto_suggested: false };
        newAuto[qid] = false;

        const q = getQuestion(qid);
        // Find which section this question belongs to and check if it's the FIRST question of that section
        let isFirstOfSection = false;
        let sectionQuestions = [];
        for (const s of SECTIONS) {
          if (s.questions.length > 0 && s.questions[0].id === qid) {
            isFirstOfSection = true;
            sectionQuestions = s.questions;
            break;
          }
        }

        // If this is the first question of a section
        if (isFirstOfSection) {
          if (val === 'no') {
            // Auto-fill ALL other questions in this section with 'no' (if not manually set, or previously auto-suggested)
            sectionQuestions.forEach(sq => {
              if (sq.id === qid) return; // skip the first one itself
              const existing = newAnswers[sq.id];
              if (!existing || newAuto[sq.id]) {
                newAnswers[sq.id] = { answer: 'no', partial_text: null, was_auto_suggested: true };
                newAuto[sq.id] = true;
                scheduleSave(sq.id, { answer: 'no', partial_text: null, was_auto_suggested: true });
              }
            });
          } else {
            // First question changed to yes/partial → clear ALL auto-suggested in this section
            sectionQuestions.forEach(sq => {
              if (sq.id === qid) return;
              if (newAuto[sq.id]) {
                delete newAnswers[sq.id];
                newAuto[sq.id] = false;
                if (supabase) {
                  supabase.from('esg_answers').delete().eq('company_id', companyId).eq('question_id', sq.id);
                }
              }
            });
          }
        }
        // Also keep the original parent/child logic for nested questions (q_2_2 → q_2_2_1, etc.)
        else if (q && q.isParent) {
          const children = getChildren(qid);
          if (val === 'no') {
            children.forEach(c => {
              const existing = newAnswers[c.id];
              if (!existing || newAuto[c.id]) {
                newAnswers[c.id] = { answer: 'no', partial_text: null, was_auto_suggested: true };
                newAuto[c.id] = true;
                scheduleSave(c.id, { answer: 'no', partial_text: null, was_auto_suggested: true });
              }
            });
          } else {
            children.forEach(c => {
              if (newAuto[c.id]) {
                delete newAnswers[c.id];
                newAuto[c.id] = false;
                if (supabase) {
                  supabase.from('esg_answers').delete().eq('company_id', companyId).eq('question_id', c.id);
                }
              }
            });
          }
        }

        setAnswers(newAnswers);
        setAutoSuggested(newAuto);
        scheduleSave(qid, { answer: val, partial_text: newPartial[qid] || null, was_auto_suggested: false });
      };

      const handlePartialText = (qid, txt) => {
        const newPartial = { ...partialTexts, [qid]: txt };
        setPartialTexts(newPartial);

        for (const q of section.questions) {
          const a = answers[q.id];
          if (!a || !a.answer) return false;
        }
        return true;
      };

      const validateAll = () => {
        for (const q of ALL_QUESTIONS) {
          const a = answers[q.id];
          if (!a || !a.answer) return false;
        }
        return true;
      };

      const goNext = () => {
        if (!validateSection()) { setShowError(true); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
        setShowError(false);

              const a = answers[q.id];
              return !a || !a.answer;
            });
            if (incomplete) { setCurrentSection(i); break; }
          }

      };

            // SIDEBAR

        // Confirm modal
        showConfirm ? React.createElement('div', {
          className: 'fixed inset-0 bg-black/50 flex items-center justify-center px-4 z-50 fade-in',
          onClick: () => !submitting && setShowConfirm(false)
        },
          React.createElement('div', {
            className: 'bg-white rounded-2xl p-7 max-w-md w-full',
            onClick: e => e.stopPropagation()
          },
            React.createElement('div', { className: 'w-14 h-14 rounded-full bg-amber-50 mx-auto mb-4 flex items-center justify-center text-amber-700 text-2xl font-semibold' }, '!'),
            React.createElement('h3', { className: 'text-lg font-semibold text-stone-900 text-center mb-2' }, T[lang].confirmTitle),
            React.createElement('p', { className: 'text-sm text-stone-500 text-center leading-relaxed mb-6' }, T[lang].confirmMsg),
            React.createElement('div', { className: 'flex gap-2' },
              React.createElement('button', {
                onClick: () => setShowConfirm(false),
                disabled: submitting,
                className: 'flex-1 h-11 text-sm text-stone-700 border border-stone-200 hover:bg-stone-50 rounded-lg transition disabled:opacity-50'
              }, T[lang].cancel),
              React.createElement('button', {
                onClick: doSubmit,
                disabled: submitting,
                className: 'flex-1 h-11 text-sm font-medium text-white rounded-lg transition disabled:opacity-50',
                style: { background: 'linear-gradient(135deg, #1F4D3C, #0F6E56)' }
              }, submitting ? T[lang].loading : T[lang].confirmSubmit)
            )
          )
        ) : null
      );
    }

    // ----------- LOCKED SCREEN -----------
    function LockedScreen({ lang, setLang, submittedAt, companyName }) {
      const dateStr = submittedAt ? new Date(submittedAt).toLocaleDateString(lang === 'ka' ? 'ka-GE' : 'en-US', { year: 'numeric', month: 'long', day: 'numeric' }) : '';
      return React.createElement('div', { className: 'min-h-screen flex flex-col' },
        React.createElement(Header, { lang, setLang, companyName }),
        React.createElement('div', { className: 'flex-1 flex items-center justify-center px-4 py-12' },
          React.createElement('div', { className: 'w-full max-w-md text-center fade-in' },
            React.createElement('div', {
              className: 'w-20 h-20 rounded-full mx-auto mb-6 flex items-center justify-center text-white text-3xl shadow-lg',
              style: { background: 'linear-gradient(135deg, #1F4D3C, #0F6E56)' }
            }, '✓'),
            React.createElement('h1', { className: 'text-2xl font-semibold text-stone-900 mb-3' }, T[lang].lockedTitle),
            React.createElement('p', { className: 'text-sm text-stone-500 leading-relaxed mb-6' }, T[lang].lockedMsg),
            dateStr ? React.createElement('div', { className: 'bg-white border border-stone-200 rounded-xl p-4' },
              React.createElement('div', { className: 'text-[11px] text-stone-400 mb-1 font-medium uppercase tracking-wider' }, T[lang].submittedOn),
              React.createElement('div', { className: 'text-sm font-medium text-stone-900' }, dateStr)
            ) : null
          )
        )
      );
    }

    // ----------- SAVED SCREEN -----------
    function SavedScreen({ lang, setLang, onBack }) {
      return React.createElement('div', { className: 'min-h-screen flex flex-col' },
        React.createElement(Header, { lang, setLang }),
        React.createElement('div', { className: 'flex-1 flex items-center justify-center px-4 py-12' },
          React.createElement('div', { className: 'w-full max-w-md text-center fade-in' },
            React.createElement('div', { className: 'w-20 h-20 rounded-full mx-auto mb-6 flex items-center justify-center text-emerald-700 text-3xl bg-emerald-50' }, '⤓'),
            React.createElement('h1', { className: 'text-2xl font-semibold text-stone-900 mb-3' }, T[lang].savedTitle),
            React.createElement('p', { className: 'text-sm text-stone-500 leading-relaxed mb-6' }, T[lang].savedMsg),
            React.createElement('button', {
              onClick: onBack,
              className: 'h-11 px-6 text-sm text-stone-700 border border-stone-200 hover:bg-stone-50 rounded-lg transition'
            }, T[lang].backToLogin)
          )
        )
      );
    }

    // ============================================
    // ROOT APP
    // ============================================
    function App() {
      const [lang, setLangState] = useState('ka');
      const [screen, setScreen] = useState('login'); // login, info, wizard, locked, saved
      const [companyId, setCompanyId] = useState('');
      const [companyName, setCompanyName] = useState('');
      const [contact, setContact] = useState('');
      const [submittedAt, setSubmittedAt] = useState(null);
      const [initialAnswers, setInitialAnswers] = useState({});

      useEffect(() => {
        document.documentElement.lang = lang;
      }, [lang]);

      const setLang = (l) => {
        setLangState(l);
        if (companyId) updateCompany(companyId, { language: l });
      };

      const handleLogin = async (id) => {
        if (!supabase) {
          alert('Supabase not configured. Open the file in editor and add SUPABASE_URL and SUPABASE_ANON_KEY.');
          return;
        }
        setCompanyId(id);
        const { data: company } = await loadCompany(id);
        if (!company) {
          // New company → create + go to info screen
          await createCompany(id, lang);
          setScreen('info');
          return;
        }
        // Existing
        if (company.language) setLangState(company.language);
        setCompanyName(company.name || '');
        setContact(company.contact || '');
        if (company.is_locked) {
          setSubmittedAt(company.submitted_at);
          setScreen('locked');
          return;
        }
        if (!company.name || !company.contact) {
          setScreen('info');
          return;
        }
        // Load answers
        const { data: rows } = await loadAnswers(id);
        const map = {};
        rows.forEach(r => {
          map[r.question_id] = {
            answer: r.answer,
            partial_text: r.partial_text,
            was_auto_suggested: r.was_auto_suggested
          };
        });
        setInitialAnswers(map);
        setScreen('wizard');
      };

      const handleInfoSubmit = async (name, contactNum) => {
        await updateCompany(companyId, { name, contact: contactNum });
        setCompanyName(name);
        setContact(contactNum);
        setInitialAnswers({});
        setScreen('wizard');
      };

      const handleSave = () => setScreen('saved');

      const handleSubmitFinal = async () => {
        const { error } = await lockCompany(companyId);
        if (error) { alert(T[lang].connectError); return; }
        setSubmittedAt(new Date().toISOString());
        setScreen('locked');
      };

      const handleBackToLogin = () => {
        setCompanyId(''); setCompanyName(''); setContact(''); setInitialAnswers({});
        setScreen('login');
      };

      switch (screen) {
        case 'login':
          return React.createElement(LoginScreen, { lang, setLang: setLangState, onLogin: handleLogin });
        case 'info':
          return React.createElement(CompanyInfoScreen, { lang, setLang: setLangState, companyId, onSubmit: handleInfoSubmit });
        case 'wizard':
          return React.createElement(WizardScreen, {
            lang, setLang, companyId, companyName,
            initialAnswers,
            onSave: handleSave,
            onSubmit: handleSubmitFinal
          });
        case 'locked':
          return React.createElement(LockedScreen, { lang, setLang, submittedAt, companyName });
        case 'saved':
          return React.createElement(SavedScreen, { lang, setLang, onBack: handleBackToLogin });
        default:
          return null;
      }
    }

    const root = createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
