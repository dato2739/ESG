          { id: 'q_2_7',

            tooltip: { ka: 'უწყვეტი გაუმჯობესება ნიშნავს მუდმივ გაუმჯობესებას. ცნობილი მიდგომებია Kaizen, Lean, Six Sigma. მაგალითი: კვირაში ერთხელ 15-წუთიანი შეხვედრა, სადაც მუშაკები გამოთქვამენ წინადადებებს - თუ ცარიელ ყუთებს დასაწყობში სხვა ადგილზე დავაწყობთ, 5 წუთს დავზოგავთ. ასეთი მიდგომა გაქვთ?', en: 'Continuous improvement means constant improvement. Known approaches include Kaizen, Lean, Six Sigma. Example: a 15-minute weekly meeting where workers suggest improvements - if we move empty boxes to a different storage spot, we save 5 minutes. Do you have such an approach?' } },

          { id: 'q_2_9', isParent: true,
            text: { ka: 'არის კლიენტთა კმაყოფილების შეფასების პროცედურა?', en: 'Are there customer satisfaction procedures?' },
            tooltip: { ka: 'კლიენტთა კმაყოფილების შეფასება. მაგალითი: ყოველი მიწოდების შემდეგ კლიენტს ეგზავნება email 3 კითხვით - 1-დან 5-მდე როგორ შეაფასებთ ხარისხს? ვადებს? ჩვენს კომუნიკაციას? შემდეგ პასუხები აანალიზდება და გამოიყენება გაუმჯობესებისთვის. გაქვთ ასეთი პროცედურა?', en: 'Customer satisfaction evaluation. Example: after every delivery customer receives email with 3 questions - on a scale of 1-5 how would you rate quality? Deadlines? Communication? Then responses are analyzed and used for improvement. Do you have such a procedure?' } },
          { id: 'q_2_10',
            text: { ka: 'არსებობს საჩივრებისა და კრიზის მართვის პროცედურა?', en: 'Does a claim and crisis management procedure exist?' },
            tooltip: { ka: 'საჩივრების მართვის პროცედურა. მაგალითი: დოკუმენტში წერია - კლიენტის საჩივრის მიღებიდან 24 საათში პასუხი გაიცემა, 3 დღეში დადგინდება მიზეზი, 7 დღეში მოგვარდება საკითხი, პასუხისმგებელი კლიენტ-მენეჯერი ნინო. კრიზის მართვა - სერიოზულ პრობლემებზე როგორიცაა ხარვეზიანი პროდუქცია რომელიც უკვე გაიგზავნა.', en: 'Claim management procedure. Example: document states - within 24 hours of complaint response sent, within 3 days cause identified, within 7 days resolved, responsible customer manager Nino. Crisis management deals with serious problems like defective products already shipped.' } },
          { id: 'q_2_11',
            text: { ka: 'არის შეკვეთის თვალყურის-დევნების პროცედურა?', en: 'Are there order follow-up procedures?' },
            tooltip: { ka: 'შეკვეთის თვალყურის-დევნება. მაგალითი: კლიენტი დაგვირეკავს და კითხულობს რა მდგომარეობაშია ჩემი შეკვეთა #4521? კომპანიის თანამშრომელი 30 წამში პასუხობს - შემოვიდა 5 ნოემბერს, წარმოებაში გადავიდა 6-ში, გამზადდება 8-ში, გაიგზავნება 9-ში. შეიძლება იყოს ციფრული სისტემა (ERP) ან Excel ცხრილი.', en: 'Order tracking. Example: customer calls asking what is the status of my order #4521? Within 30 seconds employee responds - received Nov 5, moved to production Nov 6, will be ready Nov 8, ships Nov 9. Can be digital (ERP) or Excel sheet.' } },
          { id: 'q_2_12',
            text: { ka: 'აქვს მომწოდებელს დოკუმენტების მართვის სისტემა?', en: 'Does the supplier have a document management system?' },
            tooltip: { ka: 'დოკუმენტების მართვის სისტემა. მაგალითი: ციფრული ფოლდერი (Google Drive ან SharePoint) სტრუქტურით - 01-კლიენტები / 02-მომწოდებლები / 03-ხელშეკრულებები / 04-სერტიფიკატები. ან ფიზიკური საქაღალდეები კარადაში, ცხადად მონიშნული. მნიშვნელოვანია სიცხადე და სიჩქარე ძებნისას.', en: 'Document management system. Example: digital folder (Google Drive or SharePoint) with structure - 01-Clients / 02-Suppliers / 03-Contracts / 04-Certificates. Or physical folders in cabinet, clearly labeled. What matters is clarity and search speed.' } },
          { id: 'q_2_13', isParent: true,
            text: { ka: 'არის ტრენინგ-პროგრამები მენეჯმენტისთვის და თანამშრომლებისთვის?', en: 'Are there training programs for management and employees?' },
            tooltip: { ka: 'ტრენინგ-პროგრამა. მაგალითი: წელიწადში 2-ჯერ - გაზაფხულზე და შემოდგომაზე - ახალი მუშაკები გადიან 3-დღიან გაცნობით ტრენინგს (უსაფრთხოება, წარმოების პროცესი), ხოლო ძველი თანამშრომლები 1-დღიან განმაახლებელ ტრენინგს. შესაძლებელია იყოს ვებინარები, გარე კურსები, შიდა ლექციები.', en: 'Training program. Example: twice a year - spring and autumn - new workers go through 3-day onboarding training (safety, production process), existing employees 1-day refresher. Can include webinars, external courses, internal lectures.' } },
          { id: 'q_2_13_1', parent: 'q_2_13',
            text: { ka: 'თანამშრომლები საკმარისად კვალიფიციურები არიან?', en: 'Are the employees properly skilled for their role?' },
            tooltip: { ka: 'შეესაბამება თუ არა თანამშრომლების უნარები პოზიციებს. მაგალითი: შემდუღებლის სამუშაოზე გყავთ ადამიანი, რომელსაც აქვს შემდუღებლის სერტიფიკატი და 5 წლიანი გამოცდილება. ხარისხის ინჟინრის პოზიციაზე ინჟინერიის უნივერსიტეტის დიპლომი. არის თუ არა ყველა თანამშრომელი თავის ადგილზე?', en: 'Do employees skills match positions. Example: for welding job someone with welder certificate and 5 years experience. For quality engineer position an engineering university degree. Is everyone in the right position?' } },
          { id: 'q_2_13_2', parent: 'q_2_13',
            text: { ka: 'არის მუშათა ტრენინგისა და ცოდნის ამაღლების პროგრამა?', en: 'Are there worker training or knowledge programs?' },
            tooltip: { ka: 'მუშაკთა ტრენინგი. მაგალითი: ახალი მანქანის შემოყვანისას ოპერატორებს ერთი კვირა უტარდებათ ტრენინგი - როგორ ჩაირთვება, რა საფრთხეებია, რა გასაგებად უნდა გამოიყენონ. მთელი ცვლის შეჩერება მნიშვნელოვანი ინვესტიციაა.', en: 'Worker training. Example: when installing new machine, operators receive a week of training - how to start, what dangers exist, how to use correctly. Stopping the whole shift is a significant investment.' } },
          { id: 'q_2_14', isParent: true,
            text: { ka: 'მოწოდებული მასალები მოწმდება შემოსვლისას?', en: 'Are incoming materials inspected upon arrival?' },
            tooltip: { ka: 'შემოსული მასალის შემოწმება. მაგალითი: მოვიდა 1000 კგ ფქვილი - ამოწმებთ ტარის წონას (1000 კგ-ია?), თარიღს (ვადაზე ადრეული არ არის?), ფერს და სიხშირეს (გაფუჭებული არ არის?), ანალიზის ფურცელს (გლუტენი 12% ნამდვილად?). თუ რამე სხვაა - არ ღებულობთ.', en: 'Receiving inspection. Example: 1000 kg flour arrives - check bag weight (really 1000 kg?), date (not too old?), color and texture (not spoiled?), analysis sheet (gluten really 12%?). If something is off, you do not accept.' } },
          { id: 'q_2_14_1', parent: 'q_2_14',
            text: { ka: 'არის შემოსული მასალების ინსპექციის წერილობითი პროცედურა?', en: 'Are there written inspection procedures for incoming materials?' },
            tooltip: { ka: 'წერილობითი ინსპექციის პროცედურა. მაგალითი: A4 ფურცელი დასაწყობში გამოკრული, სათაურით შემოსული ნედლეულის მიღების ინსტრუქცია - 1) შეადარე ტრანსპორტო ნაკადი ფაქტს; 2) ამოღე 3 ნიმუში ლაბორატორიული ანალიზისთვის; 3) დაარეგისტრირე მიღების ჟურნალში.', en: 'Written inspection procedure. Example: A4 paper posted in storage titled Receiving Inspection Instructions - 1) Compare delivery note to actual; 2) Take 3 samples for lab analysis; 3) Register in receiving log.' } },
          { id: 'q_2_14_2', parent: 'q_2_14',
            text: { ka: 'მიღებული და უარყოფილი მასალები ცალ-ცალკე ინახება?', en: 'Are accepted vs rejected materials kept segregated?' },
            tooltip: { ka: 'მისაღები და უარყოფილი მასალის სეგრეგაცია. მაგალითი: დასაწყობში არის ორი ცალკე მონიშნული ზონა - მწვანე ფერით მზად წარმოებისთვის და წითელი ფერით უარყოფილი - არ გამოვიყენოთ. უარყოფილ მასალას აქვს მონიშვნა - უარყოფილია 5/11/2024, მიზეზი ვადაგასული. შეცდომით ვერ გამოიყენება.', en: 'Accepted vs rejected material segregation. Example: in storage two distinctly marked zones - green Ready for production and red Rejected - do not use. Rejected material has tag - Rejected 5/11/2024, reason expired. Cannot be accidentally used.' } },
          { id: 'q_2_15', isParent: true,
            text: { ka: 'არის წერილობითი პროცედურები ყველა საწარმოო პროცესისთვის?', en: 'Are there written procedures for all manufacturing processes?' },
            tooltip: { ka: 'წერილობითი პროცედურა (SOP) - ნაბიჯ-ნაბიჯი ინსტრუქცია. მაგალითი: ბოთლების სტერილიზაციის SOP - 1) ჩართეთ მანქანა და დაიცადე 10 წუთი 121°C-ის მიღწევას; 2) ჩადებე ბოთლები კალათში; 3) ჩართე 30-წუთიანი ციკლი; 4) გათბობის შემდეგ ნახევარი საათით გაანიავე. ყველა ერთნაირად აკეთებს.', en: 'Written procedure (SOP) - step-by-step instruction. Example: bottle sterilization SOP - 1) Turn on machine and wait 10 minutes for 121°C; 2) Place bottles in basket; 3) Run 30-minute cycle; 4) After heating, ventilate for half an hour. Everyone does it the same way.' } },
          { id: 'q_2_15_1', parent: 'q_2_15',
            text: { ka: 'მნიშვნელოვანი მახასიათებლები მონიტორინგდება წარმოების დროს?', en: 'Are important characteristics monitored during production?' },
            tooltip: { ka: 'წარმოების დროს მონიტორინგი. მაგალითი: პლასტიკის ჩამოსხმის მანქანაში ყოველ 30 წუთში ოპერატორი ამოწმებს - ტემპერატურა 220°C-ია? წნევა 80 ბარია? ერთი მზა ბოთლის წონა 25 გრამია? თუ რამე გადაუხვევს ნორმიდან, მაშინვე ვიგებთ.', en: 'In-process monitoring. Example: in plastic injection machine, every 30 minutes operator checks - is temperature 220°C? Is pressure 80 bar? Is one finished bottle 25 grams? If something deviates, we know immediately.' } },
          { id: 'q_2_15_2', parent: 'q_2_15',
            text: { ka: 'ტარდება საბოლოო ინსპექცია თითოეულ პარტიაზე?', en: 'Is final inspection performed on each lot?' },
            tooltip: { ka: 'საბოლოო ინსპექცია. მაგალითი: 1000 ცალი მზა პროდუქციდან შემთხვევით ვირჩევთ 30 ცალს, ვამოწმებთ თითოეულს - ზომა, ფერი, ფუნქციონალი. თუ 3-ზე მეტში ხარვეზია, მთლიანი პარტია ბრუნდება ხელახალი შემოწმებისთვის. უკანასკნელი ხაზი ხარვეზის გამოვლენისთვის.', en: 'Final inspection. Example: from 1000 finished products randomly select 30, check each - size, color, functionality. If more than 3 have defects, whole batch returned for re-inspection. Last line of defect detection.' } }
        ]
      },
      // SECTION 2: HUMAN RIGHTS
      {
        key: 'humanRights',
        questions: [
          { id: 'q_3_1', isParent: true,
            text: { ka: 'აქვს კომპანიას ადამიანის უფლებების დაცვის პოლიტიკა?', en: 'Has the company established human rights policies?' },
            tooltip: { ka: 'ადამიანის უფლებების პოლიტიკა - წერილობითი დოკუმენტი. მაგალითი: 2-გვერდიანი დოკუმენტი სათაურით ჩვენი ვალდებულება - ადამიანის უფლებები - ჩვენ პატივს ვცემთ ყოველი თანამშრომლის ღირსებას, არ გამოვიყენებთ იძულებას, არ ვცდილობთ დისკრიმინაციას, ვიცავთ ბავშვთა შრომის წინააღმდეგ ნორმებს. ხელმოწერილი დირექტორის მიერ.', en: 'Human rights policy - written document. Example: a 2-page document titled Our Commitment Human Rights - We respect every employee dignity, will not use coercion, do not allow discrimination, comply with anti-child-labor norms. Signed by the Director.' } },
          { id: 'q_3_1_1', parent: 'q_3_1',
            text: { ka: 'უზრუნველყოფს უსაფრთხო და ჯანსაღ სამუშაო პირობებს?', en: 'Are safe and healthy working conditions provided?' },
            tooltip: { ka: 'უსაფრთხო და ჯანსაღი სამუშაო პირობები. მაგალითი: საწარმოო ცეხში გაქვთ ვენტილაცია რომელიც ჰაერის ხარისხს ინარჩუნებს, LED განათება ცხრილების ზემოთ, მანქანებზე უსაფრთხოების ზღურბლები, ხელმისაწვდომი ხელთათმანები და სპეცტანსაცმელი, პირველი დახმარების ყუთი. რეალურად სთავაზობთ ამ პირობებს?', en: 'Safe and healthy working conditions. Example: in production hall you have ventilation maintaining air quality, LED lighting above tables, safety guards on machines, available gloves and work clothes, first aid kit. Do you actually provide these conditions?' } },
          { id: 'q_3_1_2', parent: 'q_3_1',
            text: { ka: 'უზრუნველყოფს გაერთიანების თავისუფლებას?', en: 'Is freedom of association guaranteed?' },
            tooltip: { ka: 'გაერთიანების თავისუფლება. მაგალითი: 50 თანამშრომლიდან 20 გადაწყვეტს შექმნას პროფკავშირი ხელფასების უკეთესი მოლაპარაკებისთვის - კომპანიის რეაქცია არ უნდა იყოს მათი გაშინება ან გათავისუფლება. ისინი თავისუფლად ატარებენ შეხვედრებს, ირჩევენ ლიდერს. საერთაშორისო შრომითი ნორმაა.', en: 'Freedom of association. Example: of 50 employees, 20 decide to form a union for better salary negotiations - company reaction should not be intimidation or dismissal. They freely hold meetings, elect leaders. International labor norm.' } },
          { id: 'q_3_1_3', parent: 'q_3_1',
            text: { ka: 'უზრუნველყოფს არადისკრიმინაციულ კადრების პოლიტიკას?', en: 'Is non-discrimination ensured in personnel practices?' },
            tooltip: { ka: 'არადისკრიმინაციის უზრუნველყოფა. მაგალითი: ერთსა და იმავე პოზიციაზე მამაკაცი და ქალი ერთსა და იმავე ხელფასს იღებენ. დაწინაურების დროს არჩევა ხდება გამოცდილების და შედეგების მიხედვით, არა ეროვნების ან ასაკის გამო. 60 წლის ინჟინერი იღებს იგივე ტრენინგებს, რასაც 30 წლის. გაქვთ ამის უზრუნველმყოფი წესები?', en: 'Ensuring non-discrimination. Example: man and woman in same position get same salary. Promotions based on experience and results, not nationality or age. A 60-year-old engineer gets same trainings as 30-year-old. Do you have rules ensuring this?' } },
          { id: 'q_3_1_4', parent: 'q_3_1',
            text: { ka: 'არ იყენებს იძულებით ან ბავშვთა შრომას?', en: 'Is forced or child labour avoided directly and indirectly?' },
            tooltip: { ka: 'იძულებითი და ბავშვთა შრომის თავიდან აცილება. მაგალითი: არ ქირავდებიან 16 წლამდე ბავშვები, მიგრანტ მუშაკებს არ ართმევთ პასპორტებს, ნებისმიერ მომენტში მუშაკს შეუძლია წავიდეს. ეს ეხება არა მხოლოდ თქვენ, არამედ თქვენს მომწოდებლებს. იძულებითი შრომის ნიშნებია ვალის ბრუნდი, საბუთების ჩამორთმევა, ფიზიკური მუქარა.', en: 'Avoiding forced and child labor. Example: do not hire children under 16, do not take passports from migrant workers, any worker can leave at any moment. Applies not only to you but also suppliers. Signs of forced labor: debt bondage, document confiscation, physical threats.' } },
          { id: 'q_3_2', isParent: true,
            text: { ka: 'ჩაატარა კომპანიამ ადამიანის უფლებების შეფასება იმ ქვეყნებში, სადაც საქმიანობს?', en: 'Has the company performed a human rights assessment in operating countries?' },
            tooltip: { ka: 'ადამიანის უფლებების შეფასება ოპერაციული ქვეყნებისთვის. მაგალითი: თუ ბამბა მოდის ბანგლადეშიდან, შეგისწავლიათ ადგილობრივი შრომის პირობები (იქ ცნობილია ფაბრიკების კატასტროფები)? თუ ლითონი მოდის კონგოდან, ცნობილია თუ არა ე.წ. კონფლიქტური მინერალები? მაღალი რისკის ქვეყნებში გაცნობიერება აუცილებელია.', en: 'Human rights assessment for operating countries. Example: if your cotton comes from Bangladesh, have you studied local labor conditions (factory disasters there are well-known)? If metal from Congo, are you aware of so-called conflict minerals? Awareness in high-risk countries essential.' } },
          { id: 'q_3_2_1', parent: 'q_3_2',
            text: { ka: 'აქვს კომპანიას მკაფიო პოლიტიკა, რომელიც იცავს როგორც საკუთარი თანამშრომლების, ასევე მიწოდების ჯაჭვის მუშაკთა უფლებებს?', en: 'Does the company have explicit policies protecting workers human rights in employment and supply chain?' },
            tooltip: { ka: 'პოლიტიკა მთელი მიწოდების ჯაჭვისთვის. მაგალითი: თქვენ ხართ ტანსაცმლის ბრენდი, ბამბას ყიდულობთ ფერმერისგან, წარმოებას აკეთებთ ფაბრიკაში. პოლიტიკა უნდა მოიცავდეს არა მხოლოდ თქვენ ოფისს, არამედ ფერმერის ბავშვებს (არ უნდა მუშაობდნენ) და ფაბრიკის მუშაკებს (უნდა იღებდნენ მინიმალურ ხელფასს).', en: 'Policy for entire supply chain. Example: you are clothing brand, buy cotton from farmer, produce in factory. Policy should cover not only your office but also farmer children (must not be working) and factory workers (must receive minimum wage).' } },
          { id: 'q_3_2_2', parent: 'q_3_2',
            text: { ka: 'აქვს მონიტორინგის სისტემა?', en: 'Has the company established monitoring/tracking system?' },
            tooltip: { ka: 'მონიტორინგის სისტემა. მაგალითი: წელიწადში ერთხელ მესამე მხარის აუდიტორი მიდის თქვენი ბამბის მომწოდებლის ფერმაში, ესაუბრება მუშაკებს კონფიდენციალურად, ამოწმებს ხომ არ მუშაობენ ბავშვები, რამდენ საათს მუშაობენ მოზარდები. შემდეგ თქვენ მიიღებთ ანგარიშს. ქაღალდზე დაწერილი პოლიტიკა საკმარისი არ არის.', en: 'Monitoring system. Example: once a year third-party auditor visits your cotton supplier farm, talks confidentially with workers, checks whether children working, how many hours adults work. Then you receive report. Policy on paper is not enough.' } },
          { id: 'q_3_2_3', parent: 'q_3_2',
            text: { ka: 'აქვს პოლიტიკა, რომ უსაფრთხოების ღონისძიებები არ იწვევდეს უფლებების დარღვევას?', en: 'Does security policy avoid contributing to human rights violations?' },
            tooltip: { ka: 'უსაფრთხოების სამსახურის წესები. მაგალითი: ფაბრიკის გასასვლელში დაცვა ამოწმებს მუშაკთა ჩანთებს - ეს ნორმალურია. მაგრამ თუ დაცვა ფიზიკურად ნაცემს ერთ მუშაკს, რომელიც სავარაუდოდ ნაკლებად იპარავდა - ეს დარღვევაა. გაქვთ წერილობითი წესები დაცვისთვის ასეთი დარღვევების ასაცილებლად?', en: 'Security service rules. Example: at factory exit security checks worker bags - this is normal. But if security physically beats a worker who allegedly stole - this is violation. Do you have written rules for security to prevent such violations?' } }
        ]
      },
      // SECTION 3: LABOUR
      {
        key: 'labour',
        questions: [
          { id: 'q_4_1', isParent: true,
            text: { ka: 'კომპანია პატივს სცემს მუშაკთა უფლებას შექმნან პროფკავშირები?', en: 'Does the company respect workers right to form trade unions?' },
            tooltip: { ka: 'პროფკავშირის უფლება. მაგალითი: საქართველოში არის საქართველოს პროფკავშირების გაერთიანება. თქვენი ფაბრიკის 30 მუშაკი წევრიანდება მასში - კომპანია არ უნდა იძახებდეს მათ ცალ-ცალკე გადით აქედან, არ უნდა აშინებდეს გათავისუფლებით, არ უნდა ცდილობდეს გავლენის მოხდენას. პროფკავშირი ხელფასებზე მათი სახელით საუბრობს.', en: 'Right to trade union. Example: in Georgia there is Georgian Trade Unions Confederation. 30 workers from your factory join - company should not pull them aside saying leave it, threaten dismissal, try to influence their vote. Union speaks on their behalf about salaries.' } },
          { id: 'q_4_1_1', parent: 'q_4_1',
            text: { ka: 'აქვს არადისკრიმინაციული პოლიტიკა და პროცედურები?', en: 'Are non-discriminatory policies and procedures in place?' },
            tooltip: { ka: 'არადისკრიმინაციული პოლიტიკები. მაგალითი: HR-ში გაქვთ წერილობითი დოკუმენტი - კომპანია არ ახდენს დისკრიმინაციას სქესის, ასაკის, ეროვნების, რელიგიის, ოჯახური მდგომარეობის, შშმ სტატუსის გამო. ნებისმიერი მსგავსი საჩივრის მიღების შემდეგ HR-მა 7 დღეში უნდა გამოიკვლიოს და უპასუხოს.', en: 'Non-discriminatory policies. Example: in HR you have written document - Company does not discriminate based on gender, age, nationality, religion, family status, disability. After receiving any such complaint HR must investigate and respond within 7 days.' } },
          { id: 'q_4_1_2', parent: 'q_4_1',
            text: { ka: 'მუშაკთა წარმომადგენლებს ეძლევათ შესაბამისი საშუალებები?', en: 'Are workers representatives provided appropriate facilities?' },
            tooltip: { ka: 'მუშაკთა წარმომადგენლების საშუალებები. მაგალითი: კომპანია იძლევა - ერთ ოთახს კვირაში ერთხელ შესახვედრად, წვდომას HR ჩანაწერებზე (კონფიდენციალობის დაცვით), 2 სამუშაო საათს თვეში წარმომადგენლის ფუნქციისთვის (ხელფასი არ მცირდება). ისე რომ თავისუფლად შეასრულოს თავისი ფუნქცია.', en: 'Worker representative facilities. Example: company provides - one room once a week for meetings, access to HR records (with confidentiality), 2 work hours per month for representative duties (without salary reduction). So they can freely perform their role.' } },
          { id: 'q_4_1_3', parent: 'q_4_1',
            text: { ka: 'არ ერევა მუშაკთა წარმომადგენლების საქმიანობაში?', en: 'Does the company avoid interfering with worker representatives?' },
            tooltip: { ka: 'არ ერევა წარმომადგენლების საქმიანობაში. მაგალითი: წარმომადგენლის ჩანაწერებში თქვენ არ ჩახედავთ; მათ შეხვედრებზე მენეჯერი არ იქნება დასწრებული; თუ წარმომადგენელი წერს კრიტიკულ წერილს - არ ხდება მისი დასჯა. წარმომადგენელს თავისუფლად შეუძლია მუშაობა.', en: 'Non-interference with representatives. Example: you do not look into representative records; managers are not present at their meetings; if representative writes critical letter - they are not punished. Representative can work freely.' } },
          { id: 'q_4_2', isParent: true,
            text: { ka: 'კომპანიას აქვს მკაფიო პოლიტიკა იძულებითი შრომის წინააღმდეგ?', en: 'Does the company have clear policy against forced labour?' },
            tooltip: { ka: 'იძულებითი შრომის წინააღმდეგ პოლიტიკა. მაგალითი: ერთი გვერდი ტექსტი - ჩვენი კომპანია არასოდეს არ ჩამოართმევს მუშაკთა პასპორტებს, არ ჩაწერს მათ ვალში გარდა მოცემული ხელფასიდან, არ შეზღუდავს მათ თავისუფლებას, არ აიძულებს ზედმეტად მუშაობას. ხელმოწერილი დირექტორის მიერ.', en: 'Anti-forced-labor policy. Example: a one-page text - Our company will never confiscate worker passports, will not put them in debt beyond agreed salary, will not restrict their freedom, will not force overtime. Signed by Director.' } },
          { id: 'q_4_2_1', parent: 'q_4_2',
            text: { ka: 'ყველა თანამშრომელს ესმის, რა არის იძულებითი შრომა?', en: 'Do all officials understand what forced labour means?' },
            tooltip: { ka: 'თანამშრომლების ცოდნა იძულებით შრომაზე. მაგალითი: ყოველწლიურად ხდება HR გუნდის ტრენინგი - 2-საათიანი ვებინარი ან ლექცია, სადაც განიხილება რას ნიშნავს იძულებითი შრომა, როგორ ვიცნოთ მისი ნიშნები, რა გავაკეთოთ თუ შევამჩნევთ. ჩატარდა თუ არა ამაზე ტრენინგი ან გაცნობა?', en: 'Employee knowledge of forced labor. Example: yearly HR team training - 2-hour webinar or lecture discussing what forced labor means, how to recognize signs, what to do if we notice. Has training or awareness been provided?' } },
          { id: 'q_4_2_2', parent: 'q_4_2',
            text: { ka: 'შრომითი ხელშეკრულებები იწერება მუშაკისთვის გასაგებ ენაზე?', en: 'Are employment contracts written in workers language?' },
            tooltip: { ka: 'ხელშეკრულება გასაგებ ენაზე. მაგალითი: ქართველი მუშაკისთვის ხელშეკრულება ქართულად. მიგრანტი მუშაკისთვის უკრაინიდან - უკრაინულად ან რუსულად. ხელშეკრულებაში უნდა ეწეროს ხელფასი, საათები, შვებულება, შეწყვეტის წესი - გასაგებად. თუ მუშაკი ვერ კითხულობს ხელშეკრულებას, ის ვერ ხვდება თავის უფლებებს.', en: 'Contract in understandable language. Example: for Georgian worker contract in Georgian. For migrant worker from Ukraine - in Ukrainian or Russian. Contract should clearly state salary, hours, vacation, termination rules. If worker cannot read contract, they cannot understand their rights.' } },
          { id: 'q_4_2_3', parent: 'q_4_2',
            text: { ka: 'კომპანია იცის რომელ ქვეყნებში/სექტორებში იძულებითი შრომის რისკი მაღალია?', en: 'Is the company aware of high-risk regions/sectors?' },
            tooltip: { ka: 'მაღალი რისკის რეგიონების ცოდნა. მაგალითი: მიგრანტი მუშაკები სოფლის მეურნეობაში; ტექსტილის ფაბრიკები ბანგლადეშში ან მიანმარში; მანქანის ნაწილების წარმოება ცენტრალურ აზიაში. თუ მსგავსი წყაროებიდან ღებულობთ რამეს, რისკი მაღალია. იცით თუ არა ვინ არიან თქვენი მაღალი რისკის მომწოდებლები?', en: 'Knowledge of high-risk regions. Example: migrant workers in agriculture; textile factories in Bangladesh or Myanmar; auto parts manufacturing in Central Asia. If you receive items from such sources, risk is elevated. Do you know who your high-risk suppliers are?' } },
          { id: 'q_4_2_4', parent: 'q_4_2',
            text: { ka: 'კომპანია არ ჩამოართმევს მუშაკებს პირადობის დოკუმენტებს?', en: 'Does the company avoid confiscating workers identity documents?' },
            tooltip: { ka: 'პასპორტების არ ჩამორთმევა. მაგალითი: ბევრი ფაბრიკა ყოფილ საბჭოთა კავშირში ან ახლო აღმოსავლეთში შესანახად ვიკავებთ იხდის მიგრანტი მუშაკის პასპორტს - რეალურად ეს მუშაკის ხაფანგში მოქცევაა, რადგან მას არ შეუძლია გაიქცეს ან სხვა სამუშაო იპოვოს. თქვენი კომპანია არ ჩამოართმევს დოკუმენტებს?', en: 'Not confiscating passports. Example: many factories in former Soviet states or Middle East keep for safekeeping migrant worker passports - actually trapping the worker, who cannot leave or find other work. Does your company avoid taking workers documents?' } },
          { id: 'q_4_2_5', parent: 'q_4_2',
            text: { ka: 'მონიტორინგდება მიწოდების ჯაჭვი და სუბკონტრაქტორები?', en: 'Are supply chains and subcontractors monitored?' },
            tooltip: { ka: 'მომწოდებლების მონიტორინგი. მაგალითი: ყოველ 6 თვეში თქვენი ESG მენეჯერი ან მესამე მხარის აუდიტორი უგზავნის მომწოდებლებს კითხვარს - გყავთ მიგრანტი მუშაკები? ინახავთ მათ პასპორტებს? რამდენ საათს მუშაობენ? რა მინიმალურ ხელფასს იღებენ? მაღალი რისკის მომწოდებლების ვიზიტიც აუცილებელია.', en: 'Supplier monitoring. Example: every 6 months your ESG manager or third-party auditor sends suppliers questionnaire - Do you have migrant workers? Keep their passports? How many hours? Minimum wage? For high-risk suppliers on-site visits also necessary.' } },
          { id: 'q_4_3', isParent: true,
            text: { ka: 'კომპანია ანვითარებს ცნობიერებას ბავშვთა შრომის მიზეზებსა და შედეგებზე?', en: 'Is awareness of child labour developed within the company?' },
            tooltip: { ka: 'ბავშვთა შრომის ცნობიერება. მაგალითი: ყოველწლიური 1-საათიანი ვებინარი ყველა მენეჯერისთვის სათაურით ბავშვთა შრომის რისკი ჩვენს ინდუსტრიაში - სადაც განხილულია სტატისტიკა (გლობალურად 160 მილიონი ბავშვი მუშაობს), მიზეზები (სიღარიბე, განათლების ნაკლებობა), რას აკეთებს ჩვენი კომპანია.', en: 'Child labor awareness. Example: yearly 1-hour webinar for all managers titled Child Labor Risk in Our Industry - discussing statistics (160 million children work globally), causes (poverty, lack of education), what our company does.' } },
          { id: 'q_4_3_1', parent: 'q_4_3',
            text: { ka: 'იცავს ეროვნული კანონით დადგენილ მინიმალურ ასაკობრივ ნორმებს?', en: 'Does the company adhere to minimum age provisions?' },
            tooltip: { ka: 'მინიმალური ასაკის დაცვა. მაგალითი: საქართველოში სამუშაო ასაკის მინიმუმი 16 წელია. თუ 14 წლის ბავშვი მოვა სამუშაოზე, თქვენ არ ქირავდებით - კანონის დარღვევაა. 16-დან 18 წლამდე ბავშვი შეიძლება იქირაოთ მხოლოდ მსუბუქ სამუშაოზე. 18 წელზე ნაკლები სახიფათო სამუშაოზე - კატეგორიულად აკრძალულია.', en: 'Minimum age compliance. Example: in Georgia minimum working age is 16. If 14-year-old shows up for work, you do not hire - violates law. From 16 to 18 child can be hired only for light work. Under 18 for dangerous work - strictly prohibited.' } },
          { id: 'q_4_3_2', parent: 'q_4_3',
            text: { ka: 'ცნობს ბავშვთა შრომის რისკ-ქვეყნებსა და სექტორებს?', en: 'Is the company aware of high-risk regions for child labour?' },
            tooltip: { ka: 'რისკ-რეგიონების ცოდნა. მაგალითი: ცნობილი მაგალითები - ბამბის ფერმები უზბეკეთში, კაკაოს ფერმები ღანასა და სპილოს ძვლის სანაპიროზე (შოკოლადის წარმოებაში), ტექსტილი ბანგლადეშში, ჩაი ინდოეთში. იცით თუ არა, სად შეიძლება ეს პრობლემა გაჩნდეს თქვენს ჯაჭვში?', en: 'Knowledge of risk regions. Example: well-known cases - cotton farms in Uzbekistan, cocoa farms in Ghana and Ivory Coast (chocolate production), textiles in Bangladesh, tea in India. Do you know where this problem might arise in your chain?' } },
          { id: 'q_4_3_3', parent: 'q_4_3',
            text: { ka: 'იყენებს ასაკის შემოწმების მექანიზმებს დაქირავებისას?', en: 'Are age verification mechanisms used in recruitment?' },
            tooltip: { ka: 'ასაკის შემოწმება დაქირავებისას. მაგალითი: HR-ი ყოველთვის ითხოვს კანდიდატის პირადობის მოწმობას ან პასპორტს, აკოპირებს, აღნიშნავს დაბადების თარიღს. თუ კანდიდატმა არ მოიტანა ID, არ ქირავდება. ეს პროცესი დოკუმენტირებულია და ტარდება ყველა დაქირავებისას.', en: 'Age verification at hiring. Example: HR always requests candidate ID or passport, makes copy, notes birth date. If candidate cannot bring ID, not hired. Process is documented and done for every hire.' } },
          { id: 'q_4_3_4', parent: 'q_4_3',
            text: { ka: 'აქვს პოლიტიკა 18 წლამდე პირების დაქირავების წინააღმდეგ?', en: 'Does the company have policy against hiring under 18?' },
            tooltip: { ka: '18 წლამდე დაქირავების აკრძალვა. მაგალითი: ჩვენი კომპანიის HR პოლიტიკა - მიუხედავად იმისა, რომ კანონი იძლევა 16 წლიდან, ჩვენ ვქირავდებით მხოლოდ 18+ პირებს. ეს გამორიცხავს ნებისმიერ რისკს ბავშვთა შრომასთან დაკავშირებით და ამარტივებს HR პროცესს.', en: 'Prohibiting hiring under 18. Example: our company HR policy - Even though law allows from 16, we only hire 18+. Eliminates any risk related to child labor and simplifies HR process.' } },
          { id: 'q_4_3_5', parent: 'q_4_3',
            text: { ka: 'ახდენს გავლენას ქვე-კონტრაქტორებზე ბავშვთა შრომის წინააღმდეგ?', en: 'Does the company influence subcontractors against child labour?' },
            tooltip: { ka: 'მომწოდებლებზე გავლენა. მაგალითი: ხელშეკრულებაში მომწოდებელთან წერია - ხელმომწერი მხარე ადასტურებს, რომ არ იყენებს და არ გამოიყენებს ბავშვთა შრომას. დარღვევის შემთხვევაში ხელშეკრულება შეწყდება პირველივე გაფრთხილების შემდეგ. ასევე ჩატარდება ყოველწლიური აუდიტი.', en: 'Influence on suppliers. Example: in supplier contract states - The signing party confirms it does not use and will not use child labor. In case of violation, contract terminated upon first warning. Annual audits also verify.' } },
          { id: 'q_4_3_6', parent: 'q_4_3',
            text: { ka: 'შემუშავებული აქვს ბავშვთა შრომის გამოვლენის მექანიზმი?', en: 'Has the company developed mechanisms to detect child labour?' },
            tooltip: { ka: 'გამოვლენის მექანიზმი. მაგალითი: ანონიმური ცხელი ხაზი (ნომერი დაკიდულია ფაბრიკაში), სადაც ნებისმიერ თანამშრომელს, კლიენტს ან მომწოდებელს შეუძლია დარეკოს. ან წელიწადში ერთხელ ვიზუალური აუდიტი მომწოდებლების ფაბრიკებში. ან თანამშრომლების ტრენინგი - თუ ფაბრიკაში დაინახე მცირე მოზარდი, ვის შეატყობინო.', en: 'Detection mechanism. Example: anonymous hotline (number posted in factory) where any employee, customer or supplier can call. Or yearly visual audits at supplier factories. Or employee training - If you see young teenager in factory, report to whom.' } },
          { id: 'q_4_4', isParent: true,
            text: { ka: 'კვალიფიკაცია, უნარები და გამოცდილება არის დაქირავების და დაწინაურების საფუძველი?', en: 'Are qualifications, skill, experience the basis for recruitment/promotion?' },
            tooltip: { ka: 'დაქირავება უნარების მიხედვით. მაგალითი: ხარისხის ინჟინრის ვაკანსიაზე ქირავდება ნიკა, რადგან მას აქვს 5 წლიანი გამოცდილება და MS დიპლომი - არა იმიტომ რომ ის გენერალური დირექტორის ნათესავია. ხელფასი ეფუძნება პოზიციის სტანდარტს, არა ვისთან რა აქვს მოლაპარაკებული. პირდაპირი კავშირის გარეშე.', en: 'Hiring by skills. Example: for quality engineer position Nick is hired because he has 5 years experience and MS degree - not because he is General Director relative. Salary based on position standard, not who negotiated what. Without direct connection.' } },
          { id: 'q_4_4_1', parent: 'q_4_4',
            text: { ka: 'მაღალი დონის პასუხისმგებელი პირი დანიშნულია თანასწორი დასაქმების საკითხებზე?', en: 'Is high-level responsibility assigned for equal employment?' },
            tooltip: { ka: 'მაღალი დონის პასუხისმგებელი პირი. მაგალითი: HR დირექტორი ან ESG მენეჯერი არის ოფიციალურად დანიშნული თანასწორი დასაქმების პრინციპის ხელმძღვანელი. ეს მის სამუშაოს აღწერაშია, შესრულების შეფასებაში. წელიწადში ერთხელ აკეთებს ანგარიშს გენერალურ დირექტორთან.', en: 'High-level responsible person. Example: HR Director or ESG Manager is officially designated Equal Employment Principle Lead. This is in their job description and performance review. Once a year reports to General Director.' } },
          { id: 'q_4_4_2', parent: 'q_4_4',
            text: { ka: 'ინახება განახლებული ჩანაწერები დაქირავების, ტრენინგის და დაწინაურების შესახებ?', en: 'Are records kept on recruitment, training, promotion?' },
            tooltip: { ka: 'HR ჩანაწერების შენახვა. მაგალითი: ციფრული HR სისტემაში (BambooHR, Workday, ან Excel) ინახება - 01.03.2024 დაიქირავა ნიკო, ფიზიკოსი - 2-ე საფეხურის პოზიცია, ხელფასი 2500 ლარი, კრიტერიუმი - გამოცდილება 7 წელი. ნებისმიერ მომენტში შეიძლება დადგინდეს, ვინ რატომ აიყვანეს.', en: 'Keeping HR records. Example: in digital HR system (BambooHR, Workday, or Excel) records kept - 01.03.2024 hired Niko, physicist - level 2 position, salary 2500 GEL, criteria 7 years experience. At any moment can determine who was hired why.' } },
          { id: 'q_4_4_3', parent: 'q_4_4',
            text: { ka: 'ტარდება არაცნობიერი მიკერძოების ტრენინგი?', en: 'Is unconscious bias training conducted?' },
            tooltip: { ka: 'არაცნობიერი მიკერძოების ტრენინგი. მაგალითი: ინტერვიუს დროს, ერთსა და იმავე პასუხზე ინტერვიუერი არაცნობიერად ფიქრობს ეს მამაკაცი თავდაჯერებულია, კარგი ლიდერი იქნება, ხოლო ქალის მსგავს პასუხზე ცოტა აგრესიულია. ტრენინგი ეხმარება ამ ფარული მიკერძოებების გაცნობიერებაში.', en: 'Unconscious bias training. Example: during interview, on same answer interviewer subconsciously thinks this man is confident, will make good leader, but on similar answer from woman thinks she is a bit aggressive. Training helps recognize hidden biases.' } },
          { id: 'q_4_4_4', parent: 'q_4_4',
            text: { ka: 'აქვს საჩივრების წარდგენის პროცედურა დისკრიმინაციის შემთხვევაში?', en: 'Are grievance procedures developed for discrimination?' },
            tooltip: { ka: 'საჩივრების პროცედურა დისკრიმინაციაზე. მაგალითი: დოკუმენტი წერია - თუ თანამშრომელი გრძნობს დისკრიმინაციას, შეუძლია ანონიმურად დაწეროს email საჩივრის ფოსტაზე complaints@company.com - 5 დღეში HR-ს დანიშნული პირი ჩაატარებს გამოკვლევას, 14 დღეში გამოიცემა შედეგი. ანონიმურია.', en: 'Discrimination grievance procedure. Example: document states - If employee feels discrimination, can anonymously email complaints@company.com - within 5 days HR appointed person investigates, within 14 days result issued. Anonymous.' } },
          { id: 'q_4_4_5', parent: 'q_4_4',
            text: { ka: 'ტარდება არადისკრიმინაციული პოლიტიკის ტრენინგი?', en: 'Is non-discrimination training provided?' },
            tooltip: { ka: 'დისკრიმინაციის ტრენინგი. მაგალითი: ყოველწლიურად 1-საათიანი online ტრენინგი ყველა თანამშრომლისთვის - რა არის დისკრიმინაცია? მაგალითები: ხუმრობა ეროვნებაზე, ქალის გამოყოფა შეხვედრებიდან, ფიზიკური ინვალიდობის მინიშნება. რა არ არის დასაშვები? შედეგზე ტესტი - 80%+ აუცილებელი.', en: 'Discrimination training. Example: yearly 1-hour online training for all employees - What is discrimination? Examples: nationality jokes, excluding women from meetings, hinting at physical disability. What is unacceptable? Test on results - 80%+ required.' } },
          { id: 'q_4_4_6', parent: 'q_4_4',
            text: { ka: 'აქვს უნარების განვითარების ხელმისაწვდომობის პროგრამა?', en: 'Are programs in place to promote access to skills training?' },
            tooltip: { ka: 'უნარების განვითარების ხელმისაწვდომობა. მაგალითი: კომპანიას აქვს ვაუჩერი ტრენინგებზე, რომელზე შეიძლება განცხადება ნებისმიერი თანამშრომლისთვის - არა მხოლოდ მენეჯერების რეკომენდაციით. HR-ი ამოწმებს ყოველ წელიწადს - ვისმა მიიღო ტრენინგი, არის თუ არა გადახრა სქესის ან ასაკის მიხედვით.', en: 'Skills development access. Example: company has training vouchers any employee can apply for - not only by manager recommendation. HR checks yearly - who received training, is there gender or age skew.' } }
        ]
      },
      // SECTION 4: ENVIRONMENT
      {
        key: 'environment',
        questions: [
          { id: 'q_5_1', isParent: true,
            text: { ka: 'აქვს კომპანიას ქცევის კოდექსი ჯანმრთელობასა და გარემოზე ზრუნვისთვის?', en: 'Does the company have code of conduct for health/environment care?' },
            tooltip: { ka: 'ქცევის კოდექსი ჯანდაცვისა და გარემოს დაცვის შესახებ. მაგალითი: 3-გვერდიანი დოკუმენტი ჩვენი ვალდებულება გარემოს მიმართ - ჩვენ ვცდილობთ შევამციროთ ემისიები 5%-ით წელიწადში, ვმუშაობთ მხოლოდ ლეგალური წარმოშობის ხის მასალით, ნარჩენებს გადავამუშავებთ 80%-ით. ხელმოწერილია დირექტორის და გამოფენილია კედელზე.', en: 'Code of conduct on health/environment. Example: 3-page document Our Environmental Commitment - We strive to reduce emissions by 5% yearly, work only with legally sourced wood, recycle 80% of waste. Signed by Director and posted on factory wall.' } },
          { id: 'q_5_1_1', parent: 'q_5_1',
            text: { ka: 'აქვს მენეჯერული კომიტეტი წინდახედული მიდგომის ზედამხედველობისთვის?', en: 'Is there a managerial committee overseeing precautionary application?' },
            tooltip: { ka: 'მენეჯერული კომიტეტი გარემოზე. მაგალითი: კვარტალურად იკრიბება გარემოს და მდგრადობის კომიტეტი - დირექტორი, წარმოების მენეჯერი, ESG მენეჯერი, ფინანსთა დირექტორი. განიხილავენ მონაცემებს - რამდენი წყალი დახარჯეს, რამდენი ნარჩენები წარმოიქმნა, რა ცვლილებებია საჭირო. ცხადყოფს, რომ საკითხი სერიოზულად აღიქმება.', en: 'Managerial committee on environment. Example: quarterly meets Environment and Sustainability Committee - director, production manager, ESG manager, finance director. Discuss data - how much water used, how much waste generated, what changes needed. Shows issue is taken seriously.' } },
          { id: 'q_5_1_2', parent: 'q_5_1',
            text: { ka: 'დამყარებულია ორმხრივი კომუნიკაცია დაინტერესებულ მხარეებთან?', en: 'Is two-way communication established with stakeholders?' },
            tooltip: { ka: 'ორმხრივი კომუნიკაცია. მაგალითი: კომპანია ყოველწლიურად ატარებს ღია კარის დღეს ადგილობრივი თემისთვის - მცხოვრებლები მოდიან ფაბრიკაში, ცნობენ წარმოებას, შეუძლიათ კითხვების დასმა, შეშფოთების გამოხატვა (მაგ. ხმაური ღამით ხელს გვიშლის ძილში). შემდეგ კომპანია ცდილობს რეაგირებას.', en: 'Two-way communication. Example: company yearly holds Open House for local community - residents visit factory, learn about production, can ask questions, voice concerns (e.g. Night noise disturbs our sleep). Company then tries to respond.' } },
          { id: 'q_5_1_3', parent: 'q_5_1',
            text: { ka: 'იყენებს მრავალმხრივ შეხვედრებს და ფოკუს-ჯგუფებს?', en: 'Does the company use multi-stakeholder meetings and focus groups?' },
            tooltip: { ka: 'მრავალმხრივი შეხვედრები. მაგალითი: კომპანია მოაწყობს დისკუსიას - 30 ადამიანი - კომპანიის წარმომადგენლები (5), ადგილობრივი ხელისუფლება (3), მდგრადობის NGO (4), ჟურნალისტები (3), მცხოვრებლები (15). განიხილავენ - რა გავლენა აქვს ფაბრიკას ადგილობრივ წყლის ხარისხზე, რა გასაუმჯობესებელია.', en: 'Multi-stakeholder meetings. Example: company organizes discussion - 30 people - company representatives (5), local government (3), sustainability NGO (4), journalists (3), residents (15). Discuss what impact factory has on local water quality, what to improve.' } },
          { id: 'q_5_2', isParent: true,
            text: { ka: 'აქვს განსაზღვრული მდგრადი განვითარების ხედვა?', en: 'Are sustainable development vision and policies defined?' },
            tooltip: { ka: 'მდგრადი განვითარების ხედვა და სტრატეგია. მაგალითი: კომპანიის მდგრადობის სტრატეგია 2025-2030 დოკუმენტი - ხედვა გავხდეთ ინდუსტრიის მდგრადობის ლიდერები; პოლიტიკა ვიყენებთ მხოლოდ განახლებად ენერგიას; სტრატეგია 5 წელიწადში გადავიღოთ 100% მზის ენერგიაზე, ინვესტიციით 2 მილიონი ლარი. წერილობითი, კონკრეტული, ვადებიანი.', en: 'Sustainable development vision and strategy. Example: company Sustainability Strategy 2025-2030 - vision become industry sustainability leaders; policy use only renewable energy; strategy in 5 years switch 100% to solar, with 2 million GEL investment. Written, concrete, time-bound.' } },
          { id: 'q_5_2_1', parent: 'q_5_2',
            text: { ka: 'შემუშავებულია მდგრადობის სამიზნე მაჩვენებლები?', en: 'Are sustainability targets and indicators developed?' },
            tooltip: { ka: 'მდგრადობის სამიზნე მაჩვენებლები. მაგალითი: კომპანიის KPI-ები 2025-სთვის - ენერგიის მოხმარება შემცირდეს 15%-ით (2024-დან); წყლის ხელახალი გამოყენება გაიზარდოს 30%-მდე; ნარჩენების გადამუშავება 70%-დან 85%-მდე; ქალების წილი მენეჯმენტში 20%-დან 35%-მდე. გაზომვადი მიზნები.', en: 'Sustainability target indicators. Example: company KPIs for 2025 - reduce energy consumption by 15% (from 2024); increase water reuse to 30%; increase waste recycling from 70% to 85%; increase female share in management from 20% to 35%. Measurable goals.' } },
          { id: 'q_5_2_2', parent: 'q_5_2',
            text: { ka: 'აქვს მდგრადი წარმოების და მოხმარების პროგრამა?', en: 'Is there sustainable production/consumption programme?' },
            tooltip: { ka: 'მდგრადი წარმოება. მაგალითი: კომპანია იყენებს water recycling system-ს - წარმოებაში გამოყენებული წყალი ფილტრდება და ხელახლა გამოიყენება, რის შედეგად დახარჯავს 40% ნაკლებ წყალს. ან მოწყობილობა, რომელიც წარმოების ნარჩენებს (პლასტიკის ჭრიდან) ხელახლა გადაამუშავებს ახალ პროდუქტად.', en: 'Sustainable production. Example: company uses water recycling system - water used in production is filtered and reused, consuming 40% less water. Or equipment that reprocesses production waste (plastic offcuts) into new products.' } },
          { id: 'q_5_2_3', parent: 'q_5_2',
            text: { ka: 'მუშაობს დიზაინერებთან და მომწოდებლებთან გარემოსდაცვითი მაჩვენებლების გასაუმჯობესებლად?', en: 'Does the company work with designers/suppliers to improve environmental performance?' },
            tooltip: { ka: 'თანამშრომლობა დიზაინერებთან. მაგალითი: კომპანია მის შესაფუთ პროდუქციაზე იცვლის პლასტიკი ცვილოვან ქაღალდზე (გადასამუშავებელი). მუშაობს მომწოდებელთან, რომელიც აწვდის ცვილს - შეიძლება მაქსიმალურად ბუნებრივი ცვილი მოგვცე? ერთად აუმჯობესებენ პროდუქტის გარემოსდაცვით ეფექტს.', en: 'Collaboration with designers. Example: company replaces plastic packaging with waxed paper (recyclable). Works with wax supplier - Can you provide maximally natural wax? Together they improve product environmental impact.' } },
          { id: 'q_5_2_4', parent: 'q_5_2',
            text: { ka: 'ზომავს და აცნობს პროგრესს მდგრადობის პრინციპებზე?', en: 'Does the company measure/communicate sustainability progress?' },
            tooltip: { ka: 'ზომვა და რეპორტინგი. მაგალითი: კომპანია ყოველთვიურად ზომავს - რამდენი kWh ენერგიაა გამოყენებული, რამდენი ტონა CO2 გამოიყო, რამდენი ტონა ნარჩენი წარმოიქმნა. შედეგი ჩაიწერება spreadsheet-ში. ყოველწლიურად საჯარო ESG რეპორტში ხდება ამის გაზიარება - გასულ წელს შევამცირეთ CO2 8%-ით.', en: 'Measure and report. Example: company monthly measures - how many kWh used, tons of CO2 emitted, tons of waste generated. Results recorded in spreadsheet. Yearly in public ESG report - Last year we reduced CO2 by 8%.' } },
          { id: 'q_5_3', isParent: true,
            text: { ka: 'აქვს კომპანიას პოლიტიკა გარემოსდაცვითი ტექნოლოგიების გამოყენებაზე?', en: 'Is there policy on use of environmentally sound technologies?' },
            tooltip: { ka: 'გარემოსდაცვითი ტექნოლოგიების პოლიტიკა. მაგალითი: კომპანიის ტექნოლოგიური სტრატეგია წერია - ახალი მანქანების შერჩევისას მინიმუმ 30%-ით უფრო ენერგოეფექტური ვიდრე ჩვენს ამჟამინდელ ფლოტში. ან: მზის პანელები ფაბრიკის სახურავზე, რომელიც ფარავს ენერგიის 40%-ს.', en: 'Environmental technology policy. Example: company Technology Strategy states - When selecting new machines, at least 30% more energy-efficient than current fleet. Or: Solar panels on factory roof covering 40% of energy.' } },
          { id: 'q_5_3_1', parent: 'q_5_3',
            text: { ka: 'აწვდის ინფორმაციას ტექნოლოგიების გარემოსდაცვითი მაჩვენებლების შესახებ?', en: 'Is information made available about environmental performance?' },
            tooltip: { ka: 'ინფორმაციის გამჭვირვალობა ტექნოლოგიებზე. მაგალითი: კომპანიის ვებგვერდზე Sustainability გვერდზე წერია - ჩვენი მთავარი წარმოების ხაზი მოიხმარს 1500 kWh/დღეში (40% მზის ენერგია), წყალი 8 m3/დღეში (50% გადამუშავებული), CO2 ემისია 2.5 ტონა თვეში. ღია მონაცემები. დაინტერესებულ მხარეებს შეუძლიათ ნახონ.', en: 'Technology transparency. Example: on company website Sustainability page - Our main production line uses 1500 kWh/day (40% solar), water 8 m3/day (50% recycled), CO2 emission 2.5 tons monthly. Open data. Stakeholders can see.' } },
          { id: 'q_5_3_2', parent: 'q_5_3',
            text: { ka: 'იყენებს ცხოვრების ციკლის შეფასებას (LCA) ახალი ტექნოლოგიებისთვის?', en: 'Is life cycle assessment used in new technology development?' },
            tooltip: { ka: 'ცხოვრების ციკლის შეფასება (LCA). მაგალითი: ახალი პროდუქტის (ხის სკამი) დიზაინისას ხდება LCA - 1) ხის მოპოვება (ჭრის ეფექტი ტყეზე); 2) ტრანსპორტირება (CO2 გადატანისას); 3) წარმოება (ენერგია, წყალი); 4) გამოყენება (კლიენტთან 10 წელი); 5) უტილიზაცია. ვხედავთ, სად არის ყველაზე დიდი ეფექტი.', en: 'Life Cycle Assessment (LCA). Example: when designing new product (wooden chair) LCA is performed - 1) wood extraction (forest impact); 2) transport (CO2 in moving); 3) production (energy, water); 4) use (10 years at customer); 5) disposal. We see where the biggest impact is.' } },
          { id: 'q_5_3_3', parent: 'q_5_3',
            text: { ka: 'ამოწმებს კრიტერიუმებს მომწოდებელთა შესარჩევად?', en: 'Are criteria examined for supplier selection?' },
            tooltip: { ka: 'გარემოსდაცვითი მოთხოვნები მომწოდებლებს. მაგალითი: სატენდრო დოკუმენტში წერია - ფასისა და ხარისხის გარდა, ფასდება გარემოსდაცვითი ფაქტორები: 1) მომწოდებელს აქვს ISO 14001? 2) რამდენი CO2 გამოიყოფა ერთეული პროდუქციის წარმოებისას? 3) ნედლეული მდგრადი წყაროდანაა? 30% შედეგზე ეფექტი.', en: 'Environmental requirements to suppliers. Example: tender document states - Beyond price and quality, environmental factors evaluated: 1) Does supplier have ISO 14001? 2) CO2 per unit produced? 3) Is raw material from sustainable source? 30% impact on result.' } },
          { id: 'q_5_3_4', parent: 'q_5_3',
            text: { ka: 'თანამშრომლობს ინდუსტრიის პარტნიორებთან საუკეთესო ტექნოლოგიების უზრუნველსაყოფად?', en: 'Does the company cooperate with industry partners on best technology?' },
            tooltip: { ka: 'ინდუსტრიული თანამშრომლობა. მაგალითი: 5 ქართული ფაბრიკა - კონკურენტებიც - იქმნება ერთობლივი სამუშაო ჯგუფი მდგრადობის ქართული ინდუსტრიული გაერთიანება. წელიწადში 4-ჯერ იკრიბებიან, ასევე უნივერსიტეტიდან მკვლევარები, რათა გაიზიარონ რა საუკეთესო ხელმისაწვდომი ტექნოლოგიები არსებობს.', en: 'Industry collaboration. Example: 5 Georgian factories - even competitors - form joint working group Georgian Sustainability Industry Coalition. Meet 4 times a year, with university researchers, to share what Best Available Technologies exist.' } }
        ]
      },
      // SECTION 5: ANTI-CORRUPTION
      {
        key: 'antiCorruption',
        questions: [
          { id: 'q_6_1', isParent: true,
            text: { ka: 'აქვს კომპანიას ანტიკორუფციული პოლიტიკა და პროგრამები?', en: 'Does the company have anti-corruption policies and programmes?' },
            tooltip: { ka: 'ანტიკორუფციული პოლიტიკა და პროგრამა. მაგალითი: 1-გვერდიანი პოლიტიკა - ჩვენი კომპანია არ მისცემს ან მიიღებს ქრთამს, არ მიიღებს საჩუქარს 100$-ზე მეტი ღირებულებისას, არ დასაქმდება ნათესაობის ნიშნით. პროგრამა - კონკრეტული ნაბიჯები: ყოველწლიური ტრენინგი, ანონიმური საჩივრების ცხელი ხაზი, გამჭვირვალე ხელფასი.', en: 'Anti-corruption policy and programme. Example: 1-page policy - Our company will not give or receive bribes, will not accept gifts over $100 in value, will not hire by family connection. Programme - concrete steps: yearly training, anonymous complaint hotline, transparent salary.' } },
          { id: 'q_6_1_1', parent: 'q_6_1',
            text: { ka: 'წლიურ ანგარიშებში მოცემულია ანტიკორუფციული მუშაობის შედეგები?', en: 'Is anti-corruption work reported in annual reports?' },
            tooltip: { ka: 'საჯარო რეპორტინგი ანტიკორუფციაზე. მაგალითი: კომპანიის 2024 წლიური ანგარიშის ანტიკორუფცია სექციაში წერია - გასულ წელს ჩავატარეთ 4 ტრენინგი (120 თანამშრომელი), მივიღეთ 3 ანონიმური საჩივარი, გამოვიკვლიეთ ყველა, შეიცვალა 1 პროცედურა. ქრთამი არცერთი დაფიქსირებული შემთხვევა. საჯარო და გამჭვირვალე.', en: 'Public anti-corruption reporting. Example: in company 2024 Annual Report Anti-corruption section - Last year we conducted 4 trainings (120 employees), received 3 anonymous complaints, investigated all, changed 1 procedure. Zero bribery cases recorded. Public and transparent.' } },
          { id: 'q_6_1_2', parent: 'q_6_1',
            text: { ka: 'კომპანია იზიარებს გამოცდილებას და საუკეთესო პრაქტიკას?', en: 'Does the company share experiences and best practices?' },

    async function loadCompany(id) {
      if (!supabase) return { data: null, error: 'no-supabase' };
      const { data, error } = await supabase.from('esg_companies').select('*').eq('id', id).maybeSingle();
      return { data, error };
    }
    async function createCompany(id, lang) {
      if (!supabase) return { error: 'no-supabase' };
      return supabase.from('esg_companies').insert({ id, language: lang });
    }
    async function updateCompany(id, fields) {
      if (!supabase) return { error: 'no-supabase' };
      return supabase.from('esg_companies').update(fields).eq('id', id);
    }
    async function loadAnswers(companyId) {
      if (!supabase) return { data: [] };
      const { data, error } = await supabase.from('esg_answers').select('*').eq('company_id', companyId);
      return { data: data || [], error };
    }
    async function upsertAnswer(companyId, questionId, answer, partialText, wasAutoSuggested) {
      if (!supabase) return { error: 'no-supabase' };
      return supabase.from('esg_answers').upsert({
        company_id: companyId,
        question_id: questionId,
        answer,
        partial_text: partialText || null,
        was_auto_suggested: !!wasAutoSuggested
      }, { onConflict: 'company_id,question_id' });
    }
    async function lockCompany(id) {
      if (!supabase) return { error: 'no-supabase' };
      return supabase.from('esg_companies').update({
        is_locked: true,
        submitted_at: new Date().toISOString()
      }).eq('id', id);
    }

    // ----------- WIZARD SCREEN -----------
    function WizardScreen({ lang, setLang, companyId, companyName, initialAnswers, onSave, onSubmit }) {
      const [currentSection, setCurrentSection] = useState(0);
      const [answers, setAnswers] = useState(initialAnswers || {});
      const [partialTexts, setPartialTexts] = useState(() => {
        const t = {};
        Object.entries(initialAnswers || {}).forEach(([qid, a]) => { if (a.partial_text) t[qid] = a.partial_text; });
        return t;
      });
      const [autoSuggested, setAutoSuggested] = useState(() => {
        const a = {};
        Object.entries(initialAnswers || {}).forEach(([qid, x]) => { if (x.was_auto_suggested) a[qid] = true; });
        return a;
      });
      const [showError, setShowError] = useState(false);
      const [showConfirm, setShowConfirm] = useState(false);
      const [saveStatus, setSaveStatus] = useState(''); // 'saving' | 'saved' | ''
      const [submitting, setSubmitting] = useState(false);
      const saveTimer = useRef(null);

      const section = SECTIONS[currentSection];
      const sectionTitles = T[lang].sections;
      const totalQ = ALL_QUESTIONS.length;
      const answeredCount = Object.values(answers).filter(a => a && a.answer).length;
      const pct = Math.round((answeredCount / totalQ) * 100);

      // Debounced save
      const scheduleSave = useCallback((qid, payload) => {
        setSaveStatus('saving');
        if (saveTimer.current) clearTimeout(saveTimer.current);
        saveTimer.current = setTimeout(async () => {
          try {
            await upsertAnswer(companyId, qid, payload.answer, payload.partial_text, payload.was_auto_suggested);
            setSaveStatus('saved');
            setTimeout(() => setSaveStatus(''), 2000);
          } catch (e) {
            setSaveStatus('');
          }

      const handleAnswer = (qid, val) => {
        setShowError(false);
        const newAnswers = { ...answers };
        const newAuto = { ...autoSuggested };
        const newPartial = { ...partialTexts };

        // Set this answer
        newAnswers[qid] = { answer: val, partial_text: newPartial[qid] || null, was_auto_suggested: false };
        newAuto[qid] = false;

        const q = getQuestion(qid);
        // Find which section this question belongs to and check if it's the FIRST question of that section
        let isFirstOfSection = false;
        let sectionQuestions = [];
        for (const s of SECTIONS) {
          if (s.questions.length > 0 && s.questions[0].id === qid) {
            isFirstOfSection = true;
            sectionQuestions = s.questions;
            break;
          }
        }

        // If this is the first question of a section
        if (isFirstOfSection) {
          if (val === 'no') {
            // Auto-fill ALL other questions in this section with 'no' (if not manually set, or previously auto-suggested)
            sectionQuestions.forEach(sq => {
              if (sq.id === qid) return; // skip the first one itself
              const existing = newAnswers[sq.id];
              if (!existing || newAuto[sq.id]) {
                newAnswers[sq.id] = { answer: 'no', partial_text: null, was_auto_suggested: true };
                newAuto[sq.id] = true;
                scheduleSave(sq.id, { answer: 'no', partial_text: null, was_auto_suggested: true });
              }
            });
          } else {
            // First question changed to yes/partial → clear ALL auto-suggested in this section
            sectionQuestions.forEach(sq => {
              if (sq.id === qid) return;
              if (newAuto[sq.id]) {
                delete newAnswers[sq.id];
                newAuto[sq.id] = false;
                if (supabase) {
                  supabase.from('esg_answers').delete().eq('company_id', companyId).eq('question_id', sq.id);
                }
              }
            });
          }
        }
        // Also keep the original parent/child logic for nested questions (q_2_2 → q_2_2_1, etc.)
        else if (q && q.isParent) {
          const children = getChildren(qid);
          if (val === 'no') {
            children.forEach(c => {
              const existing = newAnswers[c.id];
              if (!existing || newAuto[c.id]) {
                newAnswers[c.id] = { answer: 'no', partial_text: null, was_auto_suggested: true };
                newAuto[c.id] = true;
                scheduleSave(c.id, { answer: 'no', partial_text: null, was_auto_suggested: true });
              }
            });
          } else {
            children.forEach(c => {
              if (newAuto[c.id]) {
                delete newAnswers[c.id];
                newAuto[c.id] = false;
                if (supabase) {
                  supabase.from('esg_answers').delete().eq('company_id', companyId).eq('question_id', c.id);
                }
              }
            });
          }
        }

        setAnswers(newAnswers);
        setAutoSuggested(newAuto);
        scheduleSave(qid, { answer: val, partial_text: newPartial[qid] || null, was_auto_suggested: false });
      };

      const handlePartialText = (qid, txt) => {
        const newPartial = { ...partialTexts, [qid]: txt };
        setPartialTexts(newPartial);
        const newAnswers = { ...answers };

          setAnswers(newAnswers);
          scheduleSave(qid, { answer: 'partial', partial_text: txt, was_auto_suggested: false });
        }
      };

      // Validation: all questions in current section answered (partial text is optional)
      const validateSection = () => {
        for (const q of section.questions) {
          const a = answers[q.id];
          if (!a || !a.answer) return false;
        }
        return true;
      };

      const validateAll = () => {
        for (const q of ALL_QUESTIONS) {
          const a = answers[q.id];
          if (!a || !a.answer) return false;
        }
        return true;
      };

      const goNext = () => {
        if (!validateSection()) { setShowError(true); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
        setShowError(false);
        if (currentSection < SECTIONS.length - 1) {

              const a = answers[q.id];

            });

          }
          return;
        }
        setShowConfirm(true);
      };

      const doSubmit = async () => {

        try {
          await onSubmit();
        } catch (e) {

        }

      const sectionQuestions = section.questions;
      const isLast = currentSection === SECTIONS.length - 1;

      // numbered display: count of question position within section (1-based)
      const numberedQs = sectionQuestions.map((q, i) => ({ q, num: i + 1 }));

      return React.createElement('div', { className: 'min-h-screen flex flex-col' },
        React.createElement(Header, { lang, setLang, companyName }),

          React.createElement('div', { className: 'grid grid-cols-1 lg:grid-cols-[260px_1fr] gap-6' },
            // SIDEBAR
            React.createElement('aside', { className: 'lg:sticky lg:top-20 lg:self-start' },
              React.createElement('div', { className: 'bg-white border border-stone-200 rounded-2xl p-5' },
                React.createElement('p', { className: 'text-[10px] font-semibold text-stone-400 uppercase tracking-wider mb-1' }, T[lang].progress),
                React.createElement('div', { className: 'flex items-baseline gap-1 mb-3' },
                  React.createElement('span', { className: 'text-3xl font-semibold text-stone-900' }, pct),
                  React.createElement('span', { className: 'text-sm text-stone-500' }, '%')
                ),
                React.createElement('div', { className: 'h-1 bg-stone-100 rounded-full overflow-hidden mb-5' },
                  React.createElement('div', {
                    className: 'h-full transition-all duration-500 rounded-full',
                    style: { width: pct + '%', background: 'linear-gradient(90deg, #1F4D3C, #0F6E56)' }
                  })
                ),
                React.createElement('div', { className: 'space-y-0.5' },
                  sectionTitles.map((title, i) => {
                    const isActive = i === currentSection;
                    const isPast = i < currentSection;
                    const sectionQs = SECTIONS[i].questions;
                    const sectionAnswered = sectionQs.every(q => {
                      const a = answers[q.id];
                      return a && a.answer && (a.answer !== 'partial' || (partialTexts[q.id] && partialTexts[q.id].trim()));
                    });
                    return React.createElement('button', {
                      key: i,
                      onClick: () => setCurrentSection(i),
                      className: `w-full flex items-center gap-2.5 px-3 py-2 rounded-lg transition text-left ${isActive ? 'bg-stone-100' : 'hover:bg-stone-50'}`
                    },
                      React.createElement('div', {
                        className: `w-6 h-6 rounded-full flex items-center justify-center text-[11px] font-medium flex-shrink-0 ${
                          isActive ? 'text-white' : sectionAnswered ? 'bg-emerald-100 text-emerald-700' : 'bg-stone-100 text-stone-500'
                        }`,
                        style: isActive ? { background: 'linear-gradient(135deg, #1F4D3C, #0F6E56)' } : {}
                      }, sectionAnswered && !isActive ? '✓' : (i + 1)),
                      React.createElement('span', {
                        className: `text-[13px] ${isActive ? 'text-stone-900 font-medium' : sectionAnswered ? 'text-stone-700' : 'text-stone-500'}`
                      }, title)
                    );
                  })
                )
              )

            // MAIN

                  ),

                ),

                },

                  saveStatus === 'saving' ? T[lang].saving : T[lang].saved
                ) : null
              ),
              // Error banner
              showError ? React.createElement('div', {

              },

                React.createElement('div', { className: 'flex gap-2' },
                  React.createElement('button', {

    // ============================================
    // ROOT APP
    // ============================================
    function App() {
      const [lang, setLangState] = useState('ka');
      const [screen, setScreen] = useState('login'); // login, info, wizard, locked, saved
      const [companyId, setCompanyId] = useState('');
      const [companyName, setCompanyName] = useState('');
      const [contact, setContact] = useState('');
      const [submittedAt, setSubmittedAt] = useState(null);
      const [initialAnswers, setInitialAnswers] = useState({});

      useEffect(() => {
        document.documentElement.lang = lang;
      }, [lang]);

      const setLang = (l) => {
        setLangState(l);
        if (companyId) updateCompany(companyId, { language: l });
      };

      const handleLogin = async (id) => {
        if (!supabase) {
          alert('Supabase not configured. Open the file in editor and add SUPABASE_URL and SUPABASE_ANON_KEY.');
          return;
        }
        setCompanyId(id);
        const { data: company } = await loadCompany(id);
        if (!company) {
          // New company → create + go to info screen
          await createCompany(id, lang);
          setScreen('info');
          return;
        }
        // Existing
        if (company.language) setLangState(company.language);
        setCompanyName(company.name || '');
        setContact(company.contact || '');
        if (company.is_locked) {
          setSubmittedAt(company.submitted_at);
          setScreen('locked');
          return;
        }
        if (!company.name || !company.contact) {
          setScreen('info');
          return;
        }
        // Load answers
        const { data: rows } = await loadAnswers(id);
        const map = {};
        rows.forEach(r => {
          map[r.question_id] = {
            answer: r.answer,
            partial_text: r.partial_text,
            was_auto_suggested: r.was_auto_suggested
          };
        });
        setInitialAnswers(map);
        setScreen('wizard');
      };

      const handleInfoSubmit = async (name, contactNum) => {
        await updateCompany(companyId, { name, contact: contactNum });
        setCompanyName(name);
        setContact(contactNum);
        setInitialAnswers({});
        setScreen('wizard');
      };

      const handleSave = () => setScreen('saved');

      const handleSubmitFinal = async () => {
        const { error } = await lockCompany(companyId);
        if (error) { alert(T[lang].connectError); return; }
        setSubmittedAt(new Date().toISOString());
        setScreen('locked');
      };

      const handleBackToLogin = () => {
        setCompanyId(''); setCompanyName(''); setContact(''); setInitialAnswers({});
        setScreen('login');
      };

      switch (screen) {
        case 'login':
          return React.createElement(LoginScreen, { lang, setLang: setLangState, onLogin: handleLogin });
        case 'info':
          return React.createElement(CompanyInfoScreen, { lang, setLang: setLangState, companyId, onSubmit: handleInfoSubmit });
        case 'wizard':
          return React.createElement(WizardScreen, {
            lang, setLang, companyId, companyName,
            initialAnswers,
            onSave: handleSave,
            onSubmit: handleSubmitFinal
          });
        case 'locked':
          return React.createElement(LockedScreen, { lang, setLang, submittedAt, companyName });
        case 'saved':
          return React.createElement(SavedScreen, { lang, setLang, onBack: handleBackToLogin });
        default:
          return null;
      }
    }

    const root = createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
