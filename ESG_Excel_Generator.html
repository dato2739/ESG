  header p { font-size: 13px; opacity: 0.9; }

  .stat .value { font-size: 20px; font-weight: 700; color: #2F5496; }

  .controls input { flex: 1; min-width: 200px; padding: 10px 14px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 14px; }
  .controls button { padding: 10px 18px; background: #2F5496; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; }
  .controls button:hover { background: #1e3a6f; }
  .controls button.secondary { background: #16a34a; }
  .controls button.secondary:hover { background: #15803d; }
  .list { background: white; border-radius: 8px; border: 1px solid #e1e4e8; overflow: hidden; }
  table { width: 100%; border-collapse: collapse; }
  th { background: #f8fafc; padding: 12px 14px; text-align: left; font-size: 12px; font-weight: 600; color: #4b5563; text-transform: uppercase; border-bottom: 2px solid #e5e7eb; }
  td { padding: 12px 14px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
  tr:hover { background: #f8fafc; }
  .score { font-weight: 600; padding: 4px 10px; border-radius: 12px; display: inline-block; font-size: 12px; }
  .score.high { background: #dcfce7; color: #166534; }
  .score.mid { background: #fef3c7; color: #92400e; }
  .score.low { background: #fee2e2; color: #991b1b; }
  .btn-excel { padding: 7px 14px; background: #16a34a; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 12px; font-weight: 600; }
  .btn-excel:hover { background: #15803d; }
  .btn-excel:disabled { background: #9ca3af; cursor: not-allowed; }
  .loading { text-align: center; padding: 60px; color: #6b7684; }
  .error { background: #fee2e2; color: #991b1b; padding: 14px; border-radius: 6px; margin-bottom: 16px; }
  .success { background: #dcfce7; color: #166534; padding: 10px 14px; border-radius: 6px; margin-bottom: 10px; font-size: 13px; }

let companies = [];
let adminAnswers = {};  // {company_id: {q_1_1: 'yes', ...}}
let contractorAnswers = {};  // {company_id: {q_2_1: 'yes', ...}}

function showError(msg) {
  document.getElementById('error-box').innerHTML = `<div class="error">${msg}</div>`;
}
function showSuccess(msg) {
  const box = document.getElementById('success-box');
  box.innerHTML = `<div class="success">${msg}</div>`;
  setTimeout(() => box.innerHTML = '', 4000);
}

async function loadData() {
  try {
    // Load companies
    const { data: comps, error: ce } = await sb.from('esg_companies')
      .select('id, name, contact, is_locked, admin_completed')
      .order('name');
    if (ce) throw ce;
    companies = comps.filter(c => c.is_locked);

    // Load contractor answers
    const { data: cans, error: cae } = await sb.from('esg_answers')
      .select('company_id, question_id, answer');
    if (cae) throw cae;
    cans.forEach(a => {
      if (!contractorAnswers[a.company_id]) contractorAnswers[a.company_id] = {};
      contractorAnswers[a.company_id][a.question_id] = a.answer;
    });

    // Load admin answers
    const { data: aans, error: aae } = await sb.from('esg_admin_answers')
      .select('company_id, question_id, answer');
    if (aae) throw aae;
    aans.forEach(a => {
      if (!adminAnswers[a.company_id]) adminAnswers[a.company_id] = {};
      adminAnswers[a.company_id][a.question_id] = a.answer;
    });

    // Calculate scores
    companies.forEach(c => {
      c.score = calcScore(c.id);
    });

    updateStats();
    renderList();
  } catch (e) {
    showError('შეცდომა მონაცემების ჩატვირთვისას: ' + e.message);
  }
}

function calcScore(cid) {
  // Weights per question (from Excel)
  const weights = {
    q_1_1: 0.02, q_1_2: 0.02, q_1_3: 0.02, q_1_4: 0.02, q_1_5: 0.01, q_1_6: 0.02, q_1_7: 0.02,
    q_2_1: 0.02, q_2_2: 0.02, q_2_2_1: 0.01, q_2_3: 0.01, q_2_4: 0.02, q_2_5: 0.01, q_2_6: 0.01,
    q_2_7: 0.01, q_2_8: 0.01, q_2_9: 0.02, q_2_10: 0.01, q_2_11: 0.02, q_2_12: 0.01, q_2_13: 0.01,
    q_2_13_1: 0.01, q_2_13_2: 0.01, q_2_14: 0.02, q_2_14_1: 0.005, q_2_14_2: 0.005, q_2_15: 0.01,
    q_2_15_1: 0.01, q_2_15_2: 0.01,
    q_3_1: 0.02, q_3_1_1: 0.02, q_3_1_2: 0.005, q_3_1_3: 0.015, q_3_1_4: 0.015, q_3_2: 0.01,
    q_3_2_1: 0.02, q_3_2_2: 0.01, q_3_2_3: 0.005,
    q_4_1: 0.005, q_4_1_1: 0.0025, q_4_1_2: 0.0025, q_4_1_3: 0.0025, q_4_2: 0.0075, q_4_2_1: 0.0025,
    q_4_2_2: 0.0025, q_4_2_3: 0.0025, q_4_2_4: 0.0025, q_4_2_5: 0.01, q_4_3: 0.01, q_4_3_1: 0.005,
    q_4_3_2: 0.005, q_4_3_3: 0.0025, q_4_3_4: 0.005, q_4_3_5: 0.005, q_4_3_6: 0.01, q_4_4: 0.005,
    q_4_4_1: 0.005, q_4_4_2: 0.005, q_4_4_3: 0.0025, q_4_4_4: 0.01, q_4_4_5: 0.005, q_4_4_6: 0.005,
    q_5_1: 0.015, q_5_1_1: 0.005, q_5_1_2: 0.005, q_5_1_3: 0.005, q_5_2: 0.02, q_5_2_1: 0.01,
    q_5_2_2: 0.01, q_5_2_3: 0.01, q_5_2_4: 0.005, q_5_3: 0.01, q_5_3_1: 0.005, q_5_3_2: 0.005,
    q_5_3_3: 0.01, q_5_3_4: 0.005,
    q_6_1: 0.03, q_6_1_1: 0.01, q_6_1_2: 0.02, q_6_1_3: 0.02,
    q_7_1: 0.03, q_7_1_1: 0.02, q_7_1_2: 0.02, q_7_1_3: 0.01,
    q_8_1: 0.03, q_8_1_1: 0.03, q_8_1_2: 0.01, q_8_2: 0.01
  };
  let score = 0;
  Object.keys(weights).forEach(qid => {
    let ans;
    if (qid.startsWith('q_1_')) {
      ans = adminAnswers[cid]?.[qid] || 'no';
    } else {
      ans = contractorAnswers[cid]?.[qid] || 'no';
    }
    score += (VAL_MAP[ans] || 0) * weights[qid];
  });
  return score * 100;
}

function updateStats() {
  document.getElementById('total').textContent = companies.length;
  if (companies.length === 0) return;
  const scores = companies.map(c => c.score);
  const avg = scores.reduce((a, b) => a + b, 0) / scores.length;
  const sorted = [...companies].sort((a, b) => b.score - a.score);
  document.getElementById('avg').textContent = avg.toFixed(1) + '%';
  document.getElementById('top').textContent = sorted[0].score.toFixed(1) + '%';
  document.getElementById('bottom').textContent = sorted[sorted.length - 1].score.toFixed(1) + '%';
}

function scoreClass(s) {
  if (s >= 60) return 'high';
  if (s >= 45) return 'mid';
  return 'low';
}

function renderList() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = companies.filter(c =>
    c.name.toLowerCase().includes(q) || c.id.toString().includes(q)
  );
  const tbody = document.getElementById('tbody');
  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="6" class="loading">კონტრაქტორი არ მოიძებნა</td></tr>';
    return;
  }
  tbody.innerHTML = filtered.map((c, i) => `
    <tr>
      <td><input type="checkbox" class="checkbox select-row" data-id="${c.id}"></td>
      <td>${i + 1}</td>
      <td>${c.name}</td>
      <td style="font-family: monospace; font-size: 12px; color: #6b7684">${c.id}</td>
      <td><span class="score ${scoreClass(c.score)}">${c.score.toFixed(1)}%</span></td>
      <td><button class="btn-excel" onclick="downloadExcel('${c.id}')">⬇ Excel</button></td>
    </tr>
  `).join('');
}

function toggleAll() {
  const checked = document.getElementById('selectAll').checked;
  document.querySelectorAll('.select-row').forEach(cb => cb.checked = checked);
}

function b64ToArrayBuffer(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

function buildWorkbook(cid) {
  const company = companies.find(c => c.id == cid);
  if (!company) return null;

  const wb = XLSX.read(b64ToArrayBuffer(TEMPLATE_B64), { type: 'array', cellStyles: true, cellFormula: true });
  const sheetName = 'Supplier ESG audit form';
  const ws = wb.Sheets[sheetName];

  // Fill answers
  Object.entries(ROW_MAP).forEach(([row, qid]) => {
    const r = parseInt(row);
    let ans;
    if (qid.startsWith('q_1_')) {
      ans = adminAnswers[cid]?.[qid] || 'no';
    } else {
      ans = contractorAnswers[cid]?.[qid] || 'no';
    }
    const v = VAL_MAP[ans] || 0;
    const cellAddr = 'F' + r;
    ws[cellAddr] = { t: 'n', v: v };
  });

  // Add total row at R105
  ws['A105'] = { t: 's', v: 'სრული ქულა (ჯამი)' };
  ws['F105'] = { t: 'n', f: 'F9+F33+F44+F70+F86+F92+F98+F104' };
  ws['A106'] = { t: 's', v: 'პროცენტებში (%)' };
  ws['F106'] = { t: 'n', f: 'F105*100' };
  ws['A108'] = { t: 's', v: 'კონტრაქტორი:' };
  ws['B108'] = { t: 's', v: company.name };
  ws['A109'] = { t: 's', v: 'ID:' };
  ws['B109'] = { t: 's', v: company.id.toString() };
  ws['A110'] = { t: 's', v: 'კონტაქტი:' };
  ws['B110'] = { t: 's', v: company.contact || '' };
  ws['A111'] = { t: 's', v: 'საერთო ქულა:' };
  ws['B111'] = { t: 's', v: company.score.toFixed(2) + '%' };

  // Update ref range
  const range = XLSX.utils.decode_range(ws['!ref'] || 'A1:F104');
  range.e.r = Math.max(range.e.r, 110);
  range.e.c = Math.max(range.e.c, 5);
  ws['!ref'] = XLSX.utils.encode_range(range);

  return wb;
}

function downloadExcel(cid) {
  try {
    const wb = buildWorkbook(cid);
    if (!wb) { showError('კონტრაქტორი ვერ მოიძებნა'); return; }
    const company = companies.find(c => c.id == cid);
    const safeName = company.name.replace(/[\\\/\*\?\[\]:]/g, '_');
    XLSX.writeFile(wb, `ESG_${safeName}.xlsx`, { bookType: 'xlsx', cellStyles: true });
    showSuccess(`✓ ${company.name} — Excel ჩამოტვირთული`);
  } catch (e) {
    showError('შეცდომა: ' + e.message);
  }
}

async function downloadAll() {
  const checked = Array.from(document.querySelectorAll('.select-row:checked')).map(cb => cb.dataset.id);
  const targets = checked.length > 0 ? checked : companies.map(c => c.id);
  if (!confirm(`${targets.length} Excel ფაილი დაჩამოტვირთა თითო-თითოდ. გავაგრძელოთ?`)) return;
  for (let i = 0; i < targets.length; i++) {
    await new Promise(r => setTimeout(r, 300));
    downloadExcel(targets[i]);
  }
}

loadData();
