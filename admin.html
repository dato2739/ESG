    function getSectionIndex(qid) {
      for (let i = 0; i < SECTION_PREFIXES.length; i++) {
        if (qid.startsWith(SECTION_PREFIXES[i])) return i;
      }
      return -1;
    }

    // Helper: escape HTML
    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // ============================================
    // DATA LOADING
    // ============================================
    async function loadAllCompanies() {
      const { data, error } = await supabase
        .from('esg_companies')
        .select('*')
        .order('created_at', { ascending: false });
      if (error) console.error('Load companies error:', error);
      return data || [];
    }

    async function loadCompanyAnswers(companyId) {
      const { data, error } = await supabase
        .from('esg_answers')
        .select('*')
        .eq('company_id', companyId);
      if (error) console.error('Load answers error:', error);
      return data || [];
    }

    async function deleteCompany(companyId) {
      // Need to delete answers first (FK constraint)
      const { error: ansErr } = await supabase
        .from('esg_answers')
        .delete()
        .eq('company_id', companyId);
      if (ansErr) {
        console.error('Delete answers error:', ansErr);
        return { error: ansErr };
      }
      // Also try admin_answers if any
      await supabase.from('esg_admin_answers').delete().eq('company_id', companyId);
      // Need to unlock first if locked, because RLS prevents updating locked companies
      // Use a workaround: directly delete (RLS may need to allow this)
      const { error: compErr } = await supabase
        .from('esg_companies')
        .delete()
        .eq('id', companyId);
      if (compErr) {
        console.error('Delete company error:', compErr);
        return { error: compErr };
      }
      return { success: true };
    }

    // Unlock a company so it can be edited again
    // Also archive current answers to history table (preserves previous version)
    async function unlockCompany(companyId) {
      // Step 1: Get current contractor answers
      const { data: currentAnswers, error: loadErr } = await supabase
        .from('esg_answers')
        .select('*')
        .eq('company_id', companyId);
      if (loadErr) return { error: loadErr };

      // Step 1b: Get current admin answers (v8)
      const { data: currentAdmin } = await supabase
        .from('esg_admin_answers')
        .select('*')
        .eq('company_id', companyId);

      // Step 2: Get submitted_at from company
      const { data: companyData } = await supabase
        .from('esg_companies')
        .select('submitted_at')
        .eq('id', companyId)
        .single();
      const submittedAt = companyData ? companyData.submitted_at : null;

      // Step 3a: Delete existing contractor history
      await supabase
        .from('esg_answers_history')
        .delete()
        .eq('company_id', companyId);

      // Step 3b: Delete existing admin history
      await supabase
        .from('esg_admin_answers_history')
        .delete()
        .eq('company_id', companyId);

      // Step 4a: Insert current contractor answers into history
      if (currentAnswers && currentAnswers.length > 0) {
        const historyRows = currentAnswers.map(a => ({
          company_id: a.company_id,
          question_id: a.question_id,
          answer: a.answer,
          partial_text: a.partial_text,
          was_auto_suggested: a.was_auto_suggested,
          submitted_at: submittedAt
        }));
        const { error: insErr } = await supabase
          .from('esg_answers_history')
          .insert(historyRows);
        if (insErr) console.error('History insert error:', insErr);
      }

      // Step 4b: Insert current admin answers into history (v8)
      if (currentAdmin && currentAdmin.length > 0) {
        const adminHistoryRows = currentAdmin.map(a => ({
          company_id: a.company_id,
          question_id: a.question_id,
          answer: a.answer,
          partial_text: a.partial_text
        }));
        const { error: adminInsErr } = await supabase
          .from('esg_admin_answers_history')
          .insert(adminHistoryRows);
        if (adminInsErr) console.error('Admin history insert error:', adminInsErr);
      }

      // Step 4c: Delete current admin answers (will be re-created as defaults when opened)
      await supabase
        .from('esg_admin_answers')
        .delete()
        .eq('company_id', companyId);

      // Step 5: Unlock the company
      const { error } = await supabase
        .from('esg_companies')
        .update({ is_locked: false, submitted_at: null })
        .eq('id', companyId);
      return { error };
    }

    // Ensure default admin answers exist (all "no") — called when opening a company's detail view
    async function ensureAdminDefaults(companyId) {
      const { data: existing } = await loadAdminAnswers(companyId);
      const existingIds = new Set((existing || []).map(a => a.question_id));
      const missing = ADMIN_QUESTION_IDS.filter(qid => !existingIds.has(qid));
      if (missing.length === 0) return existing || [];
      const rows = missing.map(qid => ({
        company_id: companyId,
        question_id: qid,
        answer: 'no'
      }));
      const { error } = await supabase.from('esg_admin_answers').insert(rows);
      if (error) console.error('Admin defaults insert error:', error);
      // Reload
      const { data: fresh } = await loadAdminAnswers(companyId);
      return fresh || [];
    }

    async function saveAdminAnswer(companyId, questionId, answer) {
      const { error } = await supabase
        .from('esg_admin_answers')
        .upsert({
          company_id: companyId,
          question_id: questionId,
          answer,
          updated_at: new Date().toISOString()
        }, { onConflict: 'company_id,question_id' });
      return { error };
    }

    // ============================================
    // CATEGORY MANAGEMENT (Supabase-backed)
    // ============================================
    async function loadCategoriesFromDb() {
      const { data, error } = await supabase
        .from('esg_question_categories')
        .select('*');
      if (error) {
        console.error('Load categories error:', error);
        return null;
      }
      if (!data || data.length === 0) return null;
      const map = {};
      data.forEach(r => { map[r.question_id] = r.category; });
      return map;
    }

    async function saveCategoriesToDb(categoryMap) {
      // Upsert all entries
      const rows = Object.entries(categoryMap).map(([qid, cat]) => ({
        question_id: qid,
        category: cat,
        updated_at: new Date().toISOString()
      }));
      const { error } = await supabase
        .from('esg_question_categories')
        .upsert(rows, { onConflict: 'question_id' });
      return { error };
    }

    async function resetCategoriesToDefault() {
      // Delete all category rows from DB
      const { error } = await supabase
        .from('esg_question_categories')
        .delete()
        .neq('question_id', '___nonexistent___');
      if (!error) {
        CATEGORY_MAP = buildDefaultCategoryMap();
      }
      return { error };
    }

    async function initCategoryMap(allQuestionIds) {
      const fromDb = await loadCategoriesFromDb();
      if (fromDb) {
        CATEGORY_MAP = fromDb;
      } else {
        CATEGORY_MAP = buildDefaultCategoryMap();
      }
      // Ensure ALL questions have a category (default to 2 if missing)
      allQuestionIds.forEach(qid => {
        if (!CATEGORY_MAP[qid]) CATEGORY_MAP[qid] = 2;
      });
      return CATEGORY_MAP;
    }

    // Calculate stats from answers array
    function calcStats(answers) {
      const total = answers.length;
      const yes = answers.filter(a => a.answer === 'yes').length;
      const no = answers.filter(a => a.answer === 'no').length;
      const partial = answers.filter(a => a.answer === 'partial').length;
      const score = total > 0 ? Math.round(((yes + partial * 0.5) / total) * 100) : 0;
      return { total, yes, no, partial, score };
    }

    // Calculate per-section stats
    function calcSectionStats(answers) {
      const sections = SECTION_PREFIXES.map(() => ({ yes: 0, no: 0, partial: 0, total: 0 }));
      answers.forEach(a => {
        const idx = getSectionIndex(a.question_id);
        if (idx === -1) return;
        sections[idx].total++;
        if (a.answer === 'yes') sections[idx].yes++;
        else if (a.answer === 'no') sections[idx].no++;
        else if (a.answer === 'partial') sections[idx].partial++;
      });
      return sections.map(s => ({
        ...s,
        score: s.total > 0 ? Math.round(((s.yes + s.partial * 0.5) / s.total) * 100) : 0
      }));
    }

    // ============================================
    // WEIGHTED SCORING (v8) — based on Excel weights
    // ============================================
    let QUESTION_WEIGHTS = {}; // { qid: weight } — loaded from DB

    async function loadWeights() {
      const { data, error } = await supabase
        .from('esg_question_weights')
        .select('*');
      if (error || !data) return {};
      const map = {};
      data.forEach(w => { map[w.question_id] = { weight: parseFloat(w.weight), isAdmin: w.is_admin }; });
      QUESTION_WEIGHTS = map;
      return map;
    }

    function answerValue(ans) {
      if (ans === 'yes') return 1.0;
      if (ans === 'partial') return 0.5;
      return 0.0; // 'no' or missing
    }

    // Section max weights (must match Excel sums)
    const SECTION_MAX_WEIGHTS = {
      1: 0.13, // general/commercial (admin)
      2: 0.27, // Quality
      3: 0.12, // Human Rights
      4: 0.12, // Labour
      5: 0.12, // Environment
      6: 0.08, // Anti-Corruption
      7: 0.08, // H&S
      8: 0.08  // Climate
    };

    // Compute weighted score for a set of answers
    // Returns: { score: 0..100, weightedSum: 0..maxWeight, maxWeight: 0..1 }
    function calcWeightedScore(answers) {
      let sum = 0;
      let maxW = 0;
      answers.forEach(a => {
        const info = QUESTION_WEIGHTS[a.question_id];
        if (!info) return;
        sum += info.weight * answerValue(a.answer);
        maxW += info.weight;
      });
      const score = maxW > 0 ? Math.round((sum / maxW) * 1000) / 10 : 0;
      return { score, weightedSum: Math.round(sum * 1000) / 10, maxWeight: Math.round(maxW * 1000) / 10 };
    }

    // Calculate per-section weighted stats (for all 8 sections: 1=admin, 2-8=contractor)
    // v8b: iterate over ALL expected question IDs (from CONTRACTOR_QIDS_BY_SECTION), 
    // treating missing DB entries as "no"
    function calcWeightedSectionStats(contractorAnswers, adminAnswers) {
      const stats = {};
      const byQid = {};
      (contractorAnswers || []).forEach(a => { byQid[a.question_id] = a.answer; });
      // Contractor sections (2-8)
      for (let sec = 2; sec <= 8; sec++) {
        const expectedIds = (typeof CONTRACTOR_QIDS_BY_SECTION !== 'undefined' && CONTRACTOR_QIDS_BY_SECTION[sec]) 
          ? CONTRACTOR_QIDS_BY_SECTION[sec] 
          : (contractorAnswers || []).filter(a => {
              const p = a.question_id.split('_');
              return p.length >= 2 && parseInt(p[1]) === sec;
            }).map(a => a.question_id);
        let sum = 0;
        expectedIds.forEach(qid => {
          const info = QUESTION_WEIGHTS[qid];
          if (!info) return;
          const ans = byQid[qid] || 'no'; // missing = no
          sum += info.weight * answerValue(ans);
        });
        const maxW = SECTION_MAX_WEIGHTS[sec];
        stats[sec] = {
          weightedSum: Math.round(sum * 1000) / 10,
          maxWeight: maxW * 100,
          score: maxW > 0 ? Math.round((sum / maxW) * 1000) / 10 : 0,
          questionCount: expectedIds.length
        };
      }
      // Admin section (1)
      let adminSum = 0;
      const adminByQid = {};
      (adminAnswers || []).forEach(a => { adminByQid[a.question_id] = a.answer; });
      const adminExpected = (typeof ADMIN_QUESTION_IDS !== 'undefined') ? ADMIN_QUESTION_IDS : [];
      adminExpected.forEach(qid => {
        const info = QUESTION_WEIGHTS[qid];
        if (!info) return;
        const ans = adminByQid[qid] || 'no';
        adminSum += info.weight * answerValue(ans);
      });
      stats[1] = {
        weightedSum: Math.round(adminSum * 1000) / 10,
        maxWeight: SECTION_MAX_WEIGHTS[1] * 100,
        score: SECTION_MAX_WEIGHTS[1] > 0 ? Math.round((adminSum / SECTION_MAX_WEIGHTS[1]) * 1000) / 10 : 0,
        questionCount: adminExpected.length
      };
      // Overall score = sum of all weighted contributions × 100
      let overallSum = 0;
      for (let sec = 1; sec <= 8; sec++) {
        overallSum += stats[sec].weightedSum;
      }
      stats.overall = {
        weightedSum: Math.round(overallSum * 10) / 10,
        maxWeight: 100,
        score: Math.round(overallSum * 10) / 10
      };
      return stats;
    }

    // Shows partial_text with optional translation button when lang=en
    // Uses MyMemory API (free, no key required, ~1000 requests/day)
    function TranslatableText({ text, lang }) {
      const [translation, setTranslation] = useState(null);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState('');

      const shouldOfferTranslation = lang === 'en' && text && text.trim();

      const doTranslate = async () => {
        if (loading || translation) return;
        setLoading(true);
        setError('');
        try {
          // MyMemory API — auto-detect source language
          const url = 'https://api.mymemory.translated.net/get?q=' + encodeURIComponent(text.trim()) + '&langpair=ka|en';
          const res = await fetch(url);
          const data = await res.json();
          if (data && data.responseData && data.responseData.translatedText) {
            setTranslation(data.responseData.translatedText);
          } else {
            setError('Translation unavailable');
          }
        } catch (e) {
          console.error('Translation error:', e);
          setError('Translation failed');
        } finally {
          setLoading(false);
        }
      };

      const clearTranslation = () => {
        setTranslation(null);
        setError('');
      };

      return React.createElement('div', null,
        React.createElement('div', {
          className: 'text-[13px] text-stone-800 leading-relaxed whitespace-pre-wrap break-words'
        }, text),
        shouldOfferTranslation ? React.createElement('div', { className: 'mt-2' },
          !translation && !loading ? React.createElement('button', {

    // Common helper: render container to PDF
    async function renderContainerToPdf(container, filename) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF({ unit: 'mm', format: 'a4' });
      try {
        await new Promise(r => setTimeout(r, 800));
        const canvas = await html2canvas(container, {
          scale: 2, useCORS: true, allowTaint: true, backgroundColor: '#ffffff',
          logging: false, windowWidth: 794, imageTimeout: 5000
        });
        const imgWidth = 210, pageHeight = 297;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        let heightLeft = imgHeight, position = 0;
        const imgData = canvas.toDataURL('image/jpeg', 0.92);
        doc.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
        while (heightLeft > 0) {
          position = heightLeft - imgHeight;
          doc.addPage();
          doc.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
          heightLeft -= pageHeight;
        }
        doc.save(filename);
      } finally {
        document.body.removeChild(container);
      }
    }

    function AnalysisSection({ companies, allAnswersByCompany, lang }) {
      const [filterCat, setFilterCat] = useState('all'); // 'all' | '1' | '2' | '3'
      const [filterAns, setFilterAns] = useState('all'); // 'all' | 'yes' | 'partial' | 'no'
      const [showEmailFor, setShowEmailFor] = useState(null); // { company, matchingAnswers, template }
      const [emailCopied, setEmailCopied] = useState(false);

      // Compute matching companies with their matching answers
      const results = useMemo(() => {
        const submittedCompanies = companies.filter(c => c.is_locked);
        const out = [];
        submittedCompanies.forEach(c => {
          const answers = allAnswersByCompany[c.id] || [];
          const matches = answers.filter(a => {
            // Category filter
            if (filterCat !== 'all') {
              const cat = getCategory(a.question_id);
              if (cat !== parseInt(filterCat)) return false;
            }
            // Answer filter
            if (filterAns !== 'all') {
              if (a.answer !== filterAns) return false;
            }
            return true;
          });
          if (matches.length > 0) {
            matches.sort((a, b) => a.question_id.localeCompare(b.question_id));
            out.push({ company: c, matches });
          }
        });
        // Sort by match count descending
        out.sort((a, b) => b.matches.length - a.matches.length);
        return out;
      }, [companies, allAnswersByCompany, filterCat, filterAns]);

      // Determine which email template to use
      const pickEmailBuilder = (matches) => {
        // If ALL matches are Cat 3 (regardless of answer) → Cat 3 template
        const allCat3 = matches.every(m => getCategory(m.question_id) === 3);
        // If ALL matches are Cat 1 with "no" answer → Cat 1 review template
        const allCat1No = matches.every(m => getCategory(m.question_id) === 1 && m.answer === 'no');
        if (allCat1No) return { fn: buildCat1ReviewEmail, label: T[lang].genCat1EmailBtn };
        if (allCat3) return { fn: buildCat3DocumentEmail, label: T[lang].genCat3EmailBtn };
        return { fn: buildGenericEmail, label: T[lang].genGenericEmailBtn };

      const openEmail = (companyEntry) => {

        setEmailCopied(false);

        setShowEmailFor(null);

                  filterCat === opt.v

                        React.createElement('div', { className: 'space-y-0.5' },

    // ============================================
    // v10: PRIORITY LISTS SECTION (three targeted tables)
    // ============================================
    function PrioritySection({ companies, allAnswersByCompany, allAdminAnswersByCompany, lang }) {
      const [showEmailFor, setShowEmailFor] = useState(null);
      const [emailCopied, setEmailCopied] = useState(false);
      const [subTab, setSubTab] = useState('green'); // 'green' | 'yellow' | 'red'

      // Compute all tables in one useMemo (avoid recomputation)
      const data = useMemo(() => {
        const submittedCompanies = companies.filter(c => c.is_locked);

        // Table 1 (GREEN): Low-score (<30%) companies + Cat 1 "no" answers
        const table1 = [];
        // Table 2 (RED): High-score (>60%) companies + Cat 3 "yes" answers
        const table2 = [];
        // Table Y (YELLOW): all companies + Cat 2 "yes"/"partial" answers
        const tableYellow = [];

        submittedCompanies.forEach(c => {
          const answers = allAnswersByCompany[c.id] || [];
          const adminAns = (allAdminAnswersByCompany || {})[c.id] || [];
          const wStats = calcWeightedSectionStats(answers, adminAns);
          const score = wStats.overall.score;

          // Table 1: score < 30% + Cat 1 "no"
          if (score < 30) {
            const cat1NoAnswers = answers.filter(a => {
              const cat = getCategory(a.question_id);
              return cat === 1 && a.answer === 'no';
            });
            if (cat1NoAnswers.length > 0) {
              cat1NoAnswers.sort((a, b) => a.question_id.localeCompare(b.question_id));
              table1.push({ company: c, score, matches: cat1NoAnswers });
            }
          }

          // Table 2: score > 60% + Cat 3 "yes"
          if (score > 60) {
            const cat3YesAnswers = answers.filter(a => {
              const cat = getCategory(a.question_id);
              return cat === 3 && a.answer === 'yes';
            });
            if (cat3YesAnswers.length > 0) {
              cat3YesAnswers.sort((a, b) => a.question_id.localeCompare(b.question_id));
              table2.push({ company: c, score, matches: cat3YesAnswers });
            }
          }
        });

        // Sort table 1 by score ascending (lowest first)
        table1.sort((a, b) => a.score - b.score);
        // Sort table 2 by score descending (highest first)
        table2.sort((a, b) => b.score - a.score);

        // Table 3: Cat 3 questions × companies with "yes" — grouped by question
        const table3Map = {}; // qid → { question, weight, companies: [{name, id, score}] }
        submittedCompanies.forEach(c => {
          const answers = allAnswersByCompany[c.id] || [];
          const adminAns = (allAdminAnswersByCompany || {})[c.id] || [];
          const wStats = calcWeightedSectionStats(answers, adminAns);
          const score = wStats.overall.score;
          answers.forEach(a => {
            if (getCategory(a.question_id) === 3 && a.answer === 'yes') {
              if (!table3Map[a.question_id]) {
                const winfo = QUESTION_WEIGHTS[a.question_id];
                table3Map[a.question_id] = {
                  qid: a.question_id,
                  weight: winfo ? winfo.weight * 100 : 0,
                  companies: []
                };
              }
              table3Map[a.question_id].companies.push({
                id: c.id,
                name: c.name || '—',
                score
              });
            }
          });
        });
        // Sort each group's companies by score descending
        Object.values(table3Map).forEach(g => g.companies.sort((a, b) => b.score - a.score));
        // Sort questions by qid
        const table3 = Object.values(table3Map).sort((a, b) => a.qid.localeCompare(b.qid));

        // Table Yellow: all companies + Cat 2 "yes"/"partial"
        submittedCompanies.forEach(c => {
          const answers = allAnswersByCompany[c.id] || [];
          const adminAns = (allAdminAnswersByCompany || {})[c.id] || [];
          const wStats = calcWeightedSectionStats(answers, adminAns);
          const score = wStats.overall.score;
          const cat2Answers = answers.filter(a => {
            const cat = getCategory(a.question_id);
            return cat === 2 && (a.answer === 'yes' || a.answer === 'partial');
          });
          if (cat2Answers.length > 0) {
            cat2Answers.sort((a, b) => a.question_id.localeCompare(b.question_id));
            tableYellow.push({ company: c, score, matches: cat2Answers });
          }
        });
        // Sort yellow by match count descending
        tableYellow.sort((a, b) => b.matches.length - a.matches.length);

        return { table1, table2, table3, tableYellow };
      }, [companies, allAnswersByCompany, allAdminAnswersByCompany]);

      // Email generation: pick template based on table type
      const openEmail = (company, matches, tableType) => {
        let emailText;
        if (tableType === 'cat1_no') {
          emailText = buildCat1ReviewEmail(company, matches, lang);
        } else if (tableType === 'cat3_yes') {
          emailText = buildCat3DocumentEmail(company, matches, lang);
        } else {
          emailText = buildGenericEmail(company, matches, lang);
        }
        setShowEmailFor({ company, matches, emailText });
        setEmailCopied(false);
      };

      const copyEmail = () => {
        if (!showEmailFor) return;
        navigator.clipboard.writeText(showEmailFor.emailText).then(() => {
          setEmailCopied(true);
          setTimeout(() => setEmailCopied(false), 2000);
        });
      };

      // Question row (used inside company row)
      const renderQuestionInline = (a) => {
        const qText = QUESTIONS[a.question_id] ? QUESTIONS[a.question_id][lang] : a.question_id;
        const winfo = QUESTION_WEIGHTS[a.question_id];
        const wPct = winfo ? winfo.weight * 100 : 0;
        return React.createElement('div', {
          key: a.question_id,
          className: 'flex items-start gap-2 py-1'
        },
          React.createElement('span', {
            className: 'text-[10px] text-stone-400 font-mono min-w-[52px] flex-shrink-0 pt-0.5'
          }, a.question_id),
          React.createElement('span', {
            className: 'text-[11px] text-stone-500 tabular-nums min-w-[42px] flex-shrink-0 pt-0.5'
          }, wPct.toFixed(2) + '%'),
          React.createElement('span', {
            className: 'text-[12px] text-stone-800 leading-snug flex-1'
          }, qText)
        );
      };

      const totalMatches1 = data.table1.reduce((s, r) => s + r.matches.length, 0);
      const totalMatches2 = data.table2.reduce((s, r) => s + r.matches.length, 0);
      const totalMatches3 = data.table3.reduce((s, r) => s + r.companies.length, 0);
      const totalMatchesYellow = data.tableYellow.reduce((s, r) => s + r.matches.length, 0);

      // Sub-tab button
      const subTabBtn = (key, label, color, count) => React.createElement('button', {
        key,
        onClick: () => setSubTab(key),
        className: 'px-4 py-2 text-sm font-medium border-b-2 transition ' + (
          subTab === key
            ? (color === 'green' ? 'border-emerald-500 text-emerald-700' :
               color === 'yellow' ? 'border-amber-500 text-amber-700' :
               'border-rose-500 text-rose-700')
            : 'border-transparent text-stone-500 hover:text-stone-900'
        )
      },
        React.createElement('span', null, label),
        React.createElement('span', {
          className: 'ml-2 inline-flex items-center justify-center min-w-[22px] h-[18px] text-[10px] font-semibold rounded-full ' + (
            subTab === key
              ? (color === 'green' ? 'bg-emerald-100 text-emerald-700' :
                 color === 'yellow' ? 'bg-amber-100 text-amber-700' :
                 'bg-rose-100 text-rose-700')
              : 'bg-stone-100 text-stone-500'
          )
        }, count)
      );

      return React.createElement('div', { className: 'space-y-6' },
        // Header
        React.createElement('div', null,
          React.createElement('h2', { className: 'text-xl font-semibold text-stone-900 mb-1' }, T[lang].priorityTitle),
          React.createElement('p', { className: 'text-sm text-stone-500' }, T[lang].prioritySubtitle)
        ),

        // Sub-tabs
        React.createElement('div', {
          className: 'flex items-center gap-2 border-b border-stone-200'

    // ============================================
    // CATEGORIES MANAGEMENT SCREEN
    // ============================================
    function CategoriesScreen({ companies, allAnswersByCompany, allAdminAnswersByCompany, lang }) {
      // Local state: copy of CATEGORY_MAP for editing
      const [localMap, setLocalMap] = useState({ ...CATEGORY_MAP });
      const [savedMap, setSavedMap] = useState({ ...CATEGORY_MAP });
      const [saving, setSaving] = useState(false);
      const [saved, setSaved] = useState(false);
      const [confirmReset, setConfirmReset] = useState(false);
      const [resetting, setResetting] = useState(false);
      const [resetPassword, setResetPassword] = useState('');
      const [resetPasswordError, setResetPasswordError] = useState('');
      const [companiesPopup, setCompaniesPopup] = useState(null); // { qid, answer, list[] }
      const [draggedQid, setDraggedQid] = useState(null);
      const [dragOverCat, setDragOverCat] = useState(null);

      const allQids = Object.keys(QUESTIONS).sort();

      // Compute stats per question
      const questionStats = useMemo(() => {
        const stats = {};
        allQids.forEach(qid => {
          stats[qid] = { yes: [], no: [], partial: [] };
        });
        // Only count submitted (locked) companies
        const submittedCompanies = companies.filter(c => c.is_locked);
        submittedCompanies.forEach(c => {
          const ans = allAnswersByCompany[c.id] || [];
          ans.forEach(a => {
            if (stats[a.question_id]) {
              if (a.answer === 'yes') stats[a.question_id].yes.push(c);
              else if (a.answer === 'no') stats[a.question_id].no.push(c);
              else if (a.answer === 'partial') stats[a.question_id].partial.push(c);
            }
          });
        });
        return stats;
      }, [companies, allAnswersByCompany]);

      // Group questions by current local category
      const grouped = useMemo(() => {
        const g = { 1: [], 2: [], 3: [] };
        allQids.forEach(qid => {
          const cat = localMap[qid] || 2;
          g[cat].push(qid);
        });
        return g;
      }, [localMap]);

      const hasChanges = JSON.stringify(localMap) !== JSON.stringify(savedMap);

      const handleDragStart = (qid) => setDraggedQid(qid);
      const handleDragEnd = () => { setDraggedQid(null); setDragOverCat(null); };
      const handleDragOver = (e, cat) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        setDragOverCat(cat);
      };
      const handleDragLeave = (e) => {
        // only clear if actually leaving (not entering child)
        if (e.currentTarget.contains(e.relatedTarget)) return;
        setDragOverCat(null);
      };
      const handleDrop = (e, cat) => {
        e.preventDefault();
        if (draggedQid && localMap[draggedQid] !== cat) {
          setLocalMap({ ...localMap, [draggedQid]: cat });
        }
        setDraggedQid(null);
        setDragOverCat(null);
      };

      const handleSave = async () => {
        setSaving(true);
        const { error } = await saveCategoriesToDb(localMap);
        setSaving(false);
        if (error) {
          alert(T[lang].catsSaveFailed + (error.message || error.code || 'unknown'));
          return;
        }
        // Update global CATEGORY_MAP
        CATEGORY_MAP = { ...localMap };
        setSavedMap({ ...localMap });
        setSaved(true);
        setTimeout(() => setSaved(false), 2500);
      };

      const handleReset = async () => {
        // Password check — reset is destructive
        if (resetPassword !== ADMIN_PASSWORD) {
          setResetPasswordError(T[lang].wrongPassword);
          return;
        }
        setResetPasswordError('');
        setResetting(true);
        const { error } = await resetCategoriesToDefault();
        setResetting(false);
        if (error) {
          alert(T[lang].catsSaveFailed + (error.message || error.code || 'unknown'));
          return;
        }
        const defaults = buildDefaultCategoryMap();
        allQids.forEach(qid => { if (!defaults[qid]) defaults[qid] = 2; });
        CATEGORY_MAP = { ...defaults };
        setLocalMap({ ...defaults });
        setSavedMap({ ...defaults });
        setConfirmReset(false);
        setResetPassword('');
      };

      const closeResetModal = () => {
        if (resetting) return;
        setConfirmReset(false);
        setResetPassword('');
        setResetPasswordError('');
      };

      const renderColumn = (cat) => {
        const titles = { 1: T[lang].cat1Title, 2: T[lang].cat2Title, 3: T[lang].cat3Title };
        const descs = { 1: T[lang].cat1Desc, 2: T[lang].cat2Desc, 3: T[lang].cat3Desc };
        const color = getCategoryColor(cat);
        const isDropTarget = dragOverCat === cat;
        const list = grouped[cat];
        return React.createElement('div', {
          key: cat,
          onDragOver: (e) => handleDragOver(e, cat),
          onDragLeave: handleDragLeave,
          onDrop: (e) => handleDrop(e, cat),
          className: `rounded-xl border-2 ${isDropTarget ? 'border-blue-400 bg-blue-50' : color.border + ' ' + color.bg} p-3 transition`,
          style: { minHeight: '300px' }
        },
          // Header
          React.createElement('div', { className: 'mb-3 px-2' },
            React.createElement('div', { className: 'flex items-center justify-between mb-1' },
              React.createElement('h3', { className: `text-sm font-semibold ${color.text}` }, titles[cat]),
              React.createElement('span', {
                className: `text-[11px] font-bold rounded-full px-2 py-0.5 bg-white ${color.text} border ${color.border}`
              }, list.length)
            ),
            React.createElement('p', { className: 'text-[11px] text-stone-500' }, descs[cat])
          ),
          // Questions list
          React.createElement('div', { className: 'space-y-1.5' },
            list.length === 0
              ? React.createElement('div', { className: 'text-center py-6 text-xs text-stone-400 italic' }, '—')
              : list.map(qid => {
                  const qText = QUESTIONS[qid] ? QUESTIONS[qid][lang] : qid;
                  const s = questionStats[qid] || { yes: [], no: [], partial: [] };
                  const isDragging = draggedQid === qid;
                  const sIdx = getSectionIndex(qid);
                  const sName = sIdx >= 0 ? SECTION_NAMES[lang][sIdx] : '';
                  return React.createElement('div', {
                    key: qid,
                    draggable: true,
                    onDragStart: () => handleDragStart(qid),
                    onDragEnd: handleDragEnd,
                    className: `bg-white border border-stone-200 rounded-lg p-2.5 cursor-move hover:shadow-sm hover:border-blue-300 transition ${isDragging ? 'opacity-40' : ''}`
                  },
                    React.createElement('div', { className: 'flex items-start gap-2 mb-1.5' },

                      React.createElement('div', { className: 'flex-1 min-w-0' },
                        React.createElement('div', { className: 'text-[10px] font-bold text-blue-700 uppercase tracking-wide mb-1' }, sName),
                        React.createElement('div', { className: 'text-[12px] text-stone-800 leading-snug' }, qText),

                      )
                    ),
                    // Mini stats

                      React.createElement('button', {
                        onClick: (e) => { e.stopPropagation(); if (s.partial.length > 0) setCompaniesPopup({ qid, qText, answer: 'partial', list: s.partial }); },
                        disabled: s.partial.length === 0,
                        className: 'flex items-center gap-1 px-1.5 py-0.5 bg-amber-50 border border-amber-200 text-amber-700 rounded hover:bg-amber-100 transition disabled:opacity-40 disabled:cursor-default'
                      },
                        React.createElement('span', { className: 'font-medium' }, '◐'),
                        React.createElement('span', { className: 'font-semibold' }, s.partial.length)
                      ),
                      React.createElement('button', {
                        onClick: (e) => { e.stopPropagation(); if (s.no.length > 0) setCompaniesPopup({ qid, qText, answer: 'no', list: s.no }); },
                        disabled: s.no.length === 0,
                        className: 'flex items-center gap-1 px-1.5 py-0.5 bg-rose-50 border border-rose-200 text-rose-700 rounded hover:bg-rose-100 transition disabled:opacity-40 disabled:cursor-default'
                      },
                        React.createElement('span', { className: 'font-medium' }, '✗'),
                        React.createElement('span', { className: 'font-semibold' }, s.no.length)
                      )
                    )
                  );
                })
          )
        );
      };

      return React.createElement('div', { className: 'fade-in' },
        // Header
        React.createElement('div', { className: 'flex flex-wrap items-start justify-between gap-3 mb-5' },
          React.createElement('div', null,
            React.createElement('h1', { className: 'text-xl font-semibold text-stone-900' }, T[lang].catsPageTitle),
            React.createElement('p', { className: 'text-sm text-stone-500 mt-1 max-w-2xl' }, T[lang].catsPageSubtitle)
          ),
          React.createElement('div', { className: 'flex flex-wrap gap-2 items-center' },
            hasChanges && !saved ? React.createElement('span', {
              className: 'text-xs px-2 py-1 bg-amber-50 text-amber-700 border border-amber-200 rounded-md'
            }, '● ' + T[lang].catsHasChanges) : null,
            React.createElement('button', {
              onClick: () => setConfirmReset(true),
              className: 'h-10 px-4 text-sm font-medium text-stone-700 border border-stone-300 hover:bg-stone-50 rounded-lg transition'
            }, T[lang].catsReset),
            React.createElement('button', {
              onClick: handleSave,
              disabled: !hasChanges || saving,
              className: 'h-10 px-5 text-sm font-medium text-white rounded-lg shadow-sm hover:shadow disabled:opacity-50 transition',
              style: { background: saved ? '#059669' : 'linear-gradient(135deg, #0E5BA8, #1976D2)' }
            }, saving ? '...' : (saved ? T[lang].catsSaved : T[lang].catsSave))
          )
        ),

        // Three columns
        React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-4' },
          renderColumn(1),
          renderColumn(2),
          renderColumn(3)
        ),

        // Companies popup
        companiesPopup ? React.createElement('div', {
          className: 'fixed inset-0 bg-black/50 flex items-center justify-center px-4 py-6 z-50 fade-in',
          onClick: () => setCompaniesPopup(null)
        },
          React.createElement('div', {
            className: 'bg-white rounded-2xl max-w-lg w-full max-h-[calc(100vh-100px)] shadow-2xl overflow-hidden flex flex-col',
            onClick: e => e.stopPropagation()
          },
            React.createElement('div', {
              className: 'flex items-center justify-between px-5 py-4 border-b border-stone-100',
              style: { background: 'linear-gradient(135deg, #0E5BA8, #1976D2)' }
            },
              React.createElement('div', null,
                React.createElement('div', { className: 'text-[11px] uppercase tracking-wider font-semibold text-white/80 mb-0.5' }, T[lang].catCompaniesListTitle),
                React.createElement('div', { className: 'text-sm font-medium text-white' },
                  companiesPopup.answer === 'yes' ? '✓ ' + T[lang].yesLabel
                    : companiesPopup.answer === 'no' ? '✗ ' + T[lang].noLabel
                    : '◐ ' + T[lang].partialLabel,
                  ' · ', companiesPopup.list.length
                )
              ),
              React.createElement('button', {
                onClick: () => setCompaniesPopup(null),
                className: 'w-8 h-8 rounded-full bg-white/20 hover:bg-white/30 text-white flex items-center justify-center'
              }, '✕')
            ),
            React.createElement('div', { className: 'p-4 border-b border-stone-100 bg-stone-50' },
              React.createElement('div', { className: 'text-[12px] text-stone-600 leading-snug' }, companiesPopup.qText)
            ),
            React.createElement('div', { className: 'overflow-y-auto flex-1 scrollbar-thin' },
              companiesPopup.list.length === 0
                ? React.createElement('div', { className: 'text-center py-8 text-stone-400 text-sm' }, T[lang].catCompaniesNoData)
                : React.createElement('div', { className: 'divide-y divide-stone-100' },
                    companiesPopup.list.map(c => React.createElement('div', {
                      key: c.id,
                      className: 'px-5 py-3 hover:bg-stone-50'
                    },
                      React.createElement('div', { className: 'text-sm font-medium text-stone-900' }, c.name || '—'),
                      React.createElement('div', { className: 'text-[11px] text-stone-400 font-mono mt-0.5' }, c.id, ' · ', c.contact || '—')
                    ))
                  )
            )
          )
        ) : null,

        // Reset confirmation modal
        confirmReset ? React.createElement('div', {
          className: 'fixed inset-0 bg-black/50 flex items-center justify-center px-4 z-50 fade-in',
          onClick: closeResetModal
        },
          React.createElement('div', {
            className: 'bg-white rounded-xl max-w-md w-full p-6 shadow-2xl',
            onClick: e => e.stopPropagation()
          },
            React.createElement('div', { className: 'flex items-start gap-4 mb-5' },
              React.createElement('div', {
                className: 'w-12 h-12 rounded-full bg-rose-100 text-rose-600 flex items-center justify-center text-2xl flex-shrink-0'
              }, '⚠️'),
              React.createElement('div', null,
                React.createElement('h3', { className: 'text-base font-semibold text-stone-900 mb-1' }, T[lang].catsResetConfirmTitle),
                React.createElement('p', { className: 'text-sm text-stone-600' }, T[lang].catsResetConfirmMsg)
              )
            ),
            // Password input
            React.createElement('div', { className: 'mb-4' },
              React.createElement('label', {
                className: 'block text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-1.5'
              }, T[lang].catsResetPasswordLabel),
              React.createElement('input', {
                type: 'password',
                value: resetPassword,
                onChange: e => { setResetPassword(e.target.value); setResetPasswordError(''); },
                onKeyDown: e => { if (e.key === 'Enter' && !resetting) handleReset(); },
                disabled: resetting,
                autoFocus: true,
                placeholder: T[lang].catsResetPasswordPlaceholder,
                className: 'w-full h-10 px-3 text-sm border border-stone-300 rounded-lg focus:outline-none focus:border-rose-500 focus:ring-1 focus:ring-rose-500 disabled:opacity-50'
              }),
              resetPasswordError ? React.createElement('div', {
                className: 'mt-1.5 text-[12px] text-rose-600'
              }, '✗ ' + resetPasswordError) : null
            ),
            React.createElement('div', { className: 'flex gap-2 justify-end' },
              React.createElement('button', {
                onClick: closeResetModal,
                disabled: resetting,
                className: 'h-10 px-4 text-sm text-stone-700 border border-stone-200 hover:bg-stone-50 rounded-lg transition disabled:opacity-50'
              }, T[lang].cancel),
              React.createElement('button', {
                onClick: handleReset,
                disabled: resetting || !resetPassword,
                className: 'h-10 px-4 text-sm font-medium bg-rose-600 hover:bg-rose-700 text-white rounded-lg transition disabled:opacity-50'
              }, resetting ? '...' : T[lang].catsResetConfirmBtn)
            )
          )
        ) : null
      );
    }

    // ============================================
    // v10b: ANALYSIS SCREEN (wrapper for AnalysisSection)
    // ============================================
    function AnalysisScreen({ companies, allAnswersByCompany, allAdminAnswersByCompany, lang }) {
      return React.createElement('div', { className: 'fade-in' },
        React.createElement(AnalysisSection, { companies, allAnswersByCompany, lang })
      );
    }

    // ============================================
    // v10b: PRIORITY SCREEN (wrapper for PrioritySection)
    // ============================================
    function PriorityScreen({ companies, allAnswersByCompany, allAdminAnswersByCompany, lang }) {
      return React.createElement('div', { className: 'fade-in' },
        React.createElement(PrioritySection, { companies, allAnswersByCompany, allAdminAnswersByCompany, lang })
      );
    }

    // ============================================
    // ROOT APP
    // ============================================
    function App() {
      const [authed, setAuthed] = useState(sessionStorage.getItem('esg_admin_auth') === '1');
      const [view, setView] = useState('list'); // 'list' or 'detail'
      const [selectedId, setSelectedId] = useState(null);
      const [companies, setCompanies] = useState([]);
      const [allAnswersByCompany, setAllAnswersByCompany] = useState({});
      const [allAdminAnswersByCompany, setAllAdminAnswersByCompany] = useState({});
      const [loading, setLoading] = useState(false);
      const [lang, setLang] = useState(() => localStorage.getItem('esg_admin_lang') || 'ka');

      useEffect(() => {
        localStorage.setItem('esg_admin_lang', lang);
        document.documentElement.lang = lang;
      }, [lang]);

      const refresh = async () => {
        setLoading(true);
        const list = await loadAllCompanies();
        setCompanies(list);
        // Load weights (v8) — needed for weighted score calculation on list
        await loadWeights();
        // Load contractor answers for each in parallel
        const answersMap = {};
        const adminAnswersMap = {};
        await Promise.all(list.map(async c => {
          const a = await loadCompanyAnswers(c.id);
          answersMap[c.id] = a;
          const { data: adm } = await loadAdminAnswers(c.id);
          adminAnswersMap[c.id] = adm || [];
        }));
        setAllAnswersByCompany(answersMap);
        setAllAdminAnswersByCompany(adminAnswersMap);
        // Initialize category map from DB (or defaults)
        await initCategoryMap(Object.keys(QUESTIONS));
        setLoading(false);
      };

      useEffect(() => {
        if (authed) refresh();
      }, [authed]);

      const onLogout = () => {
        sessionStorage.removeItem('esg_admin_auth');
        setAuthed(false);
      };

      if (!authed) return React.createElement(LoginScreen, { onLogin: () => setAuthed(true), lang, setLang });

      return React.createElement('div', { className: 'min-h-screen' },
        React.createElement(AdminHeader, {
          onLogout,
          currentView: view,
          onNavigate: (v) => { setView(v); if (v === 'list') refresh(); },
          lang, setLang
        }),
        React.createElement('main', { className: 'max-w-7xl mx-auto px-6 py-6' },
          loading
            ? React.createElement('div', { className: 'text-center py-20 text-stone-400 text-sm' }, T[lang].loadingData)
            : view === 'list'
              ? React.createElement(CompanyListScreen, {
                  companies, allAnswersByCompany, allAdminAnswersByCompany,
                  onSelectCompany: (id) => { setSelectedId(id); setView('detail'); },
                  onRefresh: refresh,
                  lang
                })
              : view === 'categories'
                ? React.createElement(CategoriesScreen, {
                    companies, allAnswersByCompany, allAdminAnswersByCompany, lang
                  })
                : view === 'analysis'
                  ? React.createElement(AnalysisScreen, {
                      companies, allAnswersByCompany, allAdminAnswersByCompany, lang
                    })
                  : view === 'priority'
                    ? React.createElement(PriorityScreen, {
                        companies, allAnswersByCompany, allAdminAnswersByCompany, lang
                      })
                    : React.createElement(CompanyDetailScreen, {
                        companyId: selectedId,
                        onBack: () => setView('list'),
                        lang
                      })
        )
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
