    function getSectionIndex(qid) {
      for (let i = 0; i < SECTION_PREFIXES.length; i++) {
        if (qid.startsWith(SECTION_PREFIXES[i])) return i;
      }
      return -1;
    }

    // Helper: escape HTML
    function escapeHtml(s) {
      if (!s) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');

    async function loadAllCompanies() {
      const { data, error } = await supabase

    async function loadCompanyAnswers(companyId) {
      const { data, error } = await supabase
        .from('esg_answers')
        .select('*')
        .eq('company_id', companyId);
      if (error) console.error('Load answers error:', error);
      return data || [];
    }

    async function deleteCompany(companyId) {
      // Need to delete answers first (FK constraint)
      const { error: ansErr } = await supabase
        .from('esg_answers')
        .delete()
        .eq('company_id', companyId);
      if (ansErr) {
        console.error('Delete answers error:', ansErr);
        return { error: ansErr };
      }
      // Also try admin_answers if any
      await supabase.from('esg_admin_answers').delete().eq('company_id', companyId);
      // Need to unlock first if locked, because RLS prevents updating locked companies
      // Use a workaround: directly delete (RLS may need to allow this)
      const { error: compErr } = await supabase
        .from('esg_companies')
        .delete()
        .eq('id', companyId);
      if (compErr) {
        console.error('Delete company error:', compErr);
        return { error: compErr };
      }
      return { success: true };
    }

    // Unlock a company so it can be edited again
    // Also archive current answers to history table (preserves previous version)
    async function unlockCompany(companyId) {
      // Step 1: Get current answers
      const { data: currentAnswers, error: loadErr } = await supabase
        .from('esg_answers')
        .select('*')
        .eq('company_id', companyId);
      if (loadErr) return { error: loadErr };

      // Step 2: Get submitted_at from company
      const { data: companyData } = await supabase
        .from('esg_companies')
        .select('submitted_at')
        .eq('id', companyId)
        .single();
      const submittedAt = companyData ? companyData.submitted_at : null;

      // Step 3: Delete any existing history for this company (we only keep one version)
      await supabase
        .from('esg_answers_history')
        .delete()
        .eq('company_id', companyId);

      // Step 4: Insert current answers into history
      if (currentAnswers && currentAnswers.length > 0) {
        const historyRows = currentAnswers.map(a => ({
          company_id: a.company_id,
          question_id: a.question_id,
          answer: a.answer,
          partial_text: a.partial_text,
          was_auto_suggested: a.was_auto_suggested,
          submitted_at: submittedAt
        }));
        const { error: insErr } = await supabase
          .from('esg_answers_history')
          .insert(historyRows);
        if (insErr) {
          console.error('History insert error:', insErr);
          // Continue anyway — unlock is more important than history
        }
      }

      // Step 5: Unlock the company
      const { error } = await supabase
        .from('esg_companies')
        .update({ is_locked: false, submitted_at: null })
        .eq('id', companyId);
      return { error };
    }

    // Load history answers for a company (if any)
    async function loadHistoryAnswers(companyId) {
      const { data, error } = await supabase
        .from('esg_answers_history')
        .select('*')
        .eq('company_id', companyId);
      if (error) return { data: null, error };
      return { data: data || [], error: null };
    }

    // ============================================
    async function loadCategoriesFromDb() {
      const { data, error } = await supabase
        .from('esg_question_categories')
        .select('*');
      if (error) {
        console.error('Load categories error:', error);
        return null;
      }
      if (!data || data.length === 0) return null;
      const map = {};
      data.forEach(r => { map[r.question_id] = r.category; });
      return map;
    }

    async function saveCategoriesToDb(categoryMap) {
      // Upsert all entries
      const rows = Object.entries(categoryMap).map(([qid, cat]) => ({
        question_id: qid,
        category: cat,
        updated_at: new Date().toISOString()
      }));
      const { error } = await supabase
        .from('esg_question_categories')
        .upsert(rows, { onConflict: 'question_id' });
      return { error };
    }

    async function resetCategoriesToDefault() {
      // Delete all category rows from DB
      const { error } = await supabase
        .from('esg_question_categories')
        .delete()
        .neq('question_id', '___nonexistent___');
      if (!error) {
        CATEGORY_MAP = buildDefaultCategoryMap();
      }
      return { error };
    }

    async function initCategoryMap(allQuestionIds) {
      const fromDb = await loadCategoriesFromDb();
      if (fromDb) {
        CATEGORY_MAP = fromDb;
      } else {
        CATEGORY_MAP = buildDefaultCategoryMap();
      }
      // Ensure ALL questions have a category (default to 2 if missing)
      allQuestionIds.forEach(qid => {
        if (!CATEGORY_MAP[qid]) CATEGORY_MAP[qid] = 2;
      });
      return CATEGORY_MAP;
    }

    // Calculate stats from answers array
    function calcStats(answers) {
      const total = answers.length;
      const yes = answers.filter(a => a.answer === 'yes').length;
      const no = answers.filter(a => a.answer === 'no').length;
      const partial = answers.filter(a => a.answer === 'partial').length;
      const score = total > 0 ? Math.round(((yes + partial * 0.5) / total) * 100) : 0;
      return { total, yes, no, partial, score };
    }

    // Calculate per-section stats
    function calcSectionStats(answers) {
      const sections = SECTION_PREFIXES.map(() => ({ yes: 0, no: 0, partial: 0, total: 0 }));
      answers.forEach(a => {
        const idx = getSectionIndex(a.question_id);
        if (idx === -1) return;
        sections[idx].total++;
        if (a.answer === 'yes') sections[idx].yes++;
        else if (a.answer === 'no') sections[idx].no++;
        else if (a.answer === 'partial') sections[idx].partial++;
      });
      return sections.map(s => ({
        ...s,
        score: s.total > 0 ? Math.round(((s.yes + s.partial * 0.5) / s.total) * 100) : 0
      }));
    }

      answers.forEach(a => {
        const idx = getSectionIndex(a.question_id);
        if (idx >= 0) answersBySection[idx].push(a);
      });
      answersBySection.forEach(arr => arr.sort((a, b) => a.question_id.localeCompare(b.question_id)));

      let html = `
        <div style="border-bottom: 3px solid #0E5BA8; padding-bottom: 20px; margin-bottom: 24px; display: flex; justify-content: space-between; align-items: flex-start;">
          <div>

          </div>
          <div style="text-align: right;">
            <div style="font-size: 11px; color: #78716c; font-weight: 500; margin-bottom: 4px;">${T[lang].pdfTotalScore}</div>
            <div style="font-size: 32px; font-weight: 600; color: ${scoreColor}; line-height: 1;">${stats.score}%</div>
            <div style="font-size: 10px; color: #78716c; margin-top: 4px;">${T[lang].pdfGenerated}: ${dateStr}</div>
          </div>
        </div>

        <div style="background: #F5F8FC; border: 1px solid #E0E7F0; border-radius: 10px; padding: 16px 20px; margin-bottom: 24px;">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px 24px; font-size: 12px;">
            <div>
              <div style="color: #78716c; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; margin-bottom: 3px;">${T[lang].pdfCompany}</div>
              <div style="font-weight: 500;">${escapeHtml(company.name || '—')}</div>
            </div>
            <div>
              <div style="color: #78716c; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; margin-bottom: 3px;">${T[lang].pdfId}</div>
              <div style="font-weight: 500;">${escapeHtml(company.id || '')}</div>
            </div>
            <div>
              <div style="color: #78716c; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; margin-bottom: 3px;">${T[lang].pdfContact}</div>
              <div style="font-weight: 500;">${escapeHtml(company.contact || '—')}</div>
            </div>
            <div>
              <div style="color: #78716c; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 500; margin-bottom: 3px;">${T[lang].pdfDate}</div>
              <div style="font-weight: 500;">${submittedStr}</div>
            </div>
          </div>
        </div>

        <h2 style="font-size: 14px; font-weight: 600; color: #0E5BA8; margin: 0 0 12px; padding-bottom: 6px; border-bottom: 1px solid #E0E7F0;">${T[lang].pdfSectionScoresTitle}</h2>
        <div style="margin-bottom: 24px;">
          ${sectionStats.map((s, i) => {
            const c = s.score >= 70 ? '#059669' : s.score >= 40 ? '#d97706' : '#dc2626';
            return `<div style="margin-bottom: 8px;">
              <div style="display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 3px;">
                <span style="font-weight: 500;">${i+1}. ${escapeHtml(SECTION_NAMES[lang][i])}</span>
                <span style="font-weight: 600; color: ${c};">${s.score}%</span>
              </div>
              <div style="height: 6px; background: #f0f0f0; border-radius: 3px; overflow: hidden;">
                <div style="height: 100%; width: ${s.score}%; background: ${c};"></div>
              </div>
            </div>`;
          }).join('')}
        </div>
      `;

      // Section answers
      answersBySection.forEach((arr, sIdx) => {
        if (arr.length === 0) return;
        html += `<div style="margin-bottom: 20px; page-break-inside: avoid;">
          <h2 style="font-size: 14px; font-weight: 600; color: #0E5BA8; margin: 0 0 10px; padding-bottom: 6px; border-bottom: 1px solid #E0E7F0;">
            ${sIdx + 1}. ${escapeHtml(SECTION_NAMES[lang][sIdx])} 
            <span style="float: right; font-size: 11px; color: #78716c; font-weight: 500;">${sectionStats[sIdx].score}%</span>
          </h2>`;

        arr.forEach((a, qIdx) => {
          const qText = QUESTIONS[a.question_id] ? QUESTIONS[a.question_id][lang] : a.question_id;
          const ansVal = a.answer || '';
          const ansLabel = ansVal === 'yes' ? '✓ ' + T[lang].yesShort : ansVal === 'no' ? '✗ ' + T[lang].noShort : ansVal === 'partial' ? '◐ ' + T[lang].partialShort : '—';
          const ansColor = ansVal === 'yes' ? '#059669' : ansVal === 'no' ? '#dc2626' : ansVal === 'partial' ? '#d97706' : '#78716c';
          const ansBg = ansVal === 'yes' ? '#ECFDF5' : ansVal === 'no' ? '#FEF2F2' : ansVal === 'partial' ? '#FFFBEB' : '#F5F5F4';
          const auto = a.was_auto_suggested ? ' (' + T[lang].autoFilled + ')' : '';

          html += `<div style="margin-bottom: 6px; padding: 8px 12px; border: 1px solid #E7E5E4; border-radius: 6px; background: white;">
            <div style="display: flex; gap: 10px; align-items: flex-start;">
              <div style="font-size: 10px; color: #a8a29e; font-weight: 500; min-width: 22px;">${qIdx + 1}.</div>
              <div style="flex: 1;">
                <div style="font-size: 11px; line-height: 1.5; color: #1c1917;">${escapeHtml(qText)}</div>
              </div>
              <div style="font-size: 10px; font-weight: 600; color: ${ansColor}; background: ${ansBg}; padding: 3px 8px; border-radius: 4px; white-space: nowrap;">${ansLabel}${auto}</div>
            </div>
            ${ansVal === 'partial' ? `<div style="margin-top: 8px; margin-left: 32px; padding: 8px 10px; background: #FFFBEB; border-left: 3px solid #F59E0B; border-radius: 0 4px 4px 0;">
              <div style="font-size: 9px; font-weight: 600; color: #92400e; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 3px;">${T[lang].noteLabel}</div>
              <div style="font-size: 10.5px; line-height: 1.5; color: #1c1917; white-space: pre-wrap;">${a.partial_text ? escapeHtml(a.partial_text) : '<span style="color:#a8a29e; font-style: italic;">' + (lang === 'ka' ? 'განმარტება არ არის მითითებული' : 'No explanation provided') + '</span>'}</div>
            </div>` : ''}
          </div>`;
        });

        html += `</div>`;
      });

      html += `<div style="margin-top: 30px; padding-top: 16px; border-top: 1px solid #E0E7F0; text-align: center; font-size: 10px; color: #a8a29e;">
        ${T[lang].pdfFooter} • ${dateStr}
      </div>`;

      container.innerHTML = html;
      document.body.appendChild(container);

      try {
        await new Promise(r => setTimeout(r, 800));
        const canvas = await html2canvas(container, {
          scale: 2, useCORS: true, allowTaint: true, backgroundColor: '#ffffff',
          logging: false, windowWidth: 794, imageTimeout: 5000
        });
        const imgWidth = 210, pageHeight = 297;
        const imgHeight = (canvas.height * imgWidth) / canvas.width;
        let heightLeft = imgHeight, position = 0;
        const imgData = canvas.toDataURL('image/jpeg', 0.92);
        doc.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
        heightLeft -= pageHeight;
        while (heightLeft > 0) {
          position = heightLeft - imgHeight;
          doc.addPage();
          doc.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight);
          heightLeft -= pageHeight;
        }
        const historySuffix = isHistory ? '_PREVIOUS' : '';
        const filename = `ESG_Admin_${(company.name || 'company').replace(/[^a-zA-Z0-9-_]/g, '_')}${historySuffix}_${new Date().toISOString().split('T')[0]}_${lang}.pdf`;
        doc.save(filename);
      } finally {
        document.body.removeChild(container);
      }
    }

    // ============================================
    // CATEGORIES MANAGEMENT SCREEN
    // ============================================
    function CategoriesScreen({ companies, allAnswersByCompany, lang }) {
      // Local state: copy of CATEGORY_MAP for editing
      const [localMap, setLocalMap] = useState({ ...CATEGORY_MAP });
      const [savedMap, setSavedMap] = useState({ ...CATEGORY_MAP });
      const [saving, setSaving] = useState(false);
      const [saved, setSaved] = useState(false);
      const [confirmReset, setConfirmReset] = useState(false);
      const [resetting, setResetting] = useState(false);
      const [companiesPopup, setCompaniesPopup] = useState(null); // { qid, answer, list[] }
      const [draggedQid, setDraggedQid] = useState(null);
      const [dragOverCat, setDragOverCat] = useState(null);

      const allQids = Object.keys(QUESTIONS).sort();

      // Compute stats per question
      const questionStats = useMemo(() => {
        const stats = {};
        allQids.forEach(qid => {
          stats[qid] = { yes: [], no: [], partial: [] };
        });
        // Only count submitted (locked) companies
        const submittedCompanies = companies.filter(c => c.is_locked);
        submittedCompanies.forEach(c => {
          const ans = allAnswersByCompany[c.id] || [];
          ans.forEach(a => {
            if (stats[a.question_id]) {
              if (a.answer === 'yes') stats[a.question_id].yes.push(c);
              else if (a.answer === 'no') stats[a.question_id].no.push(c);
              else if (a.answer === 'partial') stats[a.question_id].partial.push(c);
            }
          });
        });
        return stats;
      }, [companies, allAnswersByCompany]);

      // Group questions by current local category
      const grouped = useMemo(() => {
        const g = { 1: [], 2: [], 3: [] };
        allQids.forEach(qid => {
          const cat = localMap[qid] || 2;
          g[cat].push(qid);
        });
        return g;
      }, [localMap]);

      const hasChanges = JSON.stringify(localMap) !== JSON.stringify(savedMap);

      const handleDragStart = (qid) => setDraggedQid(qid);
      const handleDragEnd = () => { setDraggedQid(null); setDragOverCat(null); };
      const handleDragOver = (e, cat) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        setDragOverCat(cat);
      };
      const handleDragLeave = (e) => {
        // only clear if actually leaving (not entering child)
        if (e.currentTarget.contains(e.relatedTarget)) return;
        setDragOverCat(null);
      };
      const handleDrop = (e, cat) => {
        e.preventDefault();
        if (draggedQid && localMap[draggedQid] !== cat) {
          setLocalMap({ ...localMap, [draggedQid]: cat });
        }
        setDraggedQid(null);
        setDragOverCat(null);
      };

      const handleSave = async () => {
        setSaving(true);
        const { error } = await saveCategoriesToDb(localMap);
        setSaving(false);
        if (error) {
          alert(T[lang].catsSaveFailed + (error.message || error.code || 'unknown'));
          return;
        }
        // Update global CATEGORY_MAP
        CATEGORY_MAP = { ...localMap };
        setSavedMap({ ...localMap });
        setSaved(true);
        setTimeout(() => setSaved(false), 2500);
      };

      const handleReset = async () => {
        setResetting(true);
        const { error } = await resetCategoriesToDefault();
        setResetting(false);
        if (error) {
          alert(T[lang].catsSaveFailed + (error.message || error.code || 'unknown'));
          return;
        }
        const defaults = buildDefaultCategoryMap();
        allQids.forEach(qid => { if (!defaults[qid]) defaults[qid] = 2; });
        CATEGORY_MAP = { ...defaults };
        setLocalMap({ ...defaults });
        setSavedMap({ ...defaults });
        setConfirmReset(false);
      };

      const renderColumn = (cat) => {
        const titles = { 1: T[lang].cat1Title, 2: T[lang].cat2Title, 3: T[lang].cat3Title };
        const descs = { 1: T[lang].cat1Desc, 2: T[lang].cat2Desc, 3: T[lang].cat3Desc };
        const color = getCategoryColor(cat);
        const isDropTarget = dragOverCat === cat;
        const list = grouped[cat];
        return React.createElement('div', {
          key: cat,
          onDragOver: (e) => handleDragOver(e, cat),
          onDragLeave: handleDragLeave,
          onDrop: (e) => handleDrop(e, cat),
          className: `rounded-xl border-2 ${isDropTarget ? 'border-blue-400 bg-blue-50' : color.border + ' ' + color.bg} p-3 transition`,
          style: { minHeight: '300px' }
        },
          // Header
          React.createElement('div', { className: 'mb-3 px-2' },
            React.createElement('div', { className: 'flex items-center justify-between mb-1' },
              React.createElement('h3', { className: `text-sm font-semibold ${color.text}` }, titles[cat]),
              React.createElement('span', {
                className: `text-[11px] font-bold rounded-full px-2 py-0.5 bg-white ${color.text} border ${color.border}`
              }, list.length)
            ),
            React.createElement('p', { className: 'text-[11px] text-stone-500' }, descs[cat])
          ),
          // Questions list
          React.createElement('div', { className: 'space-y-1.5' },
            list.length === 0
              ? React.createElement('div', { className: 'text-center py-6 text-xs text-stone-400 italic' }, '—')
              : list.map(qid => {
                  const qText = QUESTIONS[qid] ? QUESTIONS[qid][lang] : qid;
                  const s = questionStats[qid] || { yes: [], no: [], partial: [] };
                  const isDragging = draggedQid === qid;
                  const sIdx = getSectionIndex(qid);
                  const sName = sIdx >= 0 ? SECTION_NAMES[lang][sIdx] : '';
                  return React.createElement('div', {
                    key: qid,
                    draggable: true,
                    onDragStart: () => handleDragStart(qid),
                    onDragEnd: handleDragEnd,
                    className: `bg-white border border-stone-200 rounded-lg p-2.5 cursor-move hover:shadow-sm hover:border-blue-300 transition ${isDragging ? 'opacity-40' : ''}`
                  },
                    React.createElement('div', { className: 'flex items-start gap-2 mb-1.5' },
                      React.createElement('span', { className: 'text-stone-300 text-sm flex-shrink-0 mt-0.5' }, '⋮⋮'),
                      React.createElement('div', { className: 'flex-1 min-w-0' },
                        React.createElement('div', { className: 'text-[10px] font-bold text-blue-700 uppercase tracking-wide mb-1' }, sName),
                        React.createElement('div', { className: 'text-[12px] text-stone-800 leading-snug' }, qText),
                        React.createElement('div', { className: 'text-[9px] text-stone-300 font-mono mt-0.5' }, qid)
                      )
                    ),
                    // Mini stats
                    React.createElement('div', { className: 'flex gap-1 text-[10px] mt-1.5 ml-5' },
                      React.createElement('button', {
                        onClick: (e) => { e.stopPropagation(); if (s.yes.length > 0) setCompaniesPopup({ qid, qText, answer: 'yes', list: s.yes }); },
                        disabled: s.yes.length === 0,
                        className: 'flex items-center gap-1 px-1.5 py-0.5 bg-emerald-50 border border-emerald-200 text-emerald-700 rounded hover:bg-emerald-100 transition disabled:opacity-40 disabled:cursor-default'
                      },
                        React.createElement('span', { className: 'font-medium' }, '✓'),
                        React.createElement('span', { className: 'font-semibold' }, s.yes.length)
                      ),
                      React.createElement('button', {
                        onClick: (e) => { e.stopPropagation(); if (s.partial.length > 0) setCompaniesPopup({ qid, qText, answer: 'partial', list: s.partial }); },
                        disabled: s.partial.length === 0,
                        className: 'flex items-center gap-1 px-1.5 py-0.5 bg-amber-50 border border-amber-200 text-amber-700 rounded hover:bg-amber-100 transition disabled:opacity-40 disabled:cursor-default'
                      },
                        React.createElement('span', { className: 'font-medium' }, '◐'),
                        React.createElement('span', { className: 'font-semibold' }, s.partial.length)
                      ),
                      React.createElement('button', {
                        onClick: (e) => { e.stopPropagation(); if (s.no.length > 0) setCompaniesPopup({ qid, qText, answer: 'no', list: s.no }); },
                        disabled: s.no.length === 0,
                        className: 'flex items-center gap-1 px-1.5 py-0.5 bg-rose-50 border border-rose-200 text-rose-700 rounded hover:bg-rose-100 transition disabled:opacity-40 disabled:cursor-default'
                      },
                        React.createElement('span', { className: 'font-medium' }, '✗'),
                        React.createElement('span', { className: 'font-semibold' }, s.no.length)
                      )
                    )
                  );
                })
          )
        );
      };

      return React.createElement('div', { className: 'fade-in' },
        // Header
        React.createElement('div', { className: 'flex flex-wrap items-start justify-between gap-3 mb-5' },
          React.createElement('div', null,
            React.createElement('h1', { className: 'text-xl font-semibold text-stone-900' }, T[lang].catsPageTitle),
            React.createElement('p', { className: 'text-sm text-stone-500 mt-1 max-w-2xl' }, T[lang].catsPageSubtitle)
          ),
          React.createElement('div', { className: 'flex flex-wrap gap-2 items-center' },
            hasChanges && !saved ? React.createElement('span', {
              className: 'text-xs px-2 py-1 bg-amber-50 text-amber-700 border border-amber-200 rounded-md'
            }, '● ' + T[lang].catsHasChanges) : null,
            React.createElement('button', {
              onClick: () => setConfirmReset(true),
              className: 'h-10 px-4 text-sm font-medium text-stone-700 border border-stone-300 hover:bg-stone-50 rounded-lg transition'
            }, T[lang].catsReset),
            React.createElement('button', {
              onClick: handleSave,
              disabled: !hasChanges || saving,
              className: 'h-10 px-5 text-sm font-medium text-white rounded-lg shadow-sm hover:shadow disabled:opacity-50 transition',
              style: { background: saved ? '#059669' : 'linear-gradient(135deg, #0E5BA8, #1976D2)' }
            }, saving ? '...' : (saved ? T[lang].catsSaved : T[lang].catsSave))
          )
        ),

        // Three columns
        React.createElement('div', { className: 'grid grid-cols-1 md:grid-cols-3 gap-4' },
          renderColumn(1),
          renderColumn(2),
          renderColumn(3)
        ),

        // Companies popup
        companiesPopup ? React.createElement('div', {
          className: 'fixed inset-0 bg-black/50 flex items-center justify-center px-4 py-6 z-50 fade-in',
          onClick: () => setCompaniesPopup(null)
        },
          React.createElement('div', {
            className: 'bg-white rounded-2xl max-w-lg w-full max-h-[calc(100vh-100px)] shadow-2xl overflow-hidden flex flex-col',
            onClick: e => e.stopPropagation()
          },
            React.createElement('div', {
              className: 'flex items-center justify-between px-5 py-4 border-b border-stone-100',
              style: { background: 'linear-gradient(135deg, #0E5BA8, #1976D2)' }
            },
              React.createElement('div', null,
                React.createElement('div', { className: 'text-[11px] uppercase tracking-wider font-semibold text-white/80 mb-0.5' }, T[lang].catCompaniesListTitle),
                React.createElement('div', { className: 'text-sm font-medium text-white' },
                  companiesPopup.answer === 'yes' ? '✓ ' + T[lang].yesLabel
                    : companiesPopup.answer === 'no' ? '✗ ' + T[lang].noLabel
                    : '◐ ' + T[lang].partialLabel,
                  ' · ', companiesPopup.list.length
                )
              ),
              React.createElement('button', {
                onClick: () => setCompaniesPopup(null),
                className: 'w-8 h-8 rounded-full bg-white/20 hover:bg-white/30 text-white flex items-center justify-center'
              }, '✕')
            ),
            React.createElement('div', { className: 'p-4 border-b border-stone-100 bg-stone-50' },
              React.createElement('div', { className: 'text-[12px] text-stone-600 leading-snug' }, companiesPopup.qText)
            ),
            React.createElement('div', { className: 'overflow-y-auto flex-1 scrollbar-thin' },
              companiesPopup.list.length === 0
                ? React.createElement('div', { className: 'text-center py-8 text-stone-400 text-sm' }, T[lang].catCompaniesNoData)
                : React.createElement('div', { className: 'divide-y divide-stone-100' },
                    companiesPopup.list.map(c => React.createElement('div', {
                      key: c.id,
                      className: 'px-5 py-3 hover:bg-stone-50'
                    },
                      React.createElement('div', { className: 'text-sm font-medium text-stone-900' }, c.name || '—'),
                      React.createElement('div', { className: 'text-[11px] text-stone-400 font-mono mt-0.5' }, c.id, ' · ', c.contact || '—')
                    ))
                  )
            )
          )
        ) : null,

        // Reset confirmation modal
        confirmReset ? React.createElement('div', {
          className: 'fixed inset-0 bg-black/50 flex items-center justify-center px-4 z-50 fade-in',
          onClick: () => !resetting && setConfirmReset(false)
        },
          React.createElement('div', {
            className: 'bg-white rounded-xl max-w-md w-full p-6 shadow-2xl',
            onClick: e => e.stopPropagation()
          },
            React.createElement('div', { className: 'flex items-start gap-4 mb-5' },
              React.createElement('div', {
                className: 'w-12 h-12 rounded-full bg-stone-100 text-stone-600 flex items-center justify-center text-2xl flex-shrink-0'
              }, '↺'),
              React.createElement('div', null,
                React.createElement('h3', { className: 'text-base font-semibold text-stone-900 mb-1' }, T[lang].catsResetConfirmTitle),
                React.createElement('p', { className: 'text-sm text-stone-600' }, T[lang].catsResetConfirmMsg)
              )
            ),
            React.createElement('div', { className: 'flex gap-2 justify-end' },
              React.createElement('button', {
                onClick: () => setConfirmReset(false),
                disabled: resetting,
                className: 'h-10 px-4 text-sm text-stone-700 border border-stone-200 hover:bg-stone-50 rounded-lg transition disabled:opacity-50'
              }, T[lang].cancel),
              React.createElement('button', {
                onClick: handleReset,
                disabled: resetting,
                className: 'h-10 px-4 text-sm font-medium bg-stone-700 hover:bg-stone-800 text-white rounded-lg transition disabled:opacity-50'
              }, resetting ? '...' : T[lang].catsResetConfirmBtn)
            )
          )
        ) : null
      );
    }

    // ============================================
    // ROOT APP
    // ============================================
    function App() {
      const [authed, setAuthed] = useState(sessionStorage.getItem('esg_admin_auth') === '1');
      const [view, setView] = useState('list'); // 'list' or 'detail'
      const [selectedId, setSelectedId] = useState(null);
      const [companies, setCompanies] = useState([]);
      const [allAnswersByCompany, setAllAnswersByCompany] = useState({});
      const [loading, setLoading] = useState(false);
      const [lang, setLang] = useState(() => localStorage.getItem('esg_admin_lang') || 'ka');

      useEffect(() => {
        localStorage.setItem('esg_admin_lang', lang);
        document.documentElement.lang = lang;
      }, [lang]);

      const refresh = async () => {
        setLoading(true);
        const list = await loadAllCompanies();
        setCompanies(list);
        // Load answers for each in parallel
        const answersMap = {};
        await Promise.all(list.map(async c => {
          const a = await loadCompanyAnswers(c.id);
          answersMap[c.id] = a;
        }));
        setAllAnswersByCompany(answersMap);
        // Initialize category map from DB (or defaults)
        await initCategoryMap(Object.keys(QUESTIONS));
        setLoading(false);
      };

      useEffect(() => {
        if (authed) refresh();
      }, [authed]);

      const onLogout = () => {
        sessionStorage.removeItem('esg_admin_auth');
        setAuthed(false);
      };

      if (!authed) return React.createElement(LoginScreen, { onLogin: () => setAuthed(true), lang, setLang });

      return React.createElement('div', { className: 'min-h-screen' },
        React.createElement(AdminHeader, {
          onLogout,
          currentView: view,
          onNavigate: (v) => { setView(v); if (v === 'list') refresh(); },
          lang, setLang
        }),
        React.createElement('main', { className: 'max-w-7xl mx-auto px-6 py-6' },
          loading
            ? React.createElement('div', { className: 'text-center py-20 text-stone-400 text-sm' }, T[lang].loadingData)
            : view === 'list'
              ? React.createElement(CompanyListScreen, {
                  companies, allAnswersByCompany,
                  onSelectCompany: (id) => { setSelectedId(id); setView('detail'); },
                  onRefresh: refresh,
                  lang
                })
              : view === 'categories'
                ? React.createElement(CategoriesScreen, {
                    companies, allAnswersByCompany, lang
                  })
                : React.createElement(CompanyDetailScreen, {
                    companyId: selectedId,
                    onBack: () => setView('list'),
                    lang
                  })
        )
      );
    }

    const root = createRoot(document.getElementById('root'));
    root.render(React.createElement(App));
  </script>
</body>
</html>
